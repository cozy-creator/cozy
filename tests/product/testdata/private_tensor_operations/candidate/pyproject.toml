[project]
name = "tensor-candidate"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime==0.10.3", "tensorfs>=0.3.26,<0.3.27"]

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tensor_candidate.py"]

[project.entry-points."cozy.application"]
default = "tensor_candidate:app"
