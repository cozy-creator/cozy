[project]
name = "attention-kernel-benchmark"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.18.4", "torch>=2.13,<3", "diffusers>=0.35", "msgspec>=0.21"]

[project.entry-points."cozy.application"]
default = "attention_benchmark:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["attention_benchmark.py"]
