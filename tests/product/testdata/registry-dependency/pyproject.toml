[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "registry-dependency-proof"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "cozy-runtime==0.0.11",
    "humanize==4.13.0",
    "numpy==2.5.2",
    "pillow==12.3.0",
    "torch>=2.13,<3",
]

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
cozy-runtime = { path = "__COZY_RUNTIME_FIXTURE__", editable = true }
