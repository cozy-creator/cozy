[project]
name = "publication-source-tools"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime>=0.14.1", "tensorfs>=0.3.36"]

[project.entry-points."cozy.application"]
default = "publication_source:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["publication_source.py"]
