name: platforms
# Native builds on every desktop platform, Linux x86_64 as the control. Manual only: macOS
# bills 10x and Windows 2x, so run it per question, never per push.
#   gh workflow run platforms.yaml -R cozy-creator/tensorfs --ref <branch> [-f os='["macos-15"]'] [-f test='cargo test -p tensorfs-core --lib']
# Each job uploads build.txt (rustc short diagnostics) and a step summary of its errors.
on:
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]'
      test:
        description: Optional command run with bash after the build; empty runs none
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91.1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Workspace, every target
        id: workspace
        continue-on-error: true
        run: cargo build --locked --workspace --all-targets --keep-going --message-format=short 2>&1 | tee build.txt; exit "${PIPESTATUS[0]}"

      - name: Plane-only (no store)
        id: plane
        continue-on-error: true
        run: cargo check --locked -p tensorfs-core -p tensorfs-plane --no-default-features --message-format=short 2>&1 | tee plane.txt; exit "${PIPESTATUS[0]}"

      - name: Wheel
        id: wheel
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo build --locked -p tensorfs-core --bin tfs
          mkdir -p wheel-data/scripts
          cp target/debug/tfs* wheel-data/scripts/
          rm -f wheel-data/scripts/tfs.d wheel-data/scripts/tfs.pdb
          pip install maturin==1.15.0
          maturin build --locked --out dist 2>&1 | tee wheel.txt
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import tensorfs, tensorfs._ext, tensorfs.plane; print("import ok", tensorfs.__file__)'
          tfs version

      - name: Test
        if: inputs.test != ''
        id: test
        continue-on-error: true
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST" 2>&1 | tee test.txt; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo "workspace=${{ steps.workspace.outcome }} plane=${{ steps.plane.outcome }} wheel=${{ steps.wheel.outcome }} test=${{ steps.test.outcome }}"
            for f in build.txt plane.txt; do
              [ -f "$f" ] || continue
              echo "### $f: $(grep -c ': error' "$f" || true) errors"
              echo '```'
              grep -E ': error|^error: could not compile' "$f" | sort | uniq | head -300 || true
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tensorfs-${{ matrix.os }}
          path: |
            build.txt
            plane.txt
            wheel.txt
            test.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        run: test "${{ steps.workspace.outcome }}/${{ steps.wheel.outcome }}" = success/success
