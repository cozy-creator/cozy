name: ci
# Automatic, on master pushes that touch Rust: `cargo check` of every crate and target, and
# the download path (below). On every pull request: `download-path`, which tests when the
# PR touches the download path. On demand, before a release (full suite, fences, version guards, wheel e2e):
#   gh workflow run ci.yaml -R cozy-creator/tensorfs --ref <branch> [-f scope=cache-owner]
on:
  push:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yaml"]
  # Every PR reports `download-path` (a required check); it tests only when the PR
  # touches the download path.
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope
        type: choice
        options: [full, cache-owner]
        default: full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  # Model weights must keep arriving (run 2322, 2026-10-01): slow chunk answers, resets,
  # stalls, 5xx/429/Retry-After, expired URLs, wrong bytes, hub weather and verdicts,
  # cancellation and resume, all over real loopback HTTP through the Fetcher (`fetch::whole`).
  download-path:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          BASE: ${{ github.base_ref }}
        run: |
          path='^(crates/tensorfs-core/src/(transport/|fetch|admission|store\.rs|catalog|meta\.rs|gc\.rs|unsynced)|crates/tensorfs-core/tests/(fetch_faults|fd_budget)\.rs|crates/tensorfs-py/src/|Cargo\.(toml|lock)$|\.github/workflows/ci\.yaml$)'
          if [ -n "$BASE" ] && ! git diff --name-only "origin/$BASE...HEAD" | grep -qE "$path"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@1.91.1
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
      - if: steps.scope.outputs.run == 'true'
        run: cargo test -p tensorfs-core --test fetch_faults --test fd_budget -- --test-threads=2
      - if: steps.scope.outputs.run == 'true'
        run: "cargo test -p tensorfs-core --lib transport:: -- --test-threads=2"

  cache-owner:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'cache-owner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tensorfs-core --lib --tests -- -D warnings -A clippy::style
      - run: cargo test -p tensorfs-core --lib cache_identity_restores_and_does_not_change_other_threads --no-run
      - name: Root cache identity, thread isolation, and unwind restoration
        run: |
          set -eu
          found=false
          for proof in target/debug/deps/tensorfs_core-*; do
            if [ -f "$proof" ] && [ -x "$proof" ]; then
              found=true
              sudo "$proof" --exact filesystem_identity::linux::tests::cache_identity_restores_and_does_not_change_other_threads --nocapture
            fi
          done
          [ "$found" = true ]
  ci:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'cache-owner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/released_version.py

      # Pinned: `-D warnings` against a floating stable fails CI with no code change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      # target/ is the host build; target/manylinux is the wheel's container build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/manylinux
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: |
          set -eux
          cargo build --workspace
          for s in h3 h3-pdd sdxl civitai-sdxl instruments; do
            python3 "scripts/rebank-$s.py" --tfs target/debug/tfs
          done
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::style
      - run: cargo test --workspace
      - name: Transfers inside a 64 MiB memory budget
        run: |
          for proof in target/debug/deps/transfer_memory-*; do
            if [ -f "$proof" ] && [ -x "$proof" ]; then
              sudo systemd-run --scope -p MemoryMax=64M -p MemorySwapMax=0 --quiet "$proof" --exact an_object_larger_than_the_memory_budget_uploads_and_downloads --nocapture
            fi
          done
      - run: |
          set -eux
          python3 scripts/fence.py
          uv run --no-project --python 3.12 --with mypy mypy --strict --python-version 3.12 python/tensorfs
          python3 scripts/version_contract.py source

      - run: cargo build --release --bin tfs
      - name: CBOR conformance against the independent Python codec
        run: uv run --python 3.12 --project conformance/cbor/python python scripts/cbor-conformance.py --tfs target/release/tfs conform

      # The CLI rides the wheel (tfs-051), built in the manylinux container so its glibc
      # floor matches the extension beside it.
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: x86_64
          args: --release --locked --target-dir target/manylinux --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked --target-dir target/manylinux -p tensorfs-core --bin tfs
            install -D -m 755 target/manylinux/release/tfs wheel-data/scripts/tfs
      - name: Wheel end-to-end over a real store
        run: |
          set -eux
          for wheel in dist/*.whl; do python3 scripts/version_contract.py wheel "$wheel"; done
          bash scripts/wheel-smoke.sh "${RUNNER_TEMP}/smoke" python3.12 --skip-build --wheels "$PWD/dist"
          sudo "${RUNNER_TEMP}/smoke/venv/bin/python" scripts/scoped-derived.py --isolation
          sudo "${RUNNER_TEMP}/smoke/venv/bin/python" scripts/scoped-model-reader.py --isolation
      # A newer-host CLI swapped into the portable wheel must falsify its platform tag.
      - run: |
          for wheel in dist/*.whl; do
            uv run --script scripts/wheel-platform.py "$wheel" --prove target/release/tfs
          done
      # The container build leaves root-owned files the cache post-step must read and prune.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target
