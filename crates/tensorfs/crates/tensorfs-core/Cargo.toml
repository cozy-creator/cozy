[package]
name = "tensorfs-core"
version = "0.10.0"
edition = "2021"
publish.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"
required-features = ["store"]

[features]
# The store, downloader, ingest, GC and everything that opens one. Without it: documents,
# headers, read plans and the fit function only (what a plane-only executor links).
default = ["store"]
store = ["dep:rusqlite", "dep:rustix", "dep:rustls", "dep:webpki-roots", "dep:tokio", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes", "dep:futures", "dep:tracing-subscriber"]
# Kill points for the v2 store's crash tests (`store2::fault`).
faults = ["store"]

[dependencies]
base64.workspace = true
cozy-platform.workspace = true
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
rusqlite = { workspace = true, features = ["fallible_uint"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustix = { version = "1.1.4", default-features = false, features = ["std", "net", "event"], optional = true }
# tfs-049: the ONE transport (src/transport/). rustls is the one TLS stack, used only
# there; scripts/fence.py refuses it anywhere else so a second mover cannot grow.
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# The transport's async half (src/transport/net.rs): requests in flight are tasks on two
# threads, never a thread each. hyper frames HTTP/1.1; the connect, TLS and policy are ours.
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"], optional = true }

[[test]]
name = "store_v2"
required-features = ["faults"]

[dev-dependencies]
libc.workspace = true
rcgen.workspace = true

# FUSE-mounted volume tests are Linux-only (macOS needs macFUSE, Windows has none).
[target.'cfg(target_os = "linux")'.dev-dependencies]
fuser = { version = "0.15", default-features = false }
