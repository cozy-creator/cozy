[package]
name = "tensorfs-plane"
version.workspace = true
edition.workspace = true
description = "The TensorFS weight plane: pinned host tier, per-GPU VMM arenas, copy streams, streaming cursors. Mechanism only."
publish = false

[dependencies]
tensorfs-core = { path = "../tensorfs-core", default-features = false }
libc = "0.2"
# libcuda is dlopen'd at first use: the workspace builds and tests with no CUDA toolkit.
libloading = "0.9"
thiserror = "2"

[features]
# Store-backed sources (fills from a TensorFS store). Without it: sealed layouts only (a
# plane-only executor adopts what its machine filled and links no store code).
default = ["store"]
store = ["tensorfs-core/store"]
# Test-only fault points on the copy path (tests/gpu.rs drives them).
faults = []
