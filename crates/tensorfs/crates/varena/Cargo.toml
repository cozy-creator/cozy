[package]
name = "varena"
version = "0.10.0"
edition = "2021"
publish.workspace = true
description = "The TensorFS weight plane: a checkpoint's chunks as regions on per-GPU VMM ranges, filled from chunk files or a sealed host layout, streamed through rings, pinned only by leases. Mechanism only: no budgets."

[dependencies]
cozy-platform.workspace = true
tensorfs-core = { workspace = true, features = ["store"] }
libc.workspace = true
# libcuda is dlopen'd at first use: the workspace builds and tests with no CUDA toolkit.
libloading = "0.9"
thiserror.workspace = true

[features]
# Test-only fault points on the copy path (tests/gpu.rs drives them).
faults = []
