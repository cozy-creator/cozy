version: "3"
silent: true

tasks:
  orders:
    desc: Regenerate the constructor-order references (crates/tensorfs/orders/<class>.json) from Diffusers/Transformers
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - uv run --script scripts/orders.py --write

  vectors:
    desc: Regenerate every conformance vector in one run (header vectors, case files, then the store)
    dir: "{{.TASKFILE_DIR}}"
    cmds:
      - uv run --no-project --python 3.12 --with numpy --with cbor2==6.1.4 --with packaging==25.0 python -I ../tensorfs/conformance/make_vectors.py
      - cargo test -p tensorfs --no-default-features --test format_conformance -- --ignored regenerate
