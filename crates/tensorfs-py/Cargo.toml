[package]
name = "tensorfs-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
# default-features = false: the wheel is the WORKER path — hub-side grading vocabulary
# (the `grade` feature) is not in it.
tensorfs-core = { path = "../tensorfs-core", default-features = false }
pyo3 = { version = "0.25", features = ["abi3-py311"] }

[features]
extension-module = ["pyo3/extension-module"]
