[package]
name = "tensorfs-py"
version = "0.12.0"
edition = "2021"
publish.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
platform.workspace = true
tensorfs.workspace = true
varena.workspace = true
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Native feature isolation remains available to Rust builds. The published Python
# distribution always enables store; managed executor authority comes from its owner.
default = ["store"]
store = ["tensorfs/store", "varena/store"]
extension-module = ["pyo3/extension-module"]
