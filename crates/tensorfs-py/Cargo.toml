[package]
name = "tensorfs-py"
version = "0.13.7"
edition = "2021"
publish.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio.workspace = true
platform.workspace = true
tensorfs.workspace = true
varena.workspace = true
pyo3 = "0.29.2"
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
# Native feature isolation remains available to Rust builds. The published Python
# distribution always enables store; managed executor authority comes from its owner.
default = ["store"]
store = ["tensorfs/store", "varena/store"]
extension-module = ["pyo3/extension-module"]
