[package]
name = "tensorfs-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
tensorfs-core = { path = "../tensorfs-core", default-features = false }
tensorfs-plane = { path = "../tensorfs-plane", default-features = false }
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }

[features]
# Native feature isolation remains available to Rust builds. The published Python
# distribution always enables store; managed executor authority comes from its owner.
default = ["store"]
store = ["tensorfs-core/store", "tensorfs-plane/store"]
extension-module = ["pyo3/extension-module"]
