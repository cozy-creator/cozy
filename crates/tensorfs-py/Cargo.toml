[package]
name = "tensorfs-py"
version.workspace = true
edition.workspace = true

[lib]
name = "_ext"
crate-type = ["cdylib", "rlib"]

[dependencies]
# DEFAULT FEATURES, `grade` included. The wheel used to set default-features = false on the
# reasoning that grading is "hub-side vocabulary the worker path does not need". Two facts
# overrule it. First, `corpus::run_doc` is ONE dispatch shared by the tfs binary and this
# facade, and `scripts/facade-conform.py` proves them equal by diffing their output over the
# same frozen vectors — a feature that removes document kinds from one side turns that
# cross-language proof into two corpora agreeing only where they overlap, with the newest
# documents in the hole. Second, "can this code execute this model?" is a PREFLIGHT question,
# and the worker is where a wrong answer costs pod money, so cozy-runtime is exactly the
# caller that should be able to ask it in-process. The feature carries no dependency and no
# I/O; it is header-domain logic.
tensorfs-core = { path = "../tensorfs-core" }
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }

[features]
extension-module = ["pyo3/extension-module"]
