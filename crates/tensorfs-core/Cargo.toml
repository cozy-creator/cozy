[package]
name = "tensorfs-core"
version = "0.11.0"
edition = "2021"
publish.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"
required-features = ["store"]

[features]
# The store, downloader, ingest, GC and everything that opens one. Without it: documents,
# headers, read plans and the fit function only (what a plane-only executor links).
default = ["store"]
store = ["dep:aws-lc-rs", "dep:aws-sigv4", "dep:aws-credential-types", "dep:aws-smithy-runtime-api", "dep:rusqlite", "dep:rustix", "dep:rustls", "dep:webpki-roots", "dep:tokio", "dep:tokio-rustls", "dep:hyper", "dep:hyper-util", "dep:tower-service", "dep:async-trait", "dep:http-body-util", "dep:bytes", "dep:futures", "dep:tracing-subscriber"]
# Kill points for the v2 store's crash tests (`store2::fault`).
faults = ["store"]

[dependencies]
base64.workspace = true
platform.workspace = true
libloading.workspace = true
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
rusqlite = { workspace = true, features = ["fallible_uint"], optional = true }
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustix = { version = "1.1.4", default-features = false, features = ["std", "net", "event"], optional = true }
# The one HTTP client (src/fetch/net.rs; v1 src/transport/ until TensorD leaves it). rustls is
# the one TLS stack, used only there; scripts/fence.py refuses it anywhere else.
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
# Requests in flight are tasks, never a thread each: hyper's pooled HTTP/1.1 client over our
# connector (egress policy, TLS).
tokio = { workspace = true, optional = true }
tokio-rustls = { workspace = true, optional = true }
hyper = { workspace = true, features = ["client", "http1"], optional = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1"], optional = true }
tower-service = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
futures = { version = "0.3.31", default-features = false, features = ["std", "executor"], optional = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
# Endpoint credentials (src/fetch/token.rs): S3 SigV4, and DPoP's P-256 keys.
aws-sigv4 = { version = "1.4", default-features = false, features = ["sign-http", "http1"], optional = true }
aws-credential-types = { version = "1.2", optional = true }
aws-smithy-runtime-api = { version = "1.12", default-features = false, optional = true }
aws-lc-rs = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { version = "1.1.4", default-features = false, features = ["fs", "process"], optional = true }

[[test]]
name = "store_v2"
required-features = ["faults"]

[[test]]
name = "writer"
required-features = ["faults"]

[dev-dependencies]
hub-client = { workspace = true, features = ["testing"] }
libc.workspace = true
rcgen.workspace = true
reqwest.workspace = true

# FUSE-mounted volume tests are Linux-only (macOS needs macFUSE, Windows has none).
[target.'cfg(target_os = "linux")'.dev-dependencies]
fuser = { version = "0.15", default-features = false }
