[package]
name = "tensorfs-core"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tfs"
path = "src/bin/tfs/main.rs"

[dependencies]
fs2 = "0.4"
minicbor = { version = "2.3.0", default-features = false, features = ["alloc"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# tfs-049: the ONE transport (src/transport/). rustls is the one TLS stack, used only
# there; scripts/fence.py refuses it anywhere else so a second mover cannot grow.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
