        org: {type: string}
        name: {type: string}
        family: {type: string}
        created_at: {type: string, format: date-time}
    ModelSummaryAnswer:
      type: object
      required: [model]
      properties: {model: {$ref: '#/components/schemas/ModelSummary'}}
    ModelThroughput:
      type: object
      required:
