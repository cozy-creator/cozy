      - sku
      - accelerator_count
      - workload
      - payload_sha256
      - runs
      - median_s
      - min_s
      - max_s
      - prepare_s
      - runtime_version
      - worker_image_digest
      - measured_at
      - operator
      properties:
        model: {type: string}
        release: {type: string}
        lane: {type: string}
        sku: {type: string}
        accelerator_count: {type: integer, format: int64}
        workload: {type: string}
        payload_sha256: {type: string}
        runs: {type: integer, format: int64}
        median_s: {type: number, format: double}
        min_s: {type: number, format: double}
        max_s: {type: number, format: double}
        prepare_s: {type: number, format: double}
        runtime_version: {type: string}
        worker_image_digest: {type: string}
        measured_at: {type: string, format: date-time}
