openapi: 3.0.3

info:
  title: Tensorhub
  version: v1
  description: |
    The routes Tensorhub's clients call: the cozy CLI and Calcifer, machines (TensorD, its
    TensorFS transport, and uv against the package index), and the device-key and token
    routes of the AuthKit and OpenRails surfaces the Hub embeds. Admin routes and the
    browser pages are not here.

    Every refusal is the Error envelope with a 4xx or 5xx status. Operations marked
    `x-raw-body: true` answer bytes that are not JSON (an HTML index, a wheel, plain
    text): a client generator may skip them, and callers read the body themselves.

servers: [{url: 'https://tensorhub.com'}]

tags:
- {name: accounts}
- {name: auth}
- {name: billing}
- {name: machine}
- {name: models}
- {name: packages}
- {name: rentals}
- {name: tensorfs}

paths:
  /.well-known/oauth-protected-resource:
    get:
      operationId: get_protected_resource_metadata
      tags: [auth]
      summary: Reads where this hub's run tokens are issued (RFC 9728).
      security: []
      responses:
        '200':
          description: The protected resource metadata.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthProtectedResourceMetadata'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /billing/v1/me:
    get:
      operationId: get_billing_account
      tags: [billing]
      summary: Reads the caller's billing account, with a balance per currency held.
      security: [{bearer: []}]
      responses:
        '200':
          description: The caller's billing account.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingCustomerAccount'}}
        4XX: {$ref: '#/components/responses/BillingError'}
        5XX: {$ref: '#/components/responses/BillingError'}

  /billing/v1/me/balance/transactions:
    get:
      operationId: list_balance_transactions
      tags: [billing]
      summary: Lists the caller's credit movements, newest first, one page at a time.
      security: [{bearer: []}]
      parameters:
      - {name: currency, in: query, required: false, schema: {type: string}}
      - name: cursor
        in: query
        required: false
        description: The previous page's next_cursor.
        schema: {type: string}
      - name: limit
        in: query
        required: false
        schema: {type: integer, format: int64}
      responses:
        '200':
          description: One page of movements.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingBalanceTransactionPage'}}
        4XX: {$ref: '#/components/responses/BillingError'}
        5XX: {$ref: '#/components/responses/BillingError'}

  /billing/v1/me/orders:
    post:
      operationId: create_order
      tags: [billing]
      summary: Opens an order (the caller's open order of the same lines when one exists).
      security: [{bearer: []}]
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Required with a payment; names its payment attempt.
        schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BillingCreateOrderRequest'}}
      responses:
        '200':
          description: The caller's existing open order of the same lines.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingOrder'}}
        '201':
          description: A new order.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingOrder'}}
        4XX: {$ref: '#/components/responses/BillingError'}
        5XX: {$ref: '#/components/responses/BillingError'}

  /billing/v1/me/orders/{id}:
    get:
      operationId: get_order
      tags: [billing]
      summary: Reads one of the caller's orders.
      security: [{bearer: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The order.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingOrder'}}
        4XX: {$ref: '#/components/responses/BillingError'}
        5XX: {$ref: '#/components/responses/BillingError'}

  /billing/v1/me/orders/{id}/pay:
    post:
      operationId: pay_order
      tags: [billing]
      summary: Pays an open order; a hosted page answers with a redirect next action.
      security: [{bearer: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      - name: Idempotency-Key
        in: header
        required: true
        schema: {type: string, minLength: 1, maxLength: 255}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/BillingPayOrderRequest'}}
      responses:
        '200':
          description: The order with its payment's state.
          content:
            application/json: {schema: {$ref: '#/components/schemas/BillingOrder'}}
        4XX: {$ref: '#/components/responses/BillingError'}
        5XX: {$ref: '#/components/responses/BillingError'}

  /v1/accounts/current:
    get:
      operationId: get_current_account
      tags: [accounts]
      summary: The signed-in user's account name.
      security: [{bearer: []}]
      responses:
        '200':
          description: The account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/accounts/{account}:
    put:
      operationId: register_account
      tags: [accounts]
      summary: Claims the signed-in user's account name.
      security: [{bearer: []}]
      parameters:
      - {name: account, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}
      responses:
        '200':
          description: The account.
          content: {application/json: {schema: {$ref: '#/components/schemas/Account'}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/auth/.well-known/openid-configuration:
    get:
      operationId: get_openid_configuration
      tags: [auth]
      summary: Reads the authorization server's metadata, including its token endpoint.
      security: []
      responses:
        '200':
          description: The authorization server metadata.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthServerMetadata'}}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/oauth2/token:
    post:
      operationId: exchange_token
      tags: [auth]
      summary: Trades a machine's run capability (a JWT-bearer assertion) for a DPoP-bound run token.
      security: []
      parameters:
      - name: DPoP
        in: header
        required: true
        description: The DPoP proof (RFC 9449) of the key the token binds to.
        schema: {type: string}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded: {schema: {$ref: '#/components/schemas/AuthTokenRequest'}}
      responses:
        '200':
          description: The run token.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthTokenResponse'}}
        4XX: {$ref: '#/components/responses/TokenRefusal'}
        5XX: {$ref: '#/components/responses/TokenRefusal'}

  /v1/auth/v1/device-keys:
    delete:
      operationId: revoke_other_device_keys
      tags: [auth]
      summary: Revokes every device key of the account but the caller's; needs an email-proven enrollment token.
      security: [{bearer: []}]
      responses:
        '204': {description: The other keys are revoked.}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/v1/device-keys/enroll/begin:
    post:
      operationId: begin_device_key_enrollment
      tags: [auth]
      summary: Starts enrolling a device key; a code is emailed to the account.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthDeviceKeyEnrollBeginRequest'}
      responses:
        '200':
          description: The enrollment and the challenge the key signs.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthDeviceKeyEnrollment'}}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/v1/device-keys/enroll/finish:
    post:
      operationId: finish_device_key_enrollment
      tags: [auth]
      summary: Finishes an enrollment with the emailed code and the key's signature, and signs in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthDeviceKeyEnrollFinishRequest'}
      responses:
        '200':
          description: The sign-in, or the step it waits on.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/v1/device-keys/login/begin:
    post:
      operationId: begin_device_key_login
      tags: [auth]
      summary: Starts a device-key sign-in; answers the challenge the key signs.
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/AuthDeviceKeyLoginBeginRequest'}}
      responses:
        '200':
          description: The sign-in challenge.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthDeviceKeyLoginChallenge'}}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/v1/device-keys/login/finish:
    post:
      operationId: finish_device_key_login
      tags: [auth]
      summary: Finishes a device-key sign-in with the challenge's signature.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AuthDeviceKeyLoginFinishRequest'}
      responses:
        '200':
          description: The sign-in, or the step it waits on.
          content:
            application/json: {schema: {$ref: '#/components/schemas/AuthResult'}}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/auth/v1/me/sign-in-keys/{id}:
    delete:
      operationId: revoke_sign_in_key
      tags: [auth]
      summary: Revokes one of the caller's sign-in keys (a device key or a passkey); needs a recent sign-in.
      security: [{bearer: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: The key is revoked.}
        4XX: {$ref: '#/components/responses/AuthKitError'}
        5XX: {$ref: '#/components/responses/AuthKitError'}

  /v1/credit:
    get:
      operationId: get_credit
      tags: [billing]
      summary: Reads the caller's net credit against the warning and the overdraft floor.
      security: [{bearer: []}]
      responses:
        '200':
          description: The caller's credit; null for an account whose rentals never touch credit.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CreditResponse'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/credit/deposit:
    get:
      operationId: get_credit_deposit
      tags: [billing]
      summary: Reads the credit deposit on sale, its price and what one purchase may be.
      security: []
      responses:
        '200':
          description: The credit deposit.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CreditDeposit'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/execution-environment:
    get:
      operationId: get_execution_environment
      tags: [machine]
      summary: Where a machine reaches this Hub and its object storage.
      security: [{bearer: []}]
      responses:
        '200':
          description: The environment a run's machine receives.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ExecutionEnvironment'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/index/{org}/simple:
    get:
      operationId: redirect_package_index
      tags: [packages]
      summary: Redirects to the index with its trailing slash.
      security: []
      x-raw-body: true
      parameters: [{$ref: '#/components/parameters/Org'}]
      responses:
        '301': {description: Moved to the slash form.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/index/{org}/simple/:
    get:
      operationId: get_package_index
      tags: [packages]
      summary: The org's PEP 503 simple index (HTML), for uv.
      security: []
      x-raw-body: true
      parameters: [{$ref: '#/components/parameters/Org'}]
      responses:
        '200':
          description: HTML links to each distribution.
          content: {text/html: {schema: {type: string}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/index/{org}/simple/{distribution}:
    get:
      operationId: redirect_package_index_project
      tags: [packages]
      summary: Redirects to the distribution page with its trailing slash.
      security: []
      x-raw-body: true
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {name: distribution, in: path, required: true, schema: {type: string}}
      responses:
        '301': {description: Moved to the slash form.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/index/{org}/simple/{distribution}/:
    get:
      operationId: get_package_index_project
      tags: [packages]
      summary: One distribution's files (HTML), or a redirect to its normalized name.
      security: []
      x-raw-body: true
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {name: distribution, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: HTML links to each file, with its sha256.
          content: {text/html: {schema: {type: string}}}
        '301': {description: Moved to the normalized distribution name.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/index/{org}/{name}/{release}/{filename}:
    get:
      operationId: get_package_index_file
      tags: [packages]
      summary: Redirects to a presigned URL of one wheel.
      security: []
      x-raw-body: true
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      - {name: filename, in: path, required: true, schema: {type: string}}
      responses:
        '302': {description: Found at the Location header.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models:
    get:
      operationId: search_models
      tags: [models]
      summary: Searches published models.
      security: []
      parameters:
      - {name: q, in: query, schema: {type: string}}
      - name: family
        in: query
        schema: {type: string}
        description: A discovery family label.
      - name: limit
        in: query
        schema: {type: integer, format: int64}
        description: At most the Hub's own search limit.
      responses:
        '200':
          description: Matching models.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelSearch'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/resolve:
    get:
      operationId: resolve_model
      tags: [models]
      summary: Turns a model ref and a lane into one exact checkpoint.
      security: [{}, {bearer: []}, {dpop: []}]
      parameters:
      - name: ref
        in: query
        required: true
        schema: {type: string}
        description: org/name[@release|@sha256:...]
      - {name: lane, in: query, schema: {type: string}}
      responses:
        '200':
          description: The resolved checkpoint.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelResolution'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}:
    get:
      operationId: get_model
      tags: [models]
      summary: A model, its releases with their lanes, and its measured throughput.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      responses:
        '200':
          description: The model card.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelCard'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    patch:
      operationId: set_model_family
      tags: [models]
      summary: Sets a model's discovery family.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ModelFamilyUpdate'}}
      responses:
        '200':
          description: The model.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelSummaryAnswer'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    delete:
      operationId: delete_model
      tags: [models]
      summary: Deletes a model whose releases are all yanked.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      responses:
        '200':
          description: What the deletion removed.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelDeletion'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/checkpoints/{manifest}:
    get:
      operationId: get_model_checkpoint
      tags: [models]
      summary: 'A checkpoint''s manifest document, to its owner or a run reading it; to a run publishing to the
        model, only whether the model holds it ({"held": true}).'
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Manifest'}
      responses:
        '200':
          description: The manifest document, or {"held":true}.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CheckpointDocument'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    delete:
      operationId: remove_model_checkpoint
      tags: [models]
      summary: Removes a checkpoint no release lane names.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Manifest'}
      responses:
        '200':
          description: The removal.
          content:
            application/json: {schema: {$ref: '#/components/schemas/CheckpointRemoval'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/publications/{operation}:
    put:
      operationId: open_model_publication
      tags: [models]
      summary: Opens (or resumes) a checkpoint publication and declares its objects.
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Operation'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PublicationDeclaration'}}
      responses:
        '200':
          description: The publication and each object's state.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PublicationOpened'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/publications/{operation}/finalization:
    get:
      operationId: get_model_finalization
      tags: [models]
      summary: A checkpoint finalization's state.
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Operation'}
      responses:
        '200':
          description: The finalization.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelFinalization'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/publications/{operation}/finalize:
    post:
      operationId: finalize_model_publication
      tags: [models]
      summary: Queues the checkpoint's finalization; poll status_url.
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Operation'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PublicationFinalize'}}
      responses:
        '202':
          description: Queued (Location and Retry-After headers).
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelFinalization'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/publications/{operation}/grants:
    post:
      operationId: grant_publication_objects
      tags: [models]
      summary: Presigned PUTs for the named objects the Hub does not hold yet.
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Operation'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PublicationObjectIds'}}
      responses:
        '200':
          description: Grants for absent objects; the held ones.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PublicationGrants'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/publications/{operation}/verify:
    post:
      operationId: verify_publication_objects
      tags: [models]
      summary: Verifies uploaded objects.
      security: [{bearer: []}, {dpop: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Operation'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PublicationObjectIds'}}
      responses:
        '200':
          description: The publication with the verified objects' states.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PublicationAnswer'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/releases/{release}:
    post:
      operationId: update_model_release
      tags: [models]
      summary: Sets or removes release lanes at an expected revision.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ModelReleaseUpdate'}}
      responses:
        '200':
          description: The release.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelRelease'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    delete:
      operationId: yank_model_release
      tags: [models]
      summary: Yanks a release.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      responses:
        '200':
          description: The yanked release.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelRelease'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/releases/{release}/lanes/{lane}:
    put:
      operationId: retarget_model_lane
      tags: [models]
      summary: Points one existing release lane at another retained checkpoint.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      - {$ref: '#/components/parameters/Lane'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/ModelLaneRetarget'}}
      responses:
        '200':
          description: The release.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelRelease'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/models/{org}/{name}/throughput:
    get:
      operationId: get_model_throughput
      tags: [models]
      summary: The newest throughput measurement per release, lane and SKU.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      responses:
        '200':
          description: Measurements.
          content:
            application/json: {schema: {$ref: '#/components/schemas/ModelThroughputs'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages:
    get:
      operationId: search_packages
      tags: [packages]
      summary: Searches published packages.
      security: []
      parameters:
      - {name: q, in: query, schema: {type: string}}
      - name: limit
        in: query
        schema: {type: integer, format: int64}
        description: At most the Hub's own search limit.
      responses:
        '200':
          description: Matching packages.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageSearch'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}:
    get:
      operationId: get_package
      tags: [packages]
      summary: A package and its releases.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      responses:
        '200':
          description: The package card.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageCard'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/download:
    post:
      operationId: get_package_download_plan
      tags: [packages]
      summary: The exact files of one committed release, with presigned URLs.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - name: release
        in: query
        schema: {type: string}
        description: Absent reads the newest release.
      - {name: python_version, in: query, schema: {type: string}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}
      responses:
        '200':
          description: The install plan.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageInstallPlan'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/publish/{release}:
    post:
      operationId: begin_package_release
      tags: [packages]
      summary: Declares a release's files and returns upload grants for the absent ones.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PackageReleaseDeclaration'}}
      responses:
        '200':
          description: One grant per declared file.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageReleaseGrants'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/publish/{release}/finalize:
    post:
      operationId: finalize_package_release
      tags: [packages]
      summary: Queues the release's finalization (202), or answers a committed one (200).
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/PackageReleaseFinalize'}}
      responses:
        '200':
          description: Committed.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageFinalization'}}
        '202':
          description: Queued; poll status_url (also the Location header).
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageFinalization'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/publish/{release}/status:
    get:
      operationId: get_package_finalization
      tags: [packages]
      summary: A release's finalization state.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      responses:
        '200':
          description: The finalization.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageFinalization'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/releases/{release}:
    get:
      operationId: get_package_release
      tags: [packages]
      summary: One committed release, its interface and its Python environment.
      security: []
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      responses:
        '200':
          description: The release.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageRelease'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    delete:
      operationId: yank_package_release
      tags: [packages]
      summary: Yanks a release.
      security: [{bearer: []}]
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Empty'}}}
      responses:
        '200':
          description: The yanked release.
          content:
            application/json: {schema: {$ref: '#/components/schemas/PackageYank'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/packages/{org}/{name}/releases/{release}/locked-requirements:
    get:
      operationId: get_package_locked_requirements
      tags: [packages]
      summary: The release's hash-pinned requirements, as uv installs them.
      security: []
      x-raw-body: true
      parameters:
      - {$ref: '#/components/parameters/Org'}
      - {$ref: '#/components/parameters/Name'}
      - {$ref: '#/components/parameters/Release'}
      responses:
        '200':
          description: A requirements file.
          content: {text/plain: {schema: {type: string}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rental-placements:
    post:
      operationId: place_rental
      tags: [rentals]
      summary: The products that hold one run of a package function, cheapest expected rental first.
      description: |
        Sizes the function's model slots as the machine loads them at the run's bits (each slot's default
        release, its first published lane in the bit order) and keeps the products whose card holds the
        weights in three quarters of its memory, at the asked GPU count (one by default). Nothing is bought.
      security: []
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RentalPlacementRequest'}}
      responses:
        '200':
          description: The ranked products and the excluded ones.
          content:
            application/json: {schema: {$ref: '#/components/schemas/RentalPlacement'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rental-quotes:
    post:
      operationId: quote_rental
      tags: [rentals]
      summary: Prices the exact body a POST /v1/rentals would send, at the offer it would buy.
      security: [{}, {bearer: []}, {dpop: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RentalRequest'}}
      responses:
        '200':
          description: The product and width the request would lock, and its prices.
          content:
            application/json: {schema: {$ref: '#/components/schemas/RentalQuote'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rental-skus:
    get:
      operationId: list_rental_skus
      tags: [rentals]
      summary: Lists the products buyable now, each with its buyable GPU counts and prices.
      security: [{}, {bearer: []}]
      parameters:
      - name: provider
        in: query
        required: false
        description: Narrow to one provider (runpod or vast); an admin's sign-in only.
        schema: {type: string}
      responses:
        '200':
          description: The buyable catalog, sorted by name.
          content:
            application/json: {schema: {$ref: '#/components/schemas/RentalSkuList'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rental-skus/{name}:
    get:
      operationId: get_rental_sku_status
      tags: [rentals]
      summary: Says whether one product at one GPU count is buyable, out of stock, cooling down or unknown.
      security: [{}, {bearer: []}]
      parameters:
      - {name: name, in: path, required: true, schema: {type: string}}
      - name: accelerator_count
        in: query
        required: false
        description: GPU count; 1 when omitted.
        schema: {type: integer, format: int64, minimum: 1}
      - name: provider
        in: query
        required: false
        description: Narrow to one provider (runpod or vast); an admin's sign-in only.
        schema: {type: string}
      responses:
        '200':
          description: The product's standing at that count.
          content:
            application/json: {schema: {$ref: '#/components/schemas/RentalSkuStatus'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rentals:
    post:
      operationId: create_rental
      tags: [rentals]
      summary: Accepts a rental; the pod is bought and booted afterwards.
      security: [{bearer: []}]
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: Persisted before the POST; a replay with the same body answers the same rental.
        schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/RentalRequest'}}
      responses:
        '202':
          description: The accepted rental.
          content: {application/json: {schema: {$ref: '#/components/schemas/Rental'}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    get:
      operationId: list_rentals
      tags: [rentals]
      summary: Lists the caller's rentals, with its bindings revision and credit.
      security: [{bearer: []}]
      parameters:
      - name: state
        in: query
        required: false
        description: Omitted or live lists the rentals that may be billing; all adds released and failed ones.
        schema: {type: string, enum: [all, live]}
      - name: name
        in: query
        required: false
        description: Keep the rentals that bore this rental or machine name, case-insensitively.
        schema: {type: string}
      responses:
        '200':
          description: The caller's rentals.
          content:
            application/json: {schema: {$ref: '#/components/schemas/RentalListing'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/rentals/{id}:
    get:
      operationId: get_rental
      tags: [rentals]
      summary: Reads one rental the caller owns (or any, for an admin).
      security: [{bearer: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: The rental.
          content: {application/json: {schema: {$ref: '#/components/schemas/Rental'}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}
    delete:
      operationId: release_rental
      tags: [rentals]
      summary: Releases a rental; its pod is torn down.
      security: [{bearer: []}]
      parameters:
      - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '204': {description: The release is requested.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/software:
    get:
      operationId: get_software
      tags: [machine]
      summary: The Runtime and TensorFS versions machines run.
      security: []
      responses:
        '200':
          description: The software target.
          content: {application/json: {schema: {$ref: '#/components/schemas/Software'}}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/tensorfs/closure:
    post:
      operationId: resolve_tensorfs_closure
      tags: [tensorfs]
      summary: Reads one page of what a readable checkpoint contains, digests and lengths only.
      security: [{}, {bearer: []}, {dpop: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TensorfsClosureRequest'}}
      responses:
        '200':
          description: One page of the closure.
          content:
            application/json: {schema: {$ref: '#/components/schemas/TensorfsClosure'}}
        4XX: {$ref: '#/components/responses/TensorfsError'}
        5XX: {$ref: '#/components/responses/TensorfsError'}

  /v1/tensorfs/presign:
    post:
      operationId: presign_tensorfs_objects
      tags: [tensorfs]
      summary: Mints download URLs for exactly the asked objects of checkpoints the caller may read.
      security: [{}, {bearer: []}, {dpop: []}]
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/TensorfsPresignRequest'}}
      responses:
        '200':
          description: A URL for every asked digest.
          content:
            application/json: {schema: {$ref: '#/components/schemas/TensorfsPresign'}}
        4XX: {$ref: '#/components/responses/TensorfsError'}
        5XX: {$ref: '#/components/responses/TensorfsError'}

  /v1/worker/rental/authorized-keys:
    get:
      operationId: get_worker_authorized_keys
      tags: [machine]
      summary: Reads the device keys a ready rental's machine admits, and how long they hold.
      security: [{worker: []}]
      parameters:
      - {name: X-Cozy-Worker-ID, in: header, required: true, schema: {type: string}}
      responses:
        '200':
          description: The rental's current authorized keys.
          content:
            application/json: {schema: {$ref: '#/components/schemas/WorkerAuthorizedKeys'}}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/worker/rental/endpoint:
    post:
      operationId: report_worker_endpoint
      tags: [machine]
      summary: Tells the hub where a booting machine listens, as its provider mapped the ports.
      security: [{worker: []}]
      parameters:
      - {name: X-Cozy-Worker-ID, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WorkerEndpointReport'}}
      responses:
        '204': {description: The endpoint is recorded.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

  /v1/worker/rental/release:
    post:
      operationId: release_worker_rental
      tags: [machine]
      summary: Releases the machine's own rental (an idle release); repeats are accepted.
      security: [{worker: []}]
      parameters:
      - {name: X-Cozy-Worker-ID, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/WorkerReleaseRequest'}}
      responses:
        '204': {description: The release is requested.}
        4XX: {$ref: '#/components/responses/Error'}
        5XX: {$ref: '#/components/responses/Error'}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: An AuthKit access token, from a device-key login.
    dpop:
      type: http
      scheme: dpop
      description: |
        A machine's sender-constrained run token (RFC 9449): `Authorization: DPoP <token>`
        beside a `DPoP` proof header, from the JWT-bearer trade of a run capability.
    worker:
      type: apiKey
      in: header
      name: X-Cozy-Worker-Token
      description: A rental pod's worker capability, beside its X-Cozy-Worker-ID.
  responses:
    Error:
      description: A typed refusal.
      content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}
    BillingError:
      description: An OpenRails refusal.
      content:
        application/json: {schema: {$ref: '#/components/schemas/BillingError'}}
    AuthKitError:
      description: An AuthKit refusal.
      content:
        application/json: {schema: {$ref: '#/components/schemas/AuthKitError'}}
    TokenRefusal:
      description: An OAuth error, or AuthKit's envelope for a rate limit.
      content:
        application/json: {schema: {$ref: '#/components/schemas/AuthTokenRefusal'}}
    TensorfsError:
      description: A TensorFS refusal.
      content:
        application/json: {schema: {$ref: '#/components/schemas/TensorfsError'}}
  schemas:
    Account:
      type: object
      required: [name, user_id]
      properties: {name: {type: string}, user_id: {type: string}}
    AuthAccountRecoveryConfirmation:
      type: object
      required: [token, expires_at, purge_at]
      properties:
        token: {type: string}
        expires_at: {type: string, format: date-time}
        purge_at: {type: string, format: date-time}
    AuthAgreement:
      type: object
      required: [key, version, url]
      properties: {key: {type: string}, version: {type: string}, url: {type: string}}
    AuthBanState:
      type: object
      required: [at, until, reason, by]
      properties:
        at: {type: string, format: date-time}
        until: {type: string, format: date-time, nullable: true}
        reason: {type: string, nullable: true}
        by: {type: string, nullable: true}
    AuthDeviceKey:
      type: object
      required: [id, label, public_key, created_at, last_used_at, revoked_at, current]
      properties:
        id: {type: string}
        label: {type: string, nullable: true}
        public_key:
          type: string
          format: byte
          description: The Ed25519 public key, standard base64.
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time, nullable: true}
        revoked_at: {type: string, format: date-time, nullable: true}
        current: {type: boolean}
    AuthDeviceKeyEnrollBeginRequest:
      type: object
      required: [email, public_key]
      properties:
        email: {type: string}
        public_key:
          type: string
          description: The Ed25519 public key, unpadded base64url (43 characters).
        label: {type: string, maxLength: 128}
    AuthDeviceKeyEnrollFinishRequest:
      type: object
      required: [enrollment_id, code, signature]
      properties:
        enrollment_id: {type: string}
        code: {type: string, description: The emailed six-digit code.}
        signature:
          type: string
          description: The key's signature of the challenge, unpadded base64url.
        code_2fa:
          type: string
          description: A second factor's code, when the account requires one.
    AuthDeviceKeyEnrollment:
      type: object
      required: [enrollment_id, challenge, expires_at]
      properties:
        enrollment_id: {type: string}
        challenge: {type: string}
        expires_at: {type: string, format: date-time}
    AuthDeviceKeyLoginBeginRequest:
      type: object
      required: [device_key_id]
      properties: {device_key_id: {type: string}}
    AuthDeviceKeyLoginChallenge:
      type: object
      required: [challenge_id, challenge, expires_at]
      properties:
        challenge_id: {type: string}
        challenge: {type: string}
        expires_at: {type: string, format: date-time}
    AuthDeviceKeyLoginFinishRequest:
      type: object
      required: [challenge_id, signature]
      properties: {challenge_id: {type: string}, signature: {type: string}}
    AuthDeviceVerificationStep:
      type: object
      required: [user_id, challenge, channel, destination, channels]
      properties:
        user_id: {type: string}
        challenge: {type: string}
        channel: {type: string}
        destination: {type: string}
        channels: {type: array, items: {type: string}}
    AuthEnrollmentStep:
      type: object
      required: [token_set, allowed_methods]
      properties:
        token_set: {$ref: '#/components/schemas/AuthTokenSet'}
        allowed_methods: {type: array, items: {type: string}}
    AuthFreshAuth:
      type: object
      required:
      - last_authenticated_at
      - step_up_required_for_sensitive_actions
      - step_up_required_in_seconds
      - auth_methods
      properties:
        last_authenticated_at: {type: string, format: date-time, nullable: true}
        step_up_required_for_sensitive_actions: {type: boolean}
        step_up_required_in_seconds: {type: integer, format: int64}
        auth_methods: {type: array, items: {type: string}}
    AuthKitError:
      type: object
      description: AuthKit's refusal envelope.
      required: [error]
      properties: {error: {$ref: '#/components/schemas/AuthKitErrorDetail'}}
    AuthKitErrorDetail:
      type: object
      required: [type, code, message, param, metadata]
      properties:
        type: {type: string}
        code: {type: string}
        message: {type: string}
        param: {type: string, nullable: true}
        metadata: {type: object, nullable: true, additionalProperties: {}}
    AuthProtectedResourceMetadata:
      type: object
      required:
      - resource
      - authorization_servers
      - bearer_methods_supported
      - dpop_bound_access_tokens_required
      properties:
        resource: {type: string}
        authorization_servers: {type: array, items: {type: string}}
        bearer_methods_supported: {type: array, items: {type: string}}
        dpop_bound_access_tokens_required: {type: boolean}
    AuthResult:
      type: object
      description: A sign-in; status says whether it is complete or which step it waits on.
      required:
      - status
      - token_set
      - user
      - created
      - return_to
      - fresh_auth
      - device_key
      - second_factor
      - enrollment
      - verification
      - recovery
      - device_verification
      - agreements_due
      properties:
        status: {type: string}
        token_set: {nullable: true, allOf: [{$ref: '#/components/schemas/AuthTokenSet'}]}
        user: {nullable: true, allOf: [{$ref: '#/components/schemas/AuthUser'}]}
        created: {type: boolean}
        return_to: {type: string, nullable: true}
        fresh_auth: {nullable: true, allOf: [{$ref: '#/components/schemas/AuthFreshAuth'}]}
        device_key: {nullable: true, allOf: [{$ref: '#/components/schemas/AuthDeviceKey'}]}
        second_factor:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AuthSecondFactorStep'}]
        enrollment:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AuthEnrollmentStep'}]
        verification:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AuthVerificationStep'}]
        recovery:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AuthAccountRecoveryConfirmation'}]
        device_verification:
          nullable: true
          allOf: [{$ref: '#/components/schemas/AuthDeviceVerificationStep'}]
        agreements_due: {type: array, items: {$ref: '#/components/schemas/AuthAgreement'}}
    AuthSecondFactorStep:
      type: object
      required: [user_id, challenge, factor, factors]
      properties:
        user_id: {type: string}
        challenge: {type: string}
        factor: {$ref: '#/components/schemas/AuthTwoFactorFactor'}
        factors: {type: array, items: {$ref: '#/components/schemas/AuthTwoFactorFactor'}}
    AuthServerMetadata:
      type: object
      required:
      - issuer
      - authorization_endpoint
      - token_endpoint
      - userinfo_endpoint
      - end_session_endpoint
