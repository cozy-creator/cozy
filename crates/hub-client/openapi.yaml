    PackageCard:
      type: object
      required: [package, releases]
      properties:
        package: {$ref: '#/components/schemas/PackageSummary'}
        releases: {type: array, items: {$ref: '#/components/schemas/CatalogRelease'}}
    PackageDeclaredFile:
      type: object
      required: [digest, length, path]
      properties:
        digest: {type: string}
        length: {type: integer, format: int64}
        path: {type: string}
    PackageFileGrant:
      type: object
      required: [digest, length, path, present]
      properties:
        digest: {type: string}
        length: {type: integer, format: int64}
        path: {type: string}
        present: {type: boolean, description: The Hub already holds these bytes.}
        upload: {$ref: '#/components/schemas/PresignedUpload'}
    PackageFinalization:
      type: object
      required: [publication_id, state, status_url]
      properties:
        publication_id: {type: string}
        state: {type: string, description: 'queued, running, committed or failed.'}
        status_url: {type: string}
        error: {description: Why the finalization failed.}
        warnings: {type: array, items: {type: string}}
    PackageInstallFile:
      type: object
      required: [digest, distribution, import_roots, kind, length, path, tags, url, version]
      properties:
        digest: {type: string}
        distribution: {type: string}
        import_roots: {type: array, nullable: true, items: {type: string}}
        kind: {type: string}
        length: {type: integer, format: int64}
        path: {type: string}
        tags: {type: array, nullable: true, items: {type: string}}
        url: {type: string}
        version: {type: string}
    PackageInstallPlan:
      type: object
      required: [downloads, package_config, package_interface, pyproject, release, uv_lock]
      properties:
        python_version: {type: string}
        downloads: {type: array, items: {$ref: '#/components/schemas/PackageInstallFile'}}
        package_config: {$ref: '#/components/schemas/ExactDocument'}
        package_interface: {$ref: '#/components/schemas/ExactDocument'}
        pyproject: {$ref: '#/components/schemas/ExactDocument'}
        release: {type: string}
        uv_lock: {$ref: '#/components/schemas/ExactDocument'}
    PackageRegistryPin:
      type: object
      required: [name, sha256, size, url, version]
      properties:
        name: {type: string}
        sha256: {type: string}
        size: {type: integer, format: int64}
        url: {type: string}
        version: {type: string}
    PackageRelease:
      type: object
      required: [release, package_interface, requirements, requires_python, python_version]
      properties:
        release: {$ref: '#/components/schemas/PackageReleaseSummary'}
        package_interface: {description: The release's package interface document.}
        requirements: {type: array, items: {type: string}}
        requires_python: {type: string}
        python_version: {type: string}
    PackageReleaseDeclaration:
      type: object
      required: [files]
      properties:
        files: {type: array, items: {$ref: '#/components/schemas/PackageDeclaredFile'}}
    PackageReleaseFinalize:
      type: object
      required: [publication_id]
      properties:
        publication_id: {type: string}
        python_version: {type: string}
        registry:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/PackageRegistryPin'}
    PackageReleaseGrants:
      type: object
      required: [files, publication_id]
      properties:
        files: {type: array, items: {$ref: '#/components/schemas/PackageFileGrant'}}
        publication_id: {type: string}
    PackageReleaseSummary:
      type: object
      required: [release, package_interface_digest, package_interface_length, created_at]
      properties:
        release: {type: string}
        package_interface_digest: {type: string}
        package_interface_length: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        committed_at: {type: string, format: date-time}
        yanked: {type: boolean}
        yanked_at: {type: string, format: date-time}
    PackageSearch:
      type: object
      required: [packages, search]
      properties:
        packages: {type: array, items: {$ref: '#/components/schemas/PackageSummary'}}
        search: {$ref: '#/components/schemas/SearchMeta'}
    PackageSummary:
      type: object
      required: [org, name, created_at]
      properties:
        org: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
        latest_release: {type: string, description: The newest committed release that is not yanked.}
    PackageYank:
      type: object
      required: [changed, release, state, yanked_at]
      properties:
        changed: {type: boolean}
        release: {type: string}
        state: {type: string}
        yanked_at: {type: string, format: date-time}
    PresignedUpload:
      type: object
      required: [url, required_headers]
      properties:
        url: {type: string}
        required_headers: {type: object, additionalProperties: {type: string}}
    Publication:
      type: object
      required: [operation, state, objects]
      properties:
        operation: {type: string}
        state: {type: string}
        objects: {type: array, items: {$ref: '#/components/schemas/PublicationObject'}}
    PublicationAnswer:
      type: object
      required: [publication]
      properties: {publication: {$ref: '#/components/schemas/Publication'}}
    PublicationDeclaration:
      type: object
      required: [objects]
      properties:
        objects: {type: array, items: {$ref: '#/components/schemas/DeclaredObject'}}
    PublicationFinalize:
      type: object
      required: [manifest_id, manifest_length]
      properties:
        manifest_id: {type: string}
        manifest_length: {type: integer, format: int64}
    PublicationGrant:
      type: object
      required: [object_id, length, url, expires_at_unix]
      properties:
        object_id: {type: string}
        length: {type: integer, format: int64}
        url: {type: string}
        required_headers: {type: object, additionalProperties: {type: string}}
        expires_at_unix:
          type: integer
          format: int64
          description: On the Hub's clock; compare to server_time_unix.
    PublicationGrants:
      type: object
      required: [grants, held, server_time_unix]
      properties:
        grants:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/PublicationGrant'}
        held:
          type: array
          nullable: true
          items: {$ref: '#/components/schemas/PublicationHeldObject'}
        server_time_unix: {type: integer, format: int64}
    PublicationHeldObject:
      type: object
      required: [transfer_id, object_id, length, state]
      properties:
        transfer_id: {type: string}
        object_id: {type: string}
        length: {type: integer, format: int64}
        state: {type: string}
        refusal_code: {type: string}
        refusal_detail: {type: string}
    PublicationObject:
      type: object
      required: [object_id, length, state]
      properties:
        object_id: {type: string}
        length: {type: integer, format: int64}
        state: {type: string, description: 'pending, verifying, accepted or refused.'}
    PublicationObjectIds:
      type: object
      required: [object_ids]
      properties: {object_ids: {type: array, items: {type: string}}}
    PublicationOpened:
      type: object
      required: [created, publication]
      properties:
        created: {type: boolean}
        publication: {$ref: '#/components/schemas/Publication'}
    Rental:
      type: object
      description: One rental. Provider facts are present for an admin only.
      required:
      - rental_id
      - name
      - state
      - requested_accelerator_model
      - accelerator_count
      - creator_public_key
      - base_worker_image_digest
      - hourly_rate_usd_micros
      - spend_usd_micros
      - spend_basis
      - container_disk_gb
      - created_at
      properties:
        development: {type: boolean}
        ssh_address: {type: string}
        rental_id: {type: string}
        name: {type: string}
        state: {type: string}
        requested_accelerator_model: {type: string}
        provider: {type: string}
        provider_machine_id: {type: string}
        machine_name: {type: string}
        provider_resource_id: {type: string}
        accelerator_count: {type: integer, format: int64}
        worker_address: {type: string}
        worker_id: {type: string}
        worker_boot_id: {type: string}
        media_address: {type: string}
        cert_pem: {type: string}
        media_token_sha256: {type: array, items: {type: string}}
        creator_public_key: {type: string}
        base_worker_image_digest: {type: string}
        base_worker_image_tag: {type: string}
        base_worker_profile: {type: string}
        hourly_rate_usd_micros: {type: integer, format: int64}
        compute_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb: {type: integer, format: int64}
        placement_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        spend_usd_micros: {type: integer, format: int64}
        spend_basis: {type: string}
        provider_cost_usd_micros: {type: integer, format: int64}
        provider_cost_basis: {type: string}
        container_disk_gb: {type: integer, format: int64}
        created_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        release_cause: {type: string}
        detail: {type: string}
        failure: {$ref: '#/components/schemas/RentalFailure'}
        provider_refusal: {type: string}
        boot: {$ref: '#/components/schemas/RentalBoot'}
        unreachable_since: {type: string, format: date-time}
        webrtc: {$ref: '#/components/schemas/RentalWebRtc'}
    RentalBoot:
      type: object
      description: The current attempt's boot, while it is acquired.
      required: [attempt, state, runtime_observed, observed_at]
      properties:
        pull: {$ref: '#/components/schemas/RentalImagePull'}
        attempt: {type: integer, format: int64}
        state: {type: string}
        datacenter: {type: string}
        container: {type: string}
        runtime_observed: {type: boolean}
        phase: {type: string}
        phase_started_at: {type: string, format: date-time}
        activity: {type: string}
        started_at: {type: string, format: date-time}
        last_progress_at: {type: string, format: date-time}
        boot_log_at: {type: string, format: date-time}
        observed_at: {type: string, format: date-time}
        replanned_from: {$ref: '#/components/schemas/RentalReplannedBoot'}
    RentalDevelopment:
      type: object
      required: [ssh_public_key]
      properties: {ssh_public_key: {type: string, maxLength: 8192}}
    RentalFailure:
      type: object
      required: [code, base_worker_image_digest]
      properties:
        code: {type: string}
        base_worker_image_digest: {type: string}
        provider: {type: string}
        provider_resource_id: {type: string}
        provider_host_id: {type: string}
        provider_state: {type: string}
        container_state: {type: string}
    RentalImagePull:
      type: object
      description: The image pull as the provider's boot log measured it.
      required:
      - observable
      - layers_observed
      - layers_complete
      - layers_failing
      - download_bytes
      - download_total_bytes
      - extract_bytes
      - extract_total_bytes
      - estimate_scope
      properties:
        observable: {type: boolean}
        layers_observed: {type: integer, format: int64}
        layers_complete: {type: integer, format: int64}
        layers_failing: {type: integer, format: int64}
        download_bytes: {type: integer, format: int64}
        download_total_bytes: {type: integer, format: int64}
        download_bytes_per_second: {type: number, format: double}
        extract_bytes: {type: integer, format: int64}
        extract_total_bytes: {type: integer, format: int64}
        extract_bytes_per_second: {type: number, format: double}
        remaining_seconds: {type: number, format: double}
        estimate_scope: {type: string}
        last_measured_at: {type: string, format: date-time}
    RentalListing:
      type: object
      required: [rentals, bindings_revision, credit]
      properties:
        rentals: {type: array, items: {$ref: '#/components/schemas/Rental'}}
        bindings_revision: {type: integer, format: int64}
        credit:
          description: Null for an unmetered account, or when billing cannot be read now.
          nullable: true
          allOf: [{$ref: '#/components/schemas/CreditStatus'}]
    RentalPlacement:
      type: object
      required:
      - package
      - release
      - function
      - bits
      - gpus
      - accelerator
      - weights
      - weight_bytes
      - machines
      - excluded
      properties:
        package: {type: string}
        release: {type: string}
        function: {type: string}
        bits: {type: integer, format: int64}
        gpus: {type: integer, format: int64}
        accelerator:
          type: boolean
          description: False for a function its package runs on a CPU machine.
        weights: {type: array, items: {$ref: '#/components/schemas/RentalPlacementWeights'}}
        weight_bytes: {type: integer, format: int64}
        machines: {type: array, items: {$ref: '#/components/schemas/RentalPlacementMachine'}}
        excluded:
          type: array
          items: {$ref: '#/components/schemas/RentalPlacementExclusion'}
    RentalPlacementExclusion:
      type: object
      required: [name, accelerator_count, code, reason]
      properties:
        name: {type: string}
        accelerator_count: {type: integer, format: int64}
        code:
          type: string
          description: placement.vram_short, placement.width_unavailable or placement.python_unsupported.
        reason: {type: string}
    RentalPlacementMachine:
      type: object
      required:
      - name
      - accelerator_model
      - compute_capability
      - vram_gb
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        name: {type: string}
        accelerator_model: {type: string}
        compute_capability: {type: string}
        vram_gb: {type: integer, format: int64}
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        container_disk_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
    RentalPlacementRequest:
      type: object
      required: [package, function]
      properties:
        package: {type: string, description: org/name}
        release: {type: string, description: Absent reads the newest release.}
        function: {type: string}
        bits: {type: integer, format: int64, enum: [16, 8, 4], description: Absent runs at 8.}
        gpus: {type: integer, format: int64, minimum: 1, description: Absent asks for one.}
    RentalPlacementWeights:
      type: object
      required: [slot, bytes]
      properties:
        slot: {type: string}
        model: {type: string}
        release: {type: string}
        lane: {type: string}
        bytes: {type: integer, format: int64}
        unsized: {type: string, description: Why the slot adds no bytes.}
    RentalPriceEstimate:
      type: object
      description: What a rental is expected to cost at its prices, for the expected hours plus its download.
      required:
      - hours
      - download_gb
      - download_hours
      - gpu_usd_micros
      - disk_usd_micros
      - download_usd_micros
      - total_usd_micros
      properties:
        hours: {type: number, format: double}
        download_gb: {type: integer, format: int64}
        download_mbps: {type: integer, format: int64}
        download_hours: {type: number, format: double}
        gpu_usd_micros: {type: integer, format: int64}
        disk_usd_micros: {type: integer, format: int64}
        download_usd_micros: {type: integer, format: int64}
        total_usd_micros: {type: integer, format: int64}
    RentalPythonInterpreter:
      type: object
      required: [version, abi]
      properties: {version: {type: string}, abi: {type: string}}
    RentalQuote:
      type: object
      description: The product (with every width buyable now) and the one width the request would lock.
      required:
      - name
      - accelerator_model
      - base_worker_profile
      - compute_capability
      - vram_gb
      - widths
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        excluded_provider_machines:
          type: array
          description: Echoed for an admin's ask only.
          items: {type: string}
        python_provisionable_minors: {type: array, items: {type: string}}
        python_interpreters:
          type: array
          items: {$ref: '#/components/schemas/RentalPythonInterpreter'}
        name: {type: string}
        accelerator_model: {type: string}
        base_worker_profile: {type: string}
        compute_capability: {type: string}
        vram_gb: {type: integer, format: int64}
        widths: {type: array, items: {$ref: '#/components/schemas/RentalSkuWidth'}}
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb: {type: integer, format: int64}
        container_disk_gb: {type: integer, format: int64}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
    RentalReplannedBoot:
      type: object
      description: The failed attempt the current one replaced.
      required: [attempt, started_at, ended_at, failure_code]
      properties:
        attempt: {type: integer, format: int64}
        datacenter: {type: string}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        failure_code: {type: string}
        limit_ms: {type: integer, format: int64}
        observed_max_ms: {type: integer, format: int64}
    RentalRequest:
      type: object
      description: A rental's product intent; a quote takes the same body.
      required: [name, sku, media_token_sha256, creator_public_key]
      properties:
        development: {$ref: '#/components/schemas/RentalDevelopment'}
        name:
          type: string
          description: 1-32 lowercase letters, digits and hyphens, beginning with a letter.
        sku: {type: string, description: A product name from GET /v1/rental-skus.}
        provider:
          type: string
          description: An admin's provider choice; refused from anyone else.
        excluded_provider_machines:
          type: array
          description: An admin's excluded provider machines; refused from anyone else.
          items: {type: string}
        image:
          type: string
          maxLength: 512
          description: A registered worker image (digest, tag, reference or kind) in place of the default.
        accelerator_count:
          type: integer
          format: int64
          minimum: 0
          description: GPU count; 0 or omitted is 1.
        media_token_sha256:
          type: string
          description: SHA-256 of the Creator-minted media token, 64 lowercase hex.
        creator_public_key:
          type: string
          description: The rental's Ed25519 public key, unpadded base64url.
        planned_source_bytes: {type: integer, format: int64, minimum: 0}
        serving_models:
          type: array
          maxItems: 32
          items: {$ref: '#/components/schemas/RentalServingModel'}
        container_disk_gb: {type: integer, format: int64, minimum: 0, maximum: 4096}
    RentalServingModel:
      type: object
      required: [model]
      properties:
        lane: {type: string}
        manifest: {type: string}
        model: {type: string}
        release: {type: string}
    RentalSku:
      type: object
      description: One product (a GPU card, or the CPU machine) with the widths buyable now.
      required:
      - name
      - accelerator_model
      - base_worker_profile
      - compute_capability
      - vram_gb
      - widths
      properties:
        python_provisionable_minors: {type: array, items: {type: string}}
        python_interpreters:
          type: array
          items: {$ref: '#/components/schemas/RentalPythonInterpreter'}
        name: {type: string}
        accelerator_model: {type: string, description: 'The GPU model, or CPU.'}
        base_worker_profile: {type: string}
        compute_capability: {type: string, description: major.minor; empty for the CPU product.}
        vram_gb: {type: integer, format: int64}
        widths:
          type: array
          description: The GPU counts buyable now, ascending.
          items: {$ref: '#/components/schemas/RentalSkuWidth'}
    RentalSkuList: {type: array, items: {$ref: '#/components/schemas/RentalSku'}}
    RentalSkuStatus:
      type: object
      description: One (product, GPU count)'s standing.
      required: [name, accelerator_count, known, offered]
      properties:
        name: {type: string}
        accelerator_count: {type: integer, format: int64}
        known: {type: boolean, description: This hub sells a product of that name.}
        offered: {type: boolean, description: Buyable now at that count.}
        sku: {$ref: '#/components/schemas/RentalSku'}
        last_seen_at:
          type: string
          format: date-time
          description: When that count was last buyable; absent when offered now or never seen.
        unavailable_reason:
          type: string
          description: Why compatible stock is held back (cooldown, retry_in_progress).
        retry_after: {type: string, format: date-time}
    RentalSkuWidth:
      type: object
      description: One buyable GPU count of a product and its per-machine prices.
      required:
      - accelerator_count
      - price_usd_micros_per_hour
      - storage_usd_micros_per_hour
      - container_disk_gb
      - expected_price
      properties:
        accelerator_count: {type: integer, format: int64}
        price_usd_micros_per_hour: {type: integer, format: int64}
        storage_usd_micros_per_hour: {type: integer, format: int64}
        bandwidth_usd_micros_per_gb:
          type: integer
          format: int64
          description: The most a GB of traffic costs, where the provider bills traffic.
        container_disk_gb: {type: integer, format: int64}
        vcpu_count: {type: integer, format: int64}
        memory_gb: {type: integer, format: int64}
        expected_price: {$ref: '#/components/schemas/RentalPriceEstimate'}
    RentalWebRtc:
      type: object
      description: A ready machine rental's browser-media listener.
      required: [address, fingerprint]
      properties: {address: {type: string}, fingerprint: {type: string}}
    SearchMeta:
      type: object
      required: [total, limit, capped]
      properties:
        total: {type: integer, format: int64}
        limit: {type: integer, format: int64}
        capped: {type: boolean, description: More matched than the answer holds.}
    Software:
      type: object
      required: [runtime, tensorfs, pinned]
      properties:
        runtime: {type: string}
        tensorfs: {type: string}
        pinned:
          type: boolean
          description: The version is the operator's pin, not the current worker image's.
    TensorfsClosure:
      type: object
      required:
      - bytes
      - complete
      - lane
      - manifest
      - model
      - objects
      - presign_max_digests
      - public
      - release
      - scope
      - server_time_unix
      properties:
        bytes:
          type: integer
          format: int64
          description: The whole closure's length, manifest included.
        complete:
          type: boolean
          description: False when more object rows follow; ask again with after.
        lane: {type: string}
        manifest: {$ref: '#/components/schemas/TensorfsObject'}
        model: {type: string}
        objects:
          type: array
          description: This page's objects, sorted by digest, the manifest excluded.
          items: {$ref: '#/components/schemas/TensorfsObject'}
        presign_max_digests:
          type: integer
          format: int64
          description: The most digests one presign call may ask for.
        public: {type: boolean, description: Every object is a live release's.}
        release: {type: string}
        scope: {type: string}
        server_time_unix: {type: integer, format: int64}
    TensorfsClosureRequest:
      type: object
      required: [ref]
      properties:
        ref:
          type: string
          description: org/name[@release][@sha256:<hex>]; a bare checkpoint hash is its owner's only.
        lane: {type: string}
        lanes:
          type: array
          maxItems: 8
          description: Lanes in order of preference; not beside lane.
          items: {type: string}
        after:
          type: string
          description: The previous page's last object digest, bare hex; omitted on the first page.
        limit:
          type: integer
          format: int64
          minimum: 0
          description: At most this many objects; the hub's page size when omitted or larger.
    TensorfsError:
      type: object
      description: The TensorFS routes' refusal envelope, on the hub's clock.
      required: [error, server_time_unix]
      properties:
        error: {$ref: '#/components/schemas/TensorfsErrorDetail'}
        retry_after_unix:
          type: integer
          format: int64
          description: When to send the same request again, where waiting is the remedy.
        server_time_unix: {type: integer, format: int64}
    TensorfsErrorDetail:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
        remedy: {type: string}
    TensorfsObject:
      type: object
      required: [length, sha256]
      properties:
        length: {type: integer, format: int64}
        sha256: {type: string, description: Bare lowercase hex.}
    TensorfsPresign:
      type: object
      required: [expires_at_unix, server_time_unix, urls]
      properties:
        expires_at_unix: {type: integer, format: int64}
        server_time_unix: {type: integer, format: int64}
        urls:
          type: object
          description: Bare hex digest to its presigned URL.
          additionalProperties: {type: string}
    TensorfsPresignRequest:
      type: object
      required: [digests]
      properties:
        digests:
          type: array
          minItems: 1
          description: SHA-256 digests (bare hex, any case or order, sha256 prefix allowed); at most presign_max_digests.
          items: {type: string}
    WorkerAuthorizedKeys:
      type: object
      required: [worker_id, authorized_keys, lease_seconds]
      properties:
        worker_id: {type: string}
        authorized_keys:
          type: array
          description: Ed25519 public keys, unpadded base64url, sorted.
          items: {type: string}
        lease_seconds:
          type: integer
          format: int64
          description: How long the keys may be trusted before asking again.
    WorkerEndpointReport:
      type: object
      required: [public_host, ports]
      properties:
        public_host: {type: string, description: The machine's public IP.}
        ports:
          type: object
          description: Private TCP port (a decimal string) to its public port.
          minProperties: 1
          maxProperties: 16
          additionalProperties: {type: integer, format: int64, minimum: 1, maximum: 65535}
    WorkerReleaseRequest:
      type: object
      required: [worker_id]
      properties:
        worker_id: {type: string, description: Equal to the X-Cozy-Worker-ID header.}
  parameters:
    Org: {name: org, in: path, required: true, schema: {type: string}}
    Name: {name: name, in: path, required: true, schema: {type: string}}
    Release: {name: release, in: path, required: true, schema: {type: string}}
    Lane: {name: lane, in: path, required: true, schema: {type: string}}
    Operation: {name: operation, in: path, required: true, schema: {type: string}}
    Manifest: {name: manifest, in: path, required: true, schema: {type: string}}
