[package]
name = "platform"
description = "Every OS-specific seam of the cozy binary: paths, locks, files, processes, containment, shared memory, IPC, services, GPU probe"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
hex.workspace = true
libloading.workspace = true
nvml-wrapper.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

# Its own harness: a test's child processes are this binary (`seams child …`), so roles travel in argv.
[[test]]
name = "seams"
harness = false

[lints]
workspace = true
