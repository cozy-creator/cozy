[project]
name = "h3-standin"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.27.0", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "h3_standin:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["h3_standin"]
