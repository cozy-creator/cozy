[project]
name = "placed"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "placed:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["placed"]
