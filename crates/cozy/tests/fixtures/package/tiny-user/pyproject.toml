[project]
name = "Tiny_User"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime", "msgspec>=0.19", "tiny>=0.1.0"]

[project.entry-points."cozy.application"]
default = "tiny_user:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_user"]

# tiny is this account's own package on the command's Hub; cozy writes the index.
[tool.uv.sources]
tiny = { index = "tensorhub" }
