[project]
name = "tiny-release"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "tiny_release:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_release"]
