[project]
name = "tiny-quantizer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime"]

[project.entry-points."cozy.application"]
default = "tiny_quantizer:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tiny_quantizer"]
