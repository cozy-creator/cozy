[package]
name = "cozy"
description = "One binary: the cozy CLI, Calcifer, TensorD and TensorFS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[dependencies]
calcifer.workspace = true
cli.workspace = true
tensord.workspace = true

[features]
# Dev builds only (xs-045 U12): `cozy model migrate` and the machine's migration runs. Never in
# a release.
migrate = ["cli/migrate", "tensord/migrate"]

[dev-dependencies]
base64.workspace = true
platform.workspace = true
protocol.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hub-client = { workspace = true, features = ["testing"] }
portable-pty.workspace = true
rcgen.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tensorfs = { workspace = true, features = ["store"] }
tokio.workspace = true
url.workspace = true
vt100.workspace = true

[lints]
workspace = true

[package.metadata.dist]
dist = true
