[package]
name = "varena"
version = "0.14.0"
edition = "2021"
license.workspace = true
publish.workspace = true
description = "The memory of the processes computing with model weights: one GPU table, one decision procedure, kept pages and the RAM tier."

[dependencies]
crossbeam-channel = "0.5.17"
libc.workspace = true
parking_lot = "0.12.5"
platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tensorfs.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The records' Python classes (`python`): tensorfs-py exposes these structs themselves.
pyo3 = { version = "0.29.2", optional = true }

[features]
# Store-backed sources (checkpoints from a TensorFS store).
default = ["store"]
store = ["tensorfs/store"]
python = ["dep:pyo3"]

[lints]
workspace = true
