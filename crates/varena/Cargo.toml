[package]
name = "varena"
version = "0.14.0"
edition = "2021"
license.workspace = true
publish.workspace = true
description = "The memory of the processes computing with model weights: one GPU table, one decision procedure, kept pages and the RAM tier."

[dependencies]
crossbeam-channel = "0.5.17"
libc.workspace = true
parking_lot = "0.12.5"
platform.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tensorfs.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Store-backed sources (checkpoints from a TensorFS store).
default = ["store"]
store = ["tensorfs/store"]

[dev-dependencies]
tempfile.workspace = true
tracing-subscriber.workspace = true

# Its own harness: the child processes are this binary (`processes child`), roles in argv.
[[test]]
name = "processes"
harness = false

# Its own harness: the agents are this binary (`lease agent <gpu uuid>`).
[[test]]
name = "lease"
harness = false

# Its own harness: TensorD and the executors are this binary (`lease_p0 tensord|agent|raw ...`).
[[test]]
name = "lease_p0"
harness = false

# Its own harness: GPU cases run only when named after --ignored; the agents are this binary.
[[test]]
name = "lease_gpu"
harness = false

[lints]
workspace = true
