[package]
name = "protocol"
description = "The wire types every cozy process shares: the machine API and its client, Cozy-Cap, the error envelope, ids and config.toml"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
platform.workspace = true
ed25519-dalek.workspace = true
eventsource-stream.workspace = true
futures-util.workspace = true
hex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_ignored.workspace = true
serde_path_to_error.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
url.workspace = true
utoipa.workspace = true
# The executor wire's Python classes (`python`): tensorfs-py exposes these structs themselves.
pyo3 = { version = "0.29.2", optional = true }

[features]
python = ["dep:pyo3"]

[lints]
workspace = true
