[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "calcifer-cpu-outputs"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["cozy-runtime", "msgspec>=0.19,<1"]

[project.entry-points."cozy.application"]
default = "cpu_outputs:app"

[tool.uv.build-backend]
module-name = "cpu_outputs"
module-root = ""
