[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tensord-client"
version = "0.1.0"
description = "TensorD's package installer helper and output encoder"
requires-python = ">=3.11"
dependencies = ["msgspec>=0.18,<1"]

[project.optional-dependencies]
installer = ["packaging>=24,<27"]

[tool.setuptools.packages.find]
where = ["python"]
