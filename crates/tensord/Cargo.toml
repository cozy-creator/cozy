[package]
name = "tensord"
version = "0.7.1"
edition = "2021"
publish.workspace = true

[dependencies]
cozy-platform.workspace = true
cozy-proto.workspace = true
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tensorfs-core = { workspace = true, features = ["store"] }
tensorfs-plane = { workspace = true, features = ["store"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
fs2.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
nix = { workspace = true, features = ["fs", "socket", "uio", "user", "signal", "process", "net"] }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
webpki-roots.workspace = true
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
tonic = { workspace = true, features = ["router", "transport", "tls-aws-lc"] }
tonic-prost.workspace = true
prost.workspace = true
axum.workspace = true
ed25519-dalek.workspace = true
rcgen.workspace = true
base64.workspace = true
hmac = "0.12"
sha2.workspace = true
png = "0.17"
image-webp = "0.2"
tar.workspace = true
rustls.workspace = true
rustls-pemfile = "2"
aws-lc-rs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time = "0.3"

[dev-dependencies]
x509-parser = "0.18"

[build-dependencies]
zip = { version = "7", default-features = false }
sha2.workspace = true
base64.workspace = true
