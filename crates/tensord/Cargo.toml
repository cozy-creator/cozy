[package]
name = "tensord"
# TensorD keeps its own version until it becomes the binary's `machine serve` role (xs-043 T).
version = "0.7.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
base64.workspace = true
bytes.workspace = true
cozy-proto.workspace = true
ed25519-dalek.workspace = true
fs2.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
libc.workspace = true
nix = { workspace = true, features = ["fs", "socket", "uio", "user", "signal", "process", "net"] }
prost.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
sha2.workspace = true
tensorfs-core = { workspace = true, features = ["store"] }
tensorfs-plane = { workspace = true, features = ["store"] }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
# ring until the crypto provider is unified on aws-lc-rs (xs-043 T).
rcgen = { version = "0.14", features = ["pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { workspace = true, features = ["router", "transport", "tls-ring"] }
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
hmac = "0.12"
png = "0.17"
image-webp = "0.2"
tar = "0.4"
rustls-pemfile = "2"
time = "0.3"

[dev-dependencies]
tonic-prost.workspace = true
x509-parser = "0.18"

[build-dependencies]
base64.workspace = true
sha2.workspace = true
zip = { version = "7", default-features = false }
