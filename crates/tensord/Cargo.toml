[package]
name = "tensord"
version = "0.7.2"
edition = "2021"
publish.workspace = true

[dependencies]
cozy-proto.workspace = true
str0m = { version = "0.24", default-features = false, features = ["aws-lc-rs"] }
tensorfs-core = { workspace = true, features = ["store"] }
tensorfs-plane = { workspace = true, features = ["store"] }
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
serde_json_canonicalizer.workspace = true
fs2.workspace = true
libc.workspace = true
rusqlite = { workspace = true, features = ["fallible_uint"] }
uuid = { version = "1", features = ["v4"] }
nix = { workspace = true, features = ["fs", "socket", "uio", "user", "signal", "process", "net"] }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true
webpki-roots = "1"
zip = { version = "7", default-features = false, features = ["deflate-flate2"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost.workspace = true
prost.workspace = true
axum.workspace = true
ed25519-dalek.workspace = true
rcgen = { version = "0.14", features = ["pem", "ring"] }
base64.workspace = true
hmac = "0.12"
sha2.workspace = true
png = "0.17"
image-webp = "0.2"
tar.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
rustls-pemfile = "2"
ring = "0.17"
time = "0.3"

[dev-dependencies]
x509-parser = "0.18"

[build-dependencies]
zip = { version = "7", default-features = false }
sha2.workspace = true
base64.workspace = true
