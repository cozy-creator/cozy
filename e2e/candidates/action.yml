name: candidates
description: >
  The candidates, built on this runner and named for e2e/lib.sh in $CANDIDATES. On Linux, always the whole set
  (a released Runtime before CPU mode cannot run a model here, so no Linux suite falls back to releases):
  TensorD (the dev cozy, <version>+dev.g<sha8>), the TensorFS wheel and the cozy-runtime wheel, the change's
  repo at its commit and the other two at `stack_ref` / `runtime_ref` (master), so a mismatch between them
  fails here and not on PyPI. On macOS and Windows, only what the change's own repo builds (the rest is the
  release). `tensord`, `tensorfs` and `runtime` name a release to take instead of a build (Linux): the set a
  person has, checked against the change. A packages change adds its checkout; on Linux any other change takes
  packages master ($PACKAGES_MASTER), the packages that ship with this set. The change's repo is at .src.
inputs:
  repo:
    description: The repo whose change this is
    required: true
  ref:
    description: Its change's commit
    required: true
  build:
    description: Space-separated build tokens (ci/affected's build:<artifact>); any token builds the whole set
    default: ''
  stack_ref:
    description: The cozy-creator commit TensorD and TensorFS come from, unless the change is cozy-creator's
    default: master
  runtime_ref:
    description: The cozy-runtime commit the Runtime comes from, unless the change is cozy-runtime's
    default: master
  tensord:
    description: A cozy release (GitHub) to take as TensorD instead of building it
    default: ''
  tensorfs:
    description: A TensorFS release (PyPI) to take instead of building it
    default: ''
  runtime:
    description: A cozy-runtime release (PyPI) to take instead of building it
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
    - if: inputs.build != '' || runner.os == 'Linux'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: .src
    - if: inputs.repo != 'cozy-creator' && runner.os == 'Linux'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-creator
        ref: ${{ inputs.stack_ref }}
        path: .stack
    - if: inputs.repo != 'cozy-runtime' && runner.os == 'Linux'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-runtime
        ref: ${{ inputs.runtime_ref }}
        path: .rt
    - if: inputs.repo != 'packages' && runner.os == 'Linux'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/packages
        path: .pkgs
    - if: inputs.repo != 'packages' && runner.os == 'Linux'
      shell: bash
      run: echo "PACKAGES_MASTER=.pkgs" >> "$GITHUB_ENV"
    - if: runner.os == 'Linux' || (inputs.build != '' && inputs.repo == 'cozy-creator')
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }} -> target
    - if: inputs.build != '' || runner.os == 'Linux'
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        BUILD: ${{ inputs.build }}
        TENSORD: ${{ inputs.tensord }}
        TENSORFS: ${{ inputs.tensorfs }}
        RUNTIME: ${{ inputs.runtime }}
        GH_TOKEN: ${{ github.token }}
        CARGO_PROFILE_RELEASE_LTO: "off"
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/candidates exe=''
        mkdir -p "$out"
        [ "$RUNNER_OS" != Windows ] || exe=.exe
        creator=.stack runtime=.rt cozy=1 tfs=1
        [ "$REPO" != cozy-creator ] || creator=.src
        [ "$REPO" != cozy-runtime ] || runtime=.src
        if [ "$RUNNER_OS" != Linux ]; then
          [ "$REPO" = cozy-creator ] || creator=''
          [ "$REPO" = cozy-runtime ] || runtime=''
          [[ " $BUILD " == *" cozy "* ]] || cozy=''
          [[ " $BUILD " == *" tensorfs "* ]] || tfs=''
        fi
        args=()
        release() { python3 -m pip download -q --no-deps --only-binary :all: "$1==$2" -d "$out"; }
        if [ -n "$TENSORD" ]; then
          # dist's archive: one top directory holding cozy.
          gh release download "v$TENSORD" -R cozy-creator/cozy-creator -p "cozy-$(uname -m)-unknown-linux-gnu.tar.gz" -O - \
            | tar -xzO --wildcards '*/cozy' > "$out/cozy$exe"
          chmod +x "$out/cozy$exe"; cozy=''
          args+=(--cozy-bin "$out/cozy$exe")
          echo "TensorD: $("$out/cozy$exe" --version), the release"
        fi
        if [ -n "$TENSORFS" ]; then release tensorfs "$TENSORFS"; tfs=''; args+=(--tensorfs-wheel "$(ls "$out"/tensorfs-*.whl)"); fi
        if [ -n "$RUNTIME" ]; then release cozy-runtime "$RUNTIME"; runtime=''; args+=(--runtime-wheel "$(ls "$out"/cozy_runtime-*.whl)"); fi
        if [ -n "$creator" ] && [ -n "$cozy" ]; then
          # TensorD: the dev build `cozy machine update --tensord` takes, dev-build.yaml's stamp.
          (cd "$creator"
            sha=$(git rev-parse HEAD)
            cargo fetch --locked
            uv run -q --no-project python -c 'import re,sys; p="Cargo.toml"; s=open(p).read(); open(p,"w").write(re.sub(r"(?m)^version = \"([^\"]+)\"$", lambda m: f"version = \"{m[1]}+dev.g{sys.argv[1][:8]}\"", s, count=1))' "$sha"
            cargo update -w --offline
            COZY_COMMIT=$sha cargo build --release --locked --offline -p cozy --bin cozy
            git checkout -- Cargo.toml Cargo.lock)
          cp "$creator/target/release/cozy$exe" "$out/cozy$exe"
          args+=(--cozy-bin "$out/cozy$exe")
          echo "TensorD: $("$out/cozy$exe" --version) from cozy-creator $(cd "$creator" && git rev-parse --short HEAD)"
        fi
        if [ -n "$creator" ] && [ -n "$tfs" ]; then
          (cd "$creator"
            cargo build --release --locked -p tensorfs --bin tfs
            mkdir -p crates/tensorfs-py/wheel-data/scripts
            cp "target/release/tfs$exe" crates/tensorfs-py/wheel-data/scripts/
            cd crates/tensorfs-py && uvx -q maturin@1.15.0 build --release --locked --out "$out")
          args+=(--tensorfs-wheel "$(ls "$out"/tensorfs-*.whl)")
        fi
        if [ -n "$runtime" ]; then
          (cd "$runtime"
            uv run -q --no-project python scripts/stamp-build-provenance.py "$(git rev-parse HEAD)"
            uv build -q --wheel --out-dir "$out")
          args+=(--runtime-wheel "$(ls "$out"/cozy_runtime-*.whl)")
          echo "Runtime: $(basename "$(ls "$out"/cozy_runtime-*.whl)") from cozy-runtime $(cd "$runtime" && git rev-parse --short HEAD)"
        fi
        [[ " $BUILD " != *" package "* ]] || args+=(--packages .src)
        echo "CANDIDATES=${args[*]:-}" >> "$GITHUB_ENV"
        echo "candidates: ${args[*]:-none}"
    - if: inputs.build == '' && runner.os != 'Linux'
      shell: bash
      run: |
        echo "CANDIDATES=" >> "$GITHUB_ENV"
        echo "candidates: none (the released cozy, Runtime and TensorFS)"
