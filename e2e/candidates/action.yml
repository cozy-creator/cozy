name: candidates
description: >
  The candidate set, built on this runner for its own OS and named for e2e/lib.sh in $CANDIDATES: TensorD
  (the dev cozy, <version>+dev.g<sha8>), the TensorFS wheel and the cozy-runtime wheel, the change's repo at
  its commit and the other two at `stack_ref` / `runtime_ref` (master), so a mismatch between them fails here
  and not on PyPI, plus packages master ($PACKAGES_MASTER) unless the change is the packages'. No candidate
  leg tests a released binary: a released Runtime before CPU mode cannot run a model on these runners, and a
  released cozy carries the bugs master fixed. `tensord`, `tensorfs` and `runtime` take a built candidate
  instead of a build (a release's set, its GitHub prerelease, or a published one), for this runner's OS: a
  version (PyPI for the wheels, the `v<version>` release for cozy), a release tag (cozy-creator's
  `v<version>` / `tensorfs-v<version>`, cozy-runtime's `v<version>`; this OS's asset, checked against the
  release's SHA256SUMS), or a URL#sha256=<hex>. The change's repo is at .src.
inputs:
  repo:
    description: The repo whose change this is
    required: true
  ref:
    description: Its change's commit
    required: true
  build:
    description: Space-separated build tokens (ci/affected's build:<artifact>); any token builds the whole set
    default: ''
  stack_ref:
    description: The cozy-creator commit TensorD and TensorFS come from, unless the change is cozy-creator's
    default: master
  runtime_ref:
    description: The cozy-runtime commit the Runtime comes from, unless the change is cozy-runtime's
    default: master
  tensord:
    description: TensorD (cozy) to take instead of building it, this OS's (a version, a release tag or URL#sha256=)
    default: ''
  tensorfs:
    description: The TensorFS wheel to take instead of building it, this OS's (a PyPI version, a release tag or URL#sha256=)
    default: ''
  runtime:
    description: The cozy-runtime wheel to take instead of building it, this OS's (a PyPI version, a release tag or URL#sha256=)
    default: ''
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v7
    - uses: actions/checkout@v5
      with:
        repository: cozy-creator/${{ inputs.repo }}
        ref: ${{ inputs.ref }}
        path: .src
    - if: inputs.repo != 'cozy-creator'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-creator
        ref: ${{ inputs.stack_ref }}
        path: .stack
    - if: inputs.repo != 'cozy-runtime'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/cozy-runtime
        ref: ${{ inputs.runtime_ref }}
        path: .rt
    - if: inputs.repo != 'packages'
      uses: actions/checkout@v5
      with:
        repository: cozy-creator/packages
        path: .pkgs
    - if: inputs.repo != 'packages'
      shell: bash
      run: echo "PACKAGES_MASTER=.pkgs" >> "$GITHUB_ENV"
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.repo == 'cozy-creator' && '.src' || '.stack' }} -> target
    - shell: bash
      env:
        REPO: ${{ inputs.repo }}
        BUILD: ${{ inputs.build }}
        TENSORD: ${{ inputs.tensord }}
        TENSORFS: ${{ inputs.tensorfs }}
        RUNTIME: ${{ inputs.runtime }}
        GH_TOKEN: ${{ github.token }}
        CARGO_PROFILE_RELEASE_LTO: "off"
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        CARGO_INCREMENTAL: "0"
      run: |
        set -euo pipefail
        out=$RUNNER_TEMP/candidates exe=''
        mkdir -p "$out"
        [ "$RUNNER_OS" != Windows ] || exe=.exe
        creator=.stack runtime=.rt cozy=1 tfs=1
        [ "$REPO" != cozy-creator ] || creator=.src
        [ "$REPO" != cozy-runtime ] || runtime=.src
        args=()
        # A built candidate for this OS: take <repo> <spec> <wheel name | cozy>; prints the file it fetched.
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64) whl='manylinux*x86_64.whl' target=x86_64-unknown-linux-gnu ;;
          Linux-aarch64) whl='manylinux*aarch64.whl' target=aarch64-unknown-linux-gnu ;;
          macOS-arm64) whl='macosx*arm64.whl' target=aarch64-apple-darwin ;;
          macOS-x86_64) whl='macosx*x86_64.whl' target=x86_64-apple-darwin ;;
          Windows-*) whl='win_amd64.whl' target=x86_64-pc-windows-msvc ;;
        esac
        sum() { if command -v sha256sum > /dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
        take() {
          local repo=$1 spec=$2 name=$3 dir file want
          dir=$(mktemp -d)
          if [[ $spec == *://* ]]; then
            file=$dir/$(basename "${spec%%#*}"); curl -fsSL -o "$file" "${spec%%#*}"
            want=${spec##*#sha256=}; [ "$want" = "$spec" ] || [ "$(sum "$file")" = "$want" ] || { echo "$file: not sha256 $want" >&2; return 1; }
          elif [[ $spec == v* || $spec == tensorfs-v* || $name == cozy ]]; then
            [[ $spec == v* || $spec == tensorfs-v* ]] || spec=v$spec
            if [ "$name" = cozy ]; then
              gh release download "$spec" -R "cozy-creator/$repo" -D "$dir" -p "cozy-$target.*" -p SHA256SUMS -p '*.sha256' || true
            else
              gh release download "$spec" -R "cozy-creator/$repo" -D "$dir" -p "$name-*-$whl" -p "$name-*-py3-none-any.whl" -p SHA256SUMS || true
            fi
            # This OS's archive, or wheel: abi3 first, then CPython 3.12's, then the pure one.
            file=''
            for f in "$dir"/cozy-"$target".tar.gz "$dir"/cozy-"$target".zip "$dir"/$name-*-abi3-$whl "$dir"/$name-*-cp312-cp312-$whl "$dir"/$name-*-py3-none-any.whl; do
              [ -e "$f" ] && { file=$f; break; }
            done
            [ -n "$file" ] || { echo "release $spec of cozy-creator/$repo has no $name for $target" >&2; return 1; }
            want=$( (cat "$dir"/SHA256SUMS "$file.sha256" 2>/dev/null || true) | grep -F "$(basename "$file")" | head -1 | cut -d' ' -f1)
            [ -z "$want" ] || [ "$(sum "$file")" = "$want" ] || { echo "$file: not its SHA256SUMS $want" >&2; return 1; }
          else
            uvx -q --from pip pip download -q --no-deps --only-binary :all: "${name//_/-}==$spec" -d "$dir"
            file=$(ls "$dir"/*.whl | head -1)
          fi
          if [ "$name" = cozy ] && [[ $file != *.whl ]]; then
            # dist's archive: one top directory holding cozy (cozy.exe on Windows).
            uv run -q --no-project python - "$file" "$out/cozy$exe" <<'PY'
        import sys, tarfile, zipfile
        src, dst = sys.argv[1:]
        if src.endswith(".zip"):
            z = zipfile.ZipFile(src); data = z.read(next(n for n in z.namelist() if n.split("/")[-1] in ("cozy", "cozy.exe")))
        else:
            t = tarfile.open(src); data = t.extractfile(next(m for m in t.getmembers() if m.name.split("/")[-1] == "cozy")).read()
        open(dst, "wb").write(data)
        PY
            chmod +x "$out/cozy$exe"; file=$out/cozy$exe
          else
            cp "$file" "$out/"; file=$out/$(basename "$file")
          fi
          echo "$file"
        }
        if [ -n "$TENSORD" ]; then
          args+=(--cozy-bin "$(take cozy-creator "$TENSORD" cozy)"); cozy=''
          echo "TensorD: $("$out/cozy$exe" --version), taken ($TENSORD)"
        fi
        if [ -n "$TENSORFS" ]; then args+=(--tensorfs-wheel "$(take cozy-creator "$TENSORFS" tensorfs)"); tfs=''; fi
        if [ -n "$RUNTIME" ]; then args+=(--runtime-wheel "$(take cozy-runtime "$RUNTIME" cozy_runtime)"); runtime=''; fi
        if [ -n "$creator" ] && [ -n "$cozy" ]; then
          # TensorD: the dev build `cozy machine update --tensord` takes, dev-build.yaml's stamp.
          (cd "$creator"
            sha=$(git rev-parse HEAD)
            cargo fetch --locked
            uv run -q --no-project python -c 'import re,sys; p="Cargo.toml"; s=open(p).read(); open(p,"w").write(re.sub(r"(?m)^version = \"([^\"]+)\"$", lambda m: f"version = \"{m[1]}+dev.g{sys.argv[1][:8]}\"", s, count=1))' "$sha"
            cargo update -w --offline
            COZY_COMMIT=$sha cargo build --release --locked --offline -p cozy --bin cozy
            git checkout -- Cargo.toml Cargo.lock)
          cp "$creator/target/release/cozy$exe" "$out/cozy$exe"
          args+=(--cozy-bin "$out/cozy$exe")
          echo "TensorD: $("$out/cozy$exe" --version) from cozy-creator $(cd "$creator" && git rev-parse --short HEAD)"
        fi
        if [ -n "$creator" ] && [ -n "$tfs" ]; then
          (cd "$creator"
            cargo build --release --locked -p tensorfs --bin tfs
            mkdir -p crates/tensorfs-py/wheel-data/scripts
            cp "target/release/tfs$exe" crates/tensorfs-py/wheel-data/scripts/
            cd crates/tensorfs-py && uvx -q maturin@1.15.0 build --release --locked --out "$out")
          args+=(--tensorfs-wheel "$(ls "$out"/tensorfs-*.whl)")
        fi
        if [ -n "$runtime" ]; then
          (cd "$runtime"
            uv run -q --no-project python scripts/stamp-build-provenance.py "$(git rev-parse HEAD)"
            uv build -q --wheel --out-dir "$out")
          args+=(--runtime-wheel "$(ls "$out"/cozy_runtime-*.whl)")
          echo "Runtime: $(basename "$(ls "$out"/cozy_runtime-*.whl)") from cozy-runtime $(cd "$runtime" && git rev-parse --short HEAD)"
        fi
        [[ " $BUILD " != *" package "* ]] || args+=(--packages .src)
        echo "CANDIDATES=${args[*]:-}" >> "$GITHUB_ENV"
        echo "candidates: ${args[*]:-none}"
