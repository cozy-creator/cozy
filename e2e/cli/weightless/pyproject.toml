[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "e2e-weightless"
version = "0.1.0"
description = "The cli suite's weightless request"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.30", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "e2e_weightless:app"

[tool.uv.build-backend]
module-name = "e2e_weightless"
module-root = ""
