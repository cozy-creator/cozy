# Per-test liveness for the native matrix (platforms.yaml): a test silent past its bound is
# ended and reported, and the run goes on. A hung test costs minutes, never the job.
[profile.platforms]
slow-timeout = { period = "60s", terminate-after = 3 }
leak-timeout = "1s"
fail-fast = false
failure-output = "immediate-final"
status-level = "fail"
final-status-level = "slow"
test-threads = 2

# Paced on purpose (each answer crawls ~1.6 MB/s, then the table is squeezed): ~200 s of
# real work on a 4-core runner.
[[profile.platforms.overrides]]
filter = 'binary(fd_budget)'
slow-timeout = { period = "60s", terminate-after = 8 }
