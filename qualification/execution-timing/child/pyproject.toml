[project]
name = "cozy-timing-proof"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cozy-runtime==0.18.89", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "timing_proof:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["timing_proof.py"]
