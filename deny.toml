# cargo deny check (xs-067): advisories, licences, the crate allow-list and duplicate versions.
# A crate not listed under [bans] allow fails the check: a new dependency is a reviewed addition.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: TensorD drops it (xs-067)" },
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BlueOak-1.0.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
skip = [
    { crate = "base64@0.22.1", reason = "ours; reqwest is on 0.23" },
    { crate = "block-buffer@0.12.1", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "const-oid@0.10.2", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "cpufeatures@0.3.1", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "crypto-common@0.2.2", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "digest@0.11.3", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "hmac@0.13.0", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "sha2@0.11.1", reason = "aws-sigv4's digest 0.11 stack" },
    { crate = "darling@0.20.11", reason = "nvml-wrapper's derive" },
    { crate = "darling_core@0.20.11", reason = "nvml-wrapper's derive" },
    { crate = "darling_macro@0.20.11", reason = "nvml-wrapper's derive" },
    { crate = "getrandom@0.3.4", reason = "ours; tempfile is on 0.4" },
    { crate = "libloading@0.8.9", reason = "nvml-wrapper" },
    { crate = "nom@7.1.3", reason = "eventsource-stream; x509-parser (dev)" },
    { crate = "serde_json_canonicalizer@0.3.2", reason = "tensord; sigstore is on 0.4" },
    { crate = "syn@2.0.119", reason = "proc macros not yet on syn 3" },
    { crate = "thiserror@1.0.69", reason = "nvml-wrapper; portable-pty (dev)" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1" },
    { crate = "untrusted@0.7.1", reason = "aws-lc-rs" },
    { crate = "windows-sys@0.52.0", reason = "older Windows crates" },
]
