[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# release.yml is dist's output plus hand edits, each marked HAND-EDITED there: the `must_contain`
# dispatch input and the plan job's first step, which refuses a release missing any
# must_contain commit, the global job's step running scripts/patch-installers.sh, and the homebrew job's
# checkout with the tap's deploy key (secret HOMEBREW_TAP_DEPLOY_KEY) in place of dist's token. And CI v2's
# pre-release: the `promote` input, host's `--prerelease --latest=false`, the custom-release-gate and
# custom-release-promote jobs (release-gate.yml, release-promote.yml) in place of dist's homebrew job, and
# announce's need of the promotion.
# After `dist generate` (or a dist upgrade), put them back.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
install-path = "~/.cozy/bin"
# Embedded in the installers' double-quoted strings (sh, PowerShell): no backticks, $ or double quotes.
install-success-msg = "cozy is installed in ~/.cozy/bin. It keeps its machine, models and outputs in ~/.cozy, and its PATH lines source ~/.config/cozy; the README's 'Remove cozy' lists everything to delete. 'cozy doctor' checks this computer's cozy."
install-updater = false
dispatch-releases = true
precise-builds = true
source-tarball = false
pr-run-mode = "skip"
github-attestations = true
tap = "cozy-creator/homebrew-tap"
# A published release pushes its Formula/cozy.rb to the tap.
publish-jobs = ["homebrew"]
# Each archive's attestation bundles, which `cozy update` verifies, ride in the release.
global-artifacts-jobs = ["./release-attestations"]
unix-archive = ".tar.gz"

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = { runner = "ubuntu-24.04", container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" } }
aarch64-unknown-linux-gnu = { runner = "ubuntu-24.04-arm", container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" } }
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"
