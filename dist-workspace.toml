[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# .github/workflows/cozy-publish.yaml is dist's release.yml, renamed, plus hand edits, each marked HAND-EDITED
# there: the `must_contain` dispatch input and the plan job's first step, which refuses a release missing any
# must_contain commit; the global job's step running scripts/patch-installers.sh; host's `--prerelease
# --latest=false` (every release is a candidate, CI v2); no homebrew job: cozy-promote.yaml pushes the formula the
# release carries, with the tap's deploy key (secret HOMEBREW_TAP_DEPLOY_KEY), once a recorded gate passed it; and
# the attestations job at cozy-attestations.yaml. After `dist generate` (or a dist upgrade), move release.yml to
# cozy-publish.yaml and put them back. `cozy update` verifies a release's signer is cozy-publish.yaml: renaming this
# file again is a hard cut for every installed cozy.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
install-path = "~/.cozy/bin"
# Embedded in the installers' double-quoted strings (sh, PowerShell): no backticks, $ or double quotes.
install-success-msg = "cozy is installed. Optional: run 'cozy tools install ffmpeg' to trim video uploads; 'cozy tools list' shows each tool and what it adds."
install-updater = false
dispatch-releases = true
precise-builds = true
source-tarball = false
pr-run-mode = "skip"
github-attestations = true
tap = "cozy-creator/homebrew-tap"
# A published release pushes its Formula/cozy.rb to the tap.
publish-jobs = ["homebrew"]
# Each archive's attestation bundles, which `cozy update` verifies, ride in the release (.github/workflows/
# cozy-attestations.yaml; dist writes the path as .yml).
global-artifacts-jobs = ["./cozy-attestations"]
unix-archive = ".tar.gz"

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = { runner = "ubuntu-24.04", container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" } }
aarch64-unknown-linux-gnu = { runner = "ubuntu-24.04-arm", container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" } }
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"
