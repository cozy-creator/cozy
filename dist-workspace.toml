[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
# release.yml is dist's output plus hand edits, each marked HAND-EDITED there: the `must_contain` and
# `tensorfs_run` dispatch inputs and the plan job's first step, which refuses a release missing any
# must_contain commit. After `dist generate` (or a dist upgrade), put them back.
allow-dirty = ["ci"]
ci = "github"
installers = ["shell", "powershell", "homebrew"]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]
install-path = "~/.cozy/bin"
install-updater = false
dispatch-releases = true
precise-builds = true
source-tarball = false
pr-run-mode = "skip"
github-attestations = true
tap = "cozy-creator/homebrew-tap"
# Homebrew's formula is built with every release and pushed nowhere until the owner opens the tap.
publish-jobs = []
# A release needs a green platforms.yaml run on its commit, and its own artifacts must pass the smoke.
# Both gate `host` by their result (a failed plan-job would skip the builds, which `host` accepts).
local-artifacts-jobs = ["./release-gate"]
# release-gate reads an unpublished tensorfs wheel from a tensorfs-release run (dry runs and prereleases).
github-custom-job-permissions = { "release-gate" = { contents = "read", actions = "read" } }
global-artifacts-jobs = ["./release-smoke"]
unix-archive = ".tar.gz"

[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-gnu = { runner = "ubuntu-24.04", container = { image = "quay.io/pypa/manylinux_2_28_x86_64", host = "x86_64-unknown-linux-musl" } }
aarch64-unknown-linux-gnu = { runner = "ubuntu-24.04-arm", container = { image = "quay.io/pypa/manylinux_2_28_aarch64", host = "aarch64-unknown-linux-musl" } }
aarch64-apple-darwin = "macos-15"
x86_64-pc-windows-msvc = "windows-2025"
aarch64-pc-windows-msvc = "windows-11-arm"
