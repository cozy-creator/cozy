name: cozy-promote
# A cozy candidate (cozy-publish.yaml) is a GitHub prerelease, which `cozy update`, the tensorhub.com installer and
# Homebrew don't follow. Once the release agent's chosen suites passed (release testing is manual, recorded), it
# becomes what users get: GitHub's latest and Homebrew's formula, the same files, nothing rebuilt (tracker design
# ci-v2, pre-release and promotion). By hand, or from release-gate/promote.sh:
#   gh workflow run cozy-promote.yaml -R cozy-creator/cozy-creator -f tag=v0.11.17 -f gate=<release-gate run id | record URL>
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The candidate's tag (a prerelease)
        type: string
        required: true
      gate:
        description: "The passing gate: a release-gate.yml run id (verified), or the URL of a recorded hand gate"
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: release-promote

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      GATE: ${{ inputs.gate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: creator
      - name: The gate passed exactly this candidate
        run: |
          [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = true ] \
            || { echo "::error::$TAG is not a candidate (a prerelease)"; exit 1; }
          case $GATE in
            https://*) echo "$TAG: gated by hand, recorded at $GATE" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0 ;;
            *[!0-9]* | '') echo "::error::gate is a release-gate run id or a record URL, not '$GATE'"; exit 1 ;;
          esac
          set_=$(creator/release-gate/verify.sh "$GATE")
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p cozy-x86_64-unknown-linux-gnu.tar.gz -D c
          tar -xzf c/cozy-x86_64-unknown-linux-gnu.tar.gz -C c
          sha=$(sha256sum c/cozy-x86_64-unknown-linux-gnu/cozy | cut -d' ' -f1)
          [ "$(jq -r .cozy_sha256 <<< "$set_")" = "$sha" ] || { echo "::error::gate $GATE ran another cozy than $TAG"; exit 1; }
      - name: Latest, for `cozy update` and the installer
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
      # dist's homebrew job, moved here: the formula the release carries, pushed over SSH with the tap's deploy key.
      - uses: actions/checkout@v6
        with:
          repository: cozy-creator/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
          path: tap
      - name: Homebrew
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p cozy.rb -D tap/Formula --clobber
          cd tap
          git config user.name "Paul Fidika"; git config user.email paul@fidika.com
          git add Formula/cozy.rb
          git diff --cached --quiet || { git commit -m "cozy ${TAG#v}"; git push; }
