name: tfs-straggler-proof
# TEMPORARY: proves release-gate/suites/tensorfs's straggler case on a runner with a normal network. Removed before merge.
on:
  pull_request:
    paths: [release-gate/suites/tensorfs/**, .github/workflows/tfs-straggler-proof.yaml]
jobs:
  straggler:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: straggler case
        run: |
          set -u
          T=$RUNNER_TEMP/suite-tensorfs; mkdir -p "$T"; HERE=$PWD/release-gate TWF=; export T HERE TWF
          log() { echo "$(date -u +%H:%M:%SZ) $*"; }
          eval "$(sed -n '/^tfs_straggler() {/,/^}/p' release-gate/suites/tensorfs/cells.sh)"
          tfs_straggler straggler-clean 0
          tfs_straggler straggler-slow 3
          echo "label: proof" > "$RUNNER_TEMP/label"
          cd "$RUNNER_TEMP" && python3 -I - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import os, sys
          sys.path.insert(0, os.path.join(os.environ['GITHUB_WORKSPACE'], 'release-gate', 'suites'))
          from tensorfs import check
          fails, notes = check.check({'out': '.', 'sku': 'runner', 'summary': {}, 'records': {}, 'baseline': {'cells': {}}})
          for line in notes + fails:
              if 'straggler' in line:
                  print(('FAIL ' if line in fails else 'note ') + line)
          sys.exit(1 if any('straggler' in f for f in fails) else 0)
          PY
