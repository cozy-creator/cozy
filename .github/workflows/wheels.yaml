name: wheels
# Every file the release publishes: one abi3 wheel per platform, each built and smoke-installed
# on a runner of its own platform, and the sdist, proven by a source install. publish.yaml calls
# this and uploads exactly these artifacts. macOS bills at 10x, so pull requests never run it.
#   gh workflow run wheels.yaml -R cozy-creator/tensorfs --ref <branch-or-tag>
on:
  workflow_call:
  workflow_dispatch:
# A literal prefix: a called workflow sees the caller's github.workflow.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc }
    env:
      CARGO_BUILD_JOBS: "4"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The `tfs` binary ships in the wheel's data scripts beside the module. On Linux it is
      # built INSIDE the manylinux container so its glibc floor matches the extension (tfs-051).
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked -p tensorfs-core --bin tfs
            install -D -m 755 target/release/tfs wheel-data/scripts/tfs
      - if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@1.91.1
      - if: runner.os != 'Linux'
        run: |
          cargo build --release --locked -p tensorfs-core --bin tfs
          cp target/release/tfs$([ "$RUNNER_OS" = Windows ] && echo .exe) wheel-data/scripts/
      - if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: Smoke (the installed module and CLI)
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c 'import tensorfs, tensorfs.plane; print(tensorfs.__version__)'
          tfs version
      # Consumed by publish.yaml in the same run.
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3

  # The sdist builds anywhere a Rust toolchain does: proven by installing it from source.
  # Built from source it carries the module, not the `tfs` binary (the wheels do).
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          command: sdist
          args: --out dist
      - run: |
          python -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c 'import tensorfs, tensorfs.plane; print(tensorfs.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 3
