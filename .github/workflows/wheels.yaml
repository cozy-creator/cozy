name: wheels
# The wheels a release publishes, built on the org's self-hosted release runner (owner, 2026-09-28:
# no CI, no GitHub-hosted minutes). Linux x86_64 only: this box cannot build the macOS wheels, and
# aarch64 would need qemu. Those platforms return with hosted runners.
#   gh workflow run wheels.yaml -R cozy-creator/tensorfs --ref <branch-or-tag>
on:
  workflow_call:
  workflow_dispatch:
# A literal prefix: a called workflow sees the caller's github.workflow.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wheel:
    name: wheel linux-x86_64
    runs-on: cozy-local
    # Hang bound, not a work budget.
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      # The binary is built INSIDE the manylinux container so its glibc floor matches the
      # extension module it ships beside (tfs-051).
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked -p tensorfs-core --bin tfs
            install -D -m 755 target/release/tfs wheel-data/scripts/tfs
      - run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3
      # The manylinux container writes root-owned files into the runner's workspace.
      - if: always()
        run: docker run --rm -v "$GITHUB_WORKSPACE:/w" alpine:3.20 chown -R "$(id -u):$(id -g)" /w
