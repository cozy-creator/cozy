name: consumer-probe
# xs-060 probe: the public install path and a first user's walkthrough on every release runner.
on:
  push:
    branches: [probe/xs-060-consumer]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[probe]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04 }
          - { os: ubuntu-24.04-arm }
          - { os: macos-15 }
          - { os: macos-15-intel }
          - { os: windows-2025, ps: powershell }
          - { os: windows-11-arm, ps: pwsh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github
      - run: bash .github/consumer-probe.sh ${{ matrix.os }} ${{ matrix.ps }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transcript-${{ matrix.os }}
          path: transcript.md
  master:
    if: contains(github.event.head_commit.message, '[master]')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p cozy
      - run: |
          exe=; [ "$RUNNER_OS" != Windows ] || exe=.exe
          cp "target/release/cozy$exe" "$RUNNER_TEMP/cozy$exe"
          DEV_BINARY="$RUNNER_TEMP/cozy$exe" bash .github/consumer-probe.sh ${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: master-${{ matrix.os }}
          path: transcript.md
  installers:
    if: contains(github.event.head_commit.message, '[installers]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/xs-060-windows-reinstall
      - run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh
          dist build --artifacts=global --output-format=json > /dev/null
          scripts/patch-installers.sh target/distrib
          ls target/distrib
      - uses: actions/upload-artifact@v7
        with:
          name: installers
          path: target/distrib/cozy-installer.*
  reinstall:
    if: contains(github.event.head_commit.message, '[reinstall]')
    needs: installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, ps: powershell }
          - { os: windows-11-arm, ps: pwsh }
          - { os: ubuntu-24.04 }
          - { os: macos-15 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installers
          path: inst
      - env:
          PS: ${{ matrix.ps }}
          COZY_DOWNLOAD_URL: https://github.com/cozy-creator/cozy-creator/releases/download/v0.10.1
        run: |
          install() {
            if [ "$RUNNER_OS" = Windows ]; then $PS -NoProfile -ExecutionPolicy Bypass -File "$1"; else sh "$1"; fi
          }
          cozy=$HOME/.cozy/bin/cozy; [ "$RUNNER_OS" != Windows ] || cozy=$cozy.exe
          ext=sh; [ "$RUNNER_OS" != Windows ] || ext=ps1
          install inst/cozy-installer.$ext
          "$cozy" up
          "$cozy" machine enable
          "$cozy" status
          echo "== the patched installer again, over the running cozy"
          install inst/cozy-installer.$ext; echo "exit $?"
          "$cozy" --version && "$cozy" status
          ls -la "$(dirname "$cozy")"
          echo "== control: v0.10.1's own installer over the running cozy"
          curl -sSfLo old.$ext "$COZY_DOWNLOAD_URL/cozy-installer.$ext"; install old.$ext; echo "exit $?"
  winscript:
    if: contains(github.event.head_commit.message, '[winscript]')
    strategy:
      fail-fast: false
      matrix:
        ref: [master, fix/xs-060-windows-uv-env]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p cozy
      - run: |
          mkdir -p ~/.cozy/bin && cp target/release/cozy.exe ~/.cozy/bin/ && cozy=~/.cozy/bin/cozy.exe
          "$cozy" machine enable
          mkdir work && cd work
          printf '%s\n' '# /// script' '# requires-python = ">=3.12"' '# dependencies = ["cozy-runtime"]' '# [tool.cozy]' '# accelerator = false' '# ///' 'def main() -> str:' '    return "hello from Windows"' > greet.py
          "$cozy" run ./greet.py || true
          "$cozy" run list || true
  distros:
    if: contains(github.event.head_commit.message, '[distros]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: |
          for img in ubuntu:22.04 debian:12 fedora:42 archlinux:latest rockylinux:9 opensuse/tumbleweed amazonlinux:2 alpine:3.20; do
            echo "## $img" >> transcript.md
            docker run --rm "$img" sh -c '
              (command -v apt-get >/dev/null && apt-get update -qq >/dev/null && apt-get install -y -qq curl ca-certificates >/dev/null) ||
              (command -v dnf >/dev/null && dnf install -y -q curl-minimal tar gzip >/dev/null 2>&1 || dnf install -y -q tar gzip >/dev/null 2>&1) ||
              (command -v pacman >/dev/null && pacman -Sy --noconfirm -q curl >/dev/null) ||
              (command -v zypper >/dev/null && zypper -q -n install curl tar gzip >/dev/null) ||
              (command -v yum >/dev/null && yum install -y -q tar gzip >/dev/null) ||
              (command -v apk >/dev/null && apk add -q curl)
              curl -LsSf https://tensorhub.com/install.sh | sh; echo "install exit $?"
              ~/.cozy/bin/cozy --version; ~/.cozy/bin/cozy package search sdxl; echo "search exit $?"
              ~/.cozy/bin/cozy machine enable; echo "enable exit $?"
            ' >> transcript.md 2>&1 < /dev/null
          done
          cat transcript.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transcript-distros
          path: transcript.md
