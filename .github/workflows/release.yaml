name: release

# A pushed `v*` tag publishes the cozy binaries, SHA256SUMS and install.sh as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: scripts/release.sh "$GITHUB_REF_NAME"
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "dist/$GITHUB_REF_NAME"/* install.sh
        env:
          GH_TOKEN: ${{ github.token }}
