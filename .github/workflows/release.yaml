name: release

# A release publishes the cozy binaries, SHA256SUMS and install.sh as a GitHub Release, built from
# an existing tag and only when the build reproduces the release owner's gated SHA256SUMS:
#   gh workflow run release.yaml -R cozy-creator/cozy -f tag=vX.Y.Z -f gated_sha256sums="$(cat SHA256SUMS)"
# The gated build uses the same recipe: Go 1.26.0, umask 0002, GOFLAGS=-buildvcs=false, scripts/release.sh.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        type: string
        required: true
      gated_sha256sums:
        description: The gated build's SHA256SUMS ("<sha256>  <archive>" lines)
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          check-latest: false
      - name: Build the release as the gated build was built
        env:
          TAG: ${{ inputs.tag }}
          GOFLAGS: -buildvcs=false
          GOTOOLCHAIN: local
        run: |
          umask 0002
          go version
          scripts/release.sh "$TAG"
      - name: The build reproduces the gated SHA256SUMS, or nothing is published
        env:
          TAG: ${{ inputs.tag }}
          GATED: ${{ inputs.gated_sha256sums }}
        run: |
          printf '%s\n' "$GATED" | awk 'NF' | sort -k2 > gated
          sort -k2 "dist/$TAG/SHA256SUMS" > built
          diff gated built
      - run: gh release create "${{ inputs.tag }}" --verify-tag --generate-notes "dist/${{ inputs.tag }}"/* install.sh
        env:
          GH_TOKEN: ${{ github.token }}
