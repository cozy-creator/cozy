name: ci

# Automatic: one ~1 min job on master pushes that touch Go. It compiles and vets the whole
# module, which targeted local `go test ./pkg` runs do not.
# On demand (fence, types, product suite):
#   gh workflow run ci.yaml -R cozy-creator/cozy --ref <branch> [-f full=true]
# `full`, before a release, adds full-mode tests, the darwin/windows cross-compile and
# release install/upgrade acceptance.
on:
  push:
    branches: [master]
    paths: ['**.go', 'go.mod', 'go.sum', '.github/workflows/ci.yaml']
  workflow_dispatch:
    inputs:
      full:
        description: Also run full-mode tests, cross-compile and release acceptance
        type: boolean
        default: false

# Per event: a master push must not cancel a suite dispatched on master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  UV_TORCH_BACKEND: cpu

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Caches modules and the build cache keyed on go.sum.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...

  suite:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      # setup-uv caches and prunes uv's own directory; this one holds Go only.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-${{ hashFiles('go.sum') }}-
            ci-
      - run: python3 scripts/fence.py
      - run: go build ./... && go vet ./...
      # Before a release only. One target per other GOOS: no file in this module is
      # GOARCH-specific, so linux/arm64 and darwin/amd64 compile the same sources.
      - name: Cross-compile darwin and windows
        if: env.FULL == 'true'
        run: |
          for target in darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
      # The released Runtime at exactly the floor this Cozy enforces (hostruntime.ToolFloor).
      - name: Runtime and Python
        id: toolchain
        run: |
          floor=$(sed -n 's/^const ToolFloor = "\(.*\)"$/\1/p' internal/hostruntime/hostruntime.go)
          read -r url sha < <(curl -fsS "https://pypi.org/pypi/cozy-runtime/$floor/json" |
            jq -r '.urls[] | select(.filename | endswith("py3-none-any.whl")) | "\(.url) \(.digests.sha256)"')
          wheel="$RUNNER_TEMP/${url##*/}"
          curl -fsSLo "$wheel" "$url"
          echo "$sha  $wheel" | sha256sum -c
          uv python install 3.12 3.13 3.14
          uv tool install --python 3.12 --with-executables-from tensorfs "$wheel[media,model-execution]"
          uv tool install --python 3.12 cozy-eval
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "RUNTIME_WHEEL=$wheel" >> "$GITHUB_ENV"
      # The same separately released machine server runs locally and on providers.
      # Development runs can supply a built agent; shipping CI verifies immutable public bytes.
      - name: Machine agent
        run: |
          if [ -n "${COZY_TEST_POD_SUPERVISOR:-}" ]; then
            test -x "$COZY_TEST_POD_SUPERVISOR"
            echo "MACHINE_HOST=$COZY_TEST_POD_SUPERVISOR" >> "$GITHUB_ENV"
          else
            release=machine-v0.1.0
            curl -fsSLo "$RUNNER_TEMP/machine-agent.json" "https://github.com/cozy-creator/cozy/releases/download/$release/machine-agent.json"
            read -r url sha < <(jq -r '.platforms["linux-amd64"] | "\(.url) \(.sha256)"' "$RUNNER_TEMP/machine-agent.json")
            curl -fsSLo "$RUNNER_TEMP/cozy-machine" "$url"
            echo "$sha  $RUNNER_TEMP/cozy-machine" | sha256sum -c
            chmod 755 "$RUNNER_TEMP/cozy-machine"
            echo "MACHINE_HOST=$RUNNER_TEMP/cozy-machine" >> "$GITHUB_ENV"
          fi
      # The runner's service cgroup is not delegated; Runtime's executor containment needs its own subtree.
      - name: Product tests
        run: |
          args=(-j 3 -machine-host="$MACHINE_HOST" -require-machine-host
            -script-runtime-wheel="$RUNTIME_WHEEL" -child-runtime-wheel="$RUNTIME_WHEEL")
          [ "$FULL" = true ] || args+=(-test.short)
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CGO_ENABLED=0 --setenv=UV_TORCH_BACKEND=cpu \
            scripts/product-tests.sh "${args[@]}"
      - name: Release artifacts install and upgrade
        if: env.FULL == 'true'
        run: |
          scripts/release.sh "ci-$GITHUB_SHA" linux/amd64
          scripts/release.sh "ci-$GITHUB_SHA-next" linux/amd64
          scripts/accept.sh --dist "dist/ci-$GITHUB_SHA" --upgrade "dist/ci-$GITHUB_SHA-next" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
      # Independent of the Go result, so one red check does not hide the other.
      - name: Python types
        if: ${{ !cancelled() }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/types"
          uv pip install --python "$RUNNER_TEMP/types/bin/python" packaging 'cozy-runtime>=0.18.28' 'cozy-eval>=0.7.2' 'tensorfs>=0.3.54'
          COZY_TYPECHECK_PYTHON="$RUNNER_TEMP/types/bin/python" sh scripts/typecheck.sh
      # Saved from every master run that compiled, pass or fail.
      - if: ${{ !cancelled() && github.ref == 'refs/heads/master' && steps.toolchain.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
