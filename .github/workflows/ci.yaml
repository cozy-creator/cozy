name: ci

# Automatic: one ~1 min job on master pushes that touch Go. It compiles and vets the whole
# module, which targeted local `go test ./pkg` runs do not.
# On demand (fence, types, product suite):
#   gh workflow run ci.yaml -R cozy-creator/cozy --ref <branch> [-f full=true] [-f runtime_version=0.18.96]
# `full`, before a release, adds full-mode tests, the darwin/windows cross-compile and
# release install/upgrade acceptance.
on:
  push:
    branches: [master]
    paths: ['**.go', 'go.mod', 'go.sum', '.github/workflows/ci.yaml']
  workflow_dispatch:
    inputs:
      full:
        description: Also run full-mode tests, cross-compile and release acceptance
        type: boolean
        default: false
      runtime_version:
        description: Published Runtime release to qualify; empty selects latest
        type: string
        default: ''

# Per event: a master push must not cancel a suite dispatched on master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CGO_ENABLED: '0'
  UV_TORCH_BACKEND: cpu

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Caches modules and the build cache keyed on go.sum.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./...

  toolchain:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - name: Resolve shared public toolchain
        run: scripts/ci-toolchain.sh
      - uses: actions/upload-artifact@v4
        with:
          name: cozy-ci-toolchain
          path: ${{ runner.temp }}/cozy-ci-toolchain.json
          retention-days: 7

  suite:
    if: github.event_name == 'workflow_dispatch'
    needs: toolchain
    name: suite (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FULL: ${{ inputs.full }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      # setup-uv caches and prunes uv's own directory; this one holds Go only.
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-${{ hashFiles('go.sum') }}-
            ci-
      - if: matrix.shard == 0
        run: python3 scripts/fence.py
      - if: matrix.shard == 0
        run: go build ./... && go vet ./...
      # Before a release only. One target per other GOOS: no file in this module is
      # GOARCH-specific, so linux/arm64 and darwin/amd64 compile the same sources.
      - name: Cross-compile darwin and windows
        if: env.FULL == 'true' && matrix.shard == 0
        run: |
          for target in darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
      # One published native Runtime supplies both the SDK and machine agent.
      # Qualification intentionally fails until the released pair supports our contracts.
      - uses: actions/download-artifact@v4
        with:
          name: cozy-ci-toolchain
          path: ${{ runner.temp }}/toolchain
      - name: Runtime and Python
        id: toolchain
        run: |
          manifest="$RUNNER_TEMP/toolchain/cozy-ci-toolchain.json"
          for package in runtime tensorfs; do
            read -r url sha < <(jq -er --arg package "$package" '.[$package] | "\(.url) \(.sha256)"' "$manifest")
            test -n "$url" && test -n "$sha"
            wheel="$RUNNER_TEMP/${url##*/}"
            curl -fsSLo "$wheel" "$url"
            echo "$sha  $wheel" | sha256sum -c
            if [ "$package" = runtime ]; then runtime_wheel="$wheel"; else tensorfs_wheel="$wheel"; fi
          done
          eval_version=$(jq -er .eval_version "$manifest")
          uv python install 3.12 3.13 3.14
          uv tool install --python 3.12 --with "$tensorfs_wheel" --with-executables-from tensorfs "$runtime_wheel[media,model-execution]"
          uv tool install --python 3.12 "cozy-eval==$eval_version"
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "RUNTIME_WHEEL=$runtime_wheel" >> "$GITHUB_ENV"
          echo "TENSORFS_WHEEL=$tensorfs_wheel" >> "$GITHUB_ENV"
          echo "COZY_EVAL_VERSION=$eval_version" >> "$GITHUB_ENV"
      - name: Bundled machine agent
        run: |
          python3 scripts/ci-machine-agent.py "$RUNTIME_WHEEL" "$RUNNER_TEMP/cozy-machine"
          echo "MACHINE_HOST=$RUNNER_TEMP/cozy-machine" >> "$GITHUB_ENV"
      - name: Media test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      # The runner's service cgroup is not delegated; Runtime's executor containment needs its own subtree.
      - name: Product tests
        run: |
          args=(--shard '${{ matrix.shard }}/3' --log-dir "$RUNNER_TEMP/product-logs"
            --durations "$PWD/scripts/product-test-durations.tsv"
            -machine-host="$MACHINE_HOST" -require-machine-host
            -machine-runtime-wheel="$RUNTIME_WHEEL" -machine-tensorfs-wheel="$TENSORFS_WHEEL"
            -script-runtime-wheel="$RUNTIME_WHEEL" -child-runtime-wheel="$RUNTIME_WHEEL"
            -child-tensorfs-wheel="$TENSORFS_WHEEL" -tensorfs-fixture-wheel="$TENSORFS_WHEEL"
            -failure-diagnostics="$RUNNER_TEMP/product-diagnostics")
          [ "$FULL" = true ] || args+=(-test.short)
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.shard }}" \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CGO_ENABLED=0 --setenv=UV_TORCH_BACKEND=cpu \
          scripts/product-tests.sh "${args[@]}"
      - name: Preserve complete product logs and coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/product-logs
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve filtered product failure snapshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-failure-snapshots-${{ matrix.shard }}
          path: ${{ runner.temp }}/product-diagnostics/**/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Release artifacts install and upgrade
        if: env.FULL == 'true' && matrix.shard == 0
        run: |
          scripts/release.sh "ci-$GITHUB_SHA" linux/amd64
          scripts/release.sh "ci-$GITHUB_SHA-next" linux/amd64
          scripts/accept.sh --dist "dist/ci-$GITHUB_SHA" --upgrade "dist/ci-$GITHUB_SHA-next" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
      # Independent of the Go result, so one red check does not hide the other.
      - name: Python types
        if: ${{ !cancelled() && matrix.shard == 0 }}
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/types"
          uv pip install --python "$RUNNER_TEMP/types/bin/python" packaging "$RUNTIME_WHEEL" "cozy-eval==$COZY_EVAL_VERSION" "$TENSORFS_WHEEL"
          COZY_TYPECHECK_PYTHON="$RUNNER_TEMP/types/bin/python" sh scripts/typecheck.sh
          MYPYPATH="$PWD/scripts" sh scripts/typecheck.sh --strict scripts/ci-product-coverage.py scripts/ci_product_partitions.py
      # Saved from every master run that compiled, pass or fail.
      - if: ${{ !cancelled() && matrix.shard == 0 && github.ref == 'refs/heads/master' && steps.toolchain.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}

  coverage:
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: product-logs-*
          path: ${{ runner.temp }}/product-coverage
      - name: Audit complete product coverage
        run: python3 scripts/ci-product-coverage.py "$RUNNER_TEMP/product-coverage" '${{ inputs.full }}'
