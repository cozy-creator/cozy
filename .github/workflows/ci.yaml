name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # CGO_ENABLED=0 is the LAW, not a default: `internal/records` drives SQLite through
      # modernc.org/sqlite and nothing in this binary is C. Building with it off here is
      # what keeps a C dependency from arriving unnoticed and silently ending the
      # cross-compiles cl-013's `release` job depends on.
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: python3 scripts/fence.py

  # cl-013's SHIPPED GUARD. A green `checks` is a fact about the source tree; this job is a
  # fact about the artifact a user would install. They are separate evidence axes and a
  # master-only green may not stand in for this one.
  #
  # The weightless ENDPOINT leg is deliberately absent here: it needs the cozy-runtime peer
  # to build its release, which this runner does not have. `scripts/clean-machine.sh` runs
  # the same fixture with `--endpoint` on a machine that does.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/release.sh --tag ci-$GITHUB_SHA
      - run: scripts/release.sh --tag ci-$GITHUB_SHA-next
      - run: |
          scripts/accept.sh \
            --dist "dist/ci-$GITHUB_SHA" \
            --asset "cozy-ci-$GITHUB_SHA-linux-amd64.tar.gz" \
            --upgrade "dist/ci-$GITHUB_SHA-next/cozy-ci-$GITHUB_SHA-next-linux-amd64.tar.gz" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
