name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Until Runtime 0.30.0 (tensorfs 0.12) is on PyPI, the newest published Runtime cannot pair with
      # this TensorFS: tests build the Runtime of the xs-045 tree.
      runtime_ref: 4a63e5b1fba951ebe287621ce9674f014a19ff0c
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below. Known master
      # failures are skipped by name until their fix lands, then the skip goes:
      #   one_store_runs_one_machine: xs-045 U9a, the v2 store's owner lock (BLOCKER line)
      #   cancellation_wins_while_the_real_run_acceptance_waits_on_store_custody: xs-047
      #   a_restart_neither_shortens_nor_extends_the_idle_clock: xs-047
      test: >-
        cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer --exclude tensord &&
        cargo test --locked --no-fail-fast -p tensord --
        --skip one_store_runs_one_machine
        --skip cancellation_wins_while_the_real_run_acceptance_waits_on_store_custody
        --skip a_restart_neither_shortens_nor_extends_the_idle_clock

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
