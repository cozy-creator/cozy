name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # CGO_ENABLED=0 is the LAW, not a default: `internal/records` drives SQLite through
      # modernc.org/sqlite and nothing in this binary is C. Building with it off here is
      # what keeps a C dependency from arriving unnoticed and silently ending the
      # cross-compiles cl-013's `release` job depends on.
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      - run: python3 scripts/fence.py

  # THE VENDORED-BINDING FENCE (#530-A1/#536d). `protocol/` is COPIED, never imported, so
  # nothing in a Go build can notice that the copy is revisions behind the contract — and
  # `wire_minor` could not notice either, because the minor is the ADDITIVE train and does
  # not move for a breaking in-place revision. `wire_schema_digest` catches a stale peer at
  # the HANDSHAKE, which is a run-time discovery by an operator on a live stream. This
  # catches the same fact at BUILD time: worker-protocol regenerates from its own .proto
  # with its own pinned protoc and byte-compares against what is vendored here.
  #
  # It tracks worker-protocol's master deliberately. A pinned ref would only ever prove
  # that nobody edited this directory by hand; the fact worth knowing is that the contract
  # moved and this consumer has not flipped. That red IS the flip obligation arriving.
  vendored-protocol:
    runs-on: ubuntu-latest
    env:
      WORKER_PROTOCOL_TOKEN: ${{ secrets.WORKER_PROTOCOL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cozy-creator
      # This arm is self-contained and always executes. It proves that the copied bytes are the
      # exact reviewed worker-protocol@df05c8d set recorded in protocol/SHA256SUMS. Runtime's
      # wire_schema_digest remains the safety fence if the private peer later advances.
      - name: Verify reviewed vendored bytes
        working-directory: cozy-creator
        run: sha256sum --check protocol/SHA256SUMS
      # GITHUB_TOKEN is repository-scoped and cannot read a private sibling. When an explicit
      # read token exists, additionally compare against worker-protocol master so drift arrives
      # at build time. Its absence is reported, never disguised as a failed code check.
      - name: Check out current worker protocol
        if: env.WORKER_PROTOCOL_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/worker-protocol-v2
          path: worker-protocol
          token: ${{ env.WORKER_PROTOCOL_TOKEN }}
      - uses: actions/setup-go@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
      - name: Compare against current peer
        if: env.WORKER_PROTOCOL_TOKEN != ''
        run: worker-protocol/scripts/vendored-diff.sh cozy-creator/protocol/cozy/worker/v1
      - name: Report unarmed peer drift check
        if: env.WORKER_PROTOCOL_TOKEN == ''
        run: echo '::warning::WORKER_PROTOCOL_TOKEN is absent; exact reviewed bytes passed, but current private-peer drift was not queried'

  # cl-013's SHIPPED GUARD. A green `checks` is a fact about the source tree; this job is a
  # fact about the artifact a user would install. They are separate evidence axes and a
  # master-only green may not stand in for this one.
  #
  # The weightless ENDPOINT leg is deliberately absent here: it needs the cozy-runtime peer
  # to build its release, which this runner does not have. `scripts/clean-machine.sh` runs
  # the same fixture with `--endpoint` on a machine that does.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/release.sh --tag ci-$GITHUB_SHA
      - run: scripts/release.sh --tag ci-$GITHUB_SHA-next
      - run: |
          scripts/accept.sh \
            --dist "dist/ci-$GITHUB_SHA" \
            --asset "cozy-ci-$GITHUB_SHA-linux-amd64.tar.gz" \
            --upgrade "dist/ci-$GITHUB_SHA-next/cozy-ci-$GITHUB_SHA-next-linux-amd64.tar.gz" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
