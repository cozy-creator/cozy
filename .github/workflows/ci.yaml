name: ci
# Automatic: one ~1 min job on master pushes that touch Rust: `cargo check` of every crate
# and target (tests included), which targeted local `cargo test -p` runs do not compile.
# On demand, before a release (full suite, fences, version guards, wheel e2e):
#   gh workflow run ci.yaml -R cozy-creator/tensorfs --ref <branch> [-f scope=cache-owner]
on:
  push:
    branches: [master]
    paths: ["crates/**", "Cargo.toml", "Cargo.lock", ".github/workflows/ci.yaml"]
  workflow_dispatch:
    inputs:
      scope:
        description: Qualification scope
        type: choice
        options: [full, cache-owner]
        default: full
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  cache-owner:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'cache-owner'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tensorfs-core --lib --tests -- -D warnings -A clippy::style
      - run: cargo test -p tensorfs-core --lib cache_identity_restores_and_does_not_change_other_threads --no-run
      - name: Root cache identity, thread isolation, and unwind restoration
        run: |
          set -eu
          found=false
          for proof in target/debug/deps/tensorfs_core-*; do
            if [ -f "$proof" ] && [ -x "$proof" ]; then
              found=true
              sudo "$proof" --exact repo_cache::identity::linux::tests::cache_identity_restores_and_does_not_change_other_threads --nocapture
            fi
          done
          [ "$found" = true ]
  ci:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'cache-owner'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/released_version.py

      # Pinned: `-D warnings` against a floating stable fails CI with no code change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy
      - uses: astral-sh/setup-uv@v7
        with:
          save-cache: ${{ github.ref == 'refs/heads/master' }}
      # target/ is the host build; target/manylinux is the wheel's container build.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            . -> target/manylinux
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: |
          set -eux
          cargo build --workspace
          for s in h3 h3-pdd sdxl civitai-sdxl instruments; do
            python3 "scripts/rebank-$s.py" --tfs target/debug/tfs
          done
      - run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::style
      - run: cargo test --workspace
      - name: Privileged-broker and unprivileged Store-owner writers
        run: |
          for proof in target/debug/deps/store_boundaries-*; do
            if [ -f "$proof" ] && [ -x "$proof" ]; then
              sudo "$proof" --exact privileged_writer_preserves_the_store_owners_public_directories --nocapture
            fi
          done
      - name: Transfers inside a 64 MiB memory budget
        run: |
          for proof in target/debug/deps/transfer_memory-*; do
            if [ -f "$proof" ] && [ -x "$proof" ]; then
              sudo systemd-run --scope -p MemoryMax=64M -p MemorySwapMax=0 --quiet "$proof" --exact an_object_larger_than_the_memory_budget_uploads_and_downloads --nocapture
            fi
          done
      - run: |
          set -eux
          python3 scripts/fence.py
          uv run --no-project --python 3.12 --with mypy mypy --strict --python-version 3.12 python/tensorfs
          python3 scripts/version_contract.py source

      - run: cargo build --release --bin tfs
      # SHA-256 instructions may only live in the runtime-dispatched routine (tfs-068);
      # anywhere else they SIGILL on a host without them. `ring` carries its own dispatch.
      - name: SHA extensions only behind runtime dispatch
        run: |
          set -e
          out=$(objdump -d --no-show-raw-insn target/release/tfs \
            | awk '/^[0-9a-f]+ <.*>:$/ { s=$2 }
                   /sha256rnds2|sha256msg1|sha256msg2/ { print s }' | sort -u)
          [ -n "$out" ] || { echo "no sha extension instructions: the routine was dropped"; exit 1; }
          bad=$(echo "$out" | grep -v 'sha2563x868compress' | grep -v 'ring_core' || true)
          [ -z "$bad" ] || { echo "sha instructions outside the dispatch:"; echo "$bad"; exit 1; }
          grep -qo sha_ni /proc/cpuinfo \
            && echo "runner HAS the sha extensions: both routines were exercised" \
            || echo "runner LACKS the sha extensions: only the scalar fallback was exercised"
      - name: Vectors, capability arms, decoder and CBOR conformance
        run: |
          set -eux
          tfs=target/release/tfs
          "$tfs" vectors verify
          m=vectors/cases/machine
          diff <(cat "$m/capability-admitted.json"; echo) <("$tfs" capability --alias plain/1 x cpu --json)
          diff <(cat "$m/capability-unqualified.json"; echo) <("$tfs" capability --alias plain/1 x cuda.sm89 --json)
          "$tfs" capability --alias plain/1 x cpu
          if "$tfs" capability --alias plain/1 x cuda; then
            echo "an unqualified device was admitted" >&2
            exit 1
          fi
          "$tfs" conform
          uv run --python 3.12 --project conformance/cbor/python python scripts/cbor-conformance.py --tfs "$tfs" conform
          uv run --python 3.12 --project conformance/cbor/python python scripts/migration-smoke.py "$tfs"

      # The CLI rides the wheel (tfs-051), built in the manylinux container so its glibc
      # floor matches the extension beside it.
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --target-dir target/manylinux --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked --target-dir target/manylinux -p tensorfs-core --bin tfs
            install -D -m 755 target/manylinux/release/tfs wheel-data/scripts/tfs
      - name: Wheel end-to-end over a real store
        run: |
          set -eux
          for wheel in dist/*.whl; do python3 scripts/version_contract.py wheel "$wheel"; done
          bash scripts/wheel-smoke.sh "${RUNNER_TEMP}/smoke" python3.12 --skip-build --wheels "$PWD/dist"
          sudo "${RUNNER_TEMP}/smoke/venv/bin/python" scripts/scoped-derived.py --isolation
          sudo "${RUNNER_TEMP}/smoke/venv/bin/python" scripts/scoped-model-reader.py --isolation
      - name: Optional PyTorch interface over the built wheel
        env:
          CUDA_VISIBLE_DEVICES: ""
          UV_TORCH_BACKEND: cpu
        run: |
          uv venv "${RUNNER_TEMP}/tensor-interface" --python 3.12
          for wheel in dist/*.whl; do
            uv pip install --python "${RUNNER_TEMP}/tensor-interface/bin/python" "$wheel[torch]" "torch==2.13.0"
          done
          "${RUNNER_TEMP}/tensor-interface/bin/python" scripts/torch-interface.py
      # A newer-host CLI swapped into the portable wheel must falsify its platform tag.
      - run: |
          for wheel in dist/*.whl; do
            uv run --script scripts/wheel-platform.py "$wheel" --prove target/release/tfs
          done
      # The container build leaves root-owned files the cache post-step must read and prune.
      - if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target
