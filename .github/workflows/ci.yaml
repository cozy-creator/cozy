name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # Reusable dev builds may download artifacts from another run.
  actions: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Build the matching ordinary TensorFS 0.13 / Runtime 0.30 candidate until publication.
      runtime_ref: 2d46efbc785c4579a02289e4d4b303cba551acda
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below.
      test: |
        cargo test --locked --no-fail-fast -p tensord
        uv pip install --python "$TENSORFS_TEST_PYTHON" "$COZY_TEST_RUNTIME_WHEEL" pytest torch
        "$TENSORFS_TEST_PYTHON" -m pytest -q .runtime/tests/test_weight_source_loading.py .runtime/tests/test_retention_quiescence.py

  # The library suites do not install or launch a Runtime, so they need no release wheel.
  # Run them beside the process-heavy daemon suite, preserving every previous target.
  libraries:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: none
      test: cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer --exclude tensord

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # Use the compatible Hub routes and the expand-only migration during this cohort rollout.
      tensorhub_ref: e1b09ab11c2e6af5e15fb752f6bd5ebd6fb1379e
      # Use this Runtime and TensorFS pair until both releases are published.
      runtime_ref: 2d46efbc785c4579a02289e4d4b303cba551acda
