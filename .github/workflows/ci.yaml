name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # Reusable dev builds may download artifacts from another run.
  actions: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # The Runtime integrator's TensorFS 0.13 branch (cozy-runtime #1646): Runtime 0.30 on the
      # hard cut. Source pins distinguish development wheels of one version.
      runtime_ref: 11fb01f72d4819d455fd74ca80e524c2c47abfcb
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below. varena's
      # placement under a declared plan runs first, on the wheel with CPU torch.
      test: >-
        uv pip install --python "$TENSORFS_TEST_PYTHON" torch &&
        "$TENSORFS_TEST_PYTHON" crates/tensorfs-py/scripts/varena-plan.py &&
        cargo test --locked --no-fail-fast -p tensord

  # The library suites do not install or launch a Runtime, so they need no release wheel.
  # Run them beside the process-heavy daemon suite, preserving every previous target.
  libraries:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: none
      test: cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer --exclude tensord

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # The 0.13 Hub fixture (tree refs) and the Runtime above, until this interface is released.
      tensorhub_ref: a67f65eb0aee2e1d022dbaa8eba6ae4bd17d8662
      runtime_ref: 11fb01f72d4819d455fd74ca80e524c2c47abfcb
