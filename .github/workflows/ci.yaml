name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # Reusable dev builds may download artifacts from another run.
  actions: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Build the matching ordinary TensorFS 0.13 / Runtime 0.30 candidate until publication.
      runtime_ref: 7ca70fef2863764b282d7884af9753e04e210711
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below.
      test: |
        python3 scripts/cargo-test-binaries.py --self-test && python3 scripts/cargo-test-binaries.py
        uv pip install --torch-backend cpu --python "$TENSORFS_TEST_PYTHON" "$COZY_TEST_RUNTIME_WHEEL" pytest torch
        "$TENSORFS_TEST_PYTHON" crates/tensorfs-py/scripts/ffn_scope_lifetime.py
        uv pip install --python "$TENSORFS_TEST_PYTHON" --no-deps diffusers==0.41.0
        "$TENSORFS_TEST_PYTHON" crates/tensorfs-py/scripts/rmsnorm_bands.py
        "$TENSORFS_TEST_PYTHON" crates/tensorfs-py/scripts/request_failure_boundary.py
        "$TENSORFS_TEST_PYTHON" -m pytest -q .runtime/tests/test_weight_source_loading.py .runtime/tests/test_retention_quiescence.py

  # The library suites do not install or launch a Runtime, so they need no release wheel.
  # Run them beside the process-heavy daemon suite, preserving every previous target.
  libraries:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: none
      test: |
        failed=0
        cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer --exclude tensord --exclude varena || failed=1
        # Unrelated concurrent forks briefly inherit CLOEXEC reader leases before
        # exec. Isolate cases; each ledger case still runs its real child processes.
        cargo test -p varena --locked --no-fail-fast -- --test-threads=1 || failed=1
        exit "$failed"

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # Use the compatible Hub routes and the expand-only migration during this cohort rollout.
      tensorhub_ref: e1b09ab11c2e6af5e15fb752f6bd5ebd6fb1379e
      # Use this Runtime and TensorFS pair until both releases are published.
      runtime_ref: 7ca70fef2863764b282d7884af9753e04e210711
