name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Until Runtime 0.30.0 (tensorfs 0.12) is on PyPI, the newest published Runtime cannot pair with
      # this TensorFS: tests build the Runtime of the xs-045 tree.
      runtime_ref: 4a63e5b1fba951ebe287621ce9674f014a19ff0c
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below.
      test: cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # cozy master is TensorFS v2: its gate runs against the v2 Hub, tensorhub #1202's head. This line
      # goes when #1202 lands on tensorhub master.
      tensorhub_ref: b8e24df5a8e309708c1bf550fe1c4cd3fe9d5b06
      # The tests' Runtime and TensorFS pair; this line goes when Runtime 0.30.0 and tensorfs 0.12 are on PyPI.
      runtime_ref: 4a63e5b1fba951ebe287621ce9674f014a19ff0c
