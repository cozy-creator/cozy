name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths: ['**', '!**.md', 'README.md', 'docs/exit-matrix.md', 'docs/client-contract.md', 'docs/package-publication.md']
  push:
    branches: [master]
    paths: ['**', '!**.md', 'README.md', 'docs/exit-matrix.md', 'docs/client-contract.md', 'docs/package-publication.md']
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'schedule' }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CGO_ENABLED: '0'
  UV_TORCH_BACKEND: cpu
  # Pull requests and master pushes skip integration(t) tests and release acceptance;
  # nightly, dispatch and PRs labelled `integration` run everything.
  FULL: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'integration') }}

jobs:
  python-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install typed Python helper contracts
        run: |
          uv venv --python 3.12
          uv pip install --python .venv/bin/python packaging 'cozy-runtime>=0.18.28' 'cozy-eval>=0.7.2' 'tensorfs>=0.3.54'
      - run: sh scripts/typecheck.sh

  nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.last.outputs.new }}
    steps:
      - id: last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w ci -e schedule -s success -L 1 --json headSha -q '.[0].headSha')
          echo "new=$([ "$last" != "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  ci:
    needs: nightly
    if: >-
      !cancelled() && (needs.nightly.result == 'skipped' || needs.nightly.outputs.new == 'true') &&
      (github.event.action != 'labeled' || github.event.label.name == 'integration')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.11'
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/uv
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
          restore-keys: |
            ci-${{ hashFiles('go.sum') }}-
            ci-
      - run: python3 scripts/fence.py
      - run: go build ./... && go vet ./...
      - name: Cross-compile the shipped targets
        run: |
          for target in darwin/arm64 darwin/amd64 windows/amd64 linux/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null .
          done
      # The released Runtime at exactly the floor this Cozy enforces (hostruntime.ToolFloor).
      - name: Runtime and Python
        run: |
          floor=$(sed -n 's/^const ToolFloor = "\(.*\)"$/\1/p' internal/hostruntime/hostruntime.go)
          read -r url sha < <(curl -fsS "https://pypi.org/pypi/cozy-runtime/$floor/json" |
            jq -r '.urls[] | select(.filename | endswith("py3-none-any.whl")) | "\(.url) \(.digests.sha256)"')
          wheel="$RUNNER_TEMP/${url##*/}"
          curl -fsSLo "$wheel" "$url"
          echo "$sha  $wheel" | sha256sum -c
          uv python install 3.12 3.13 3.14
          uv tool install --python 3.12 "$wheel[model-execution]"
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "RUNTIME_WHEEL=$wheel" >> "$GITHUB_ENV"
      # The runner's service cgroup is not delegated; Runtime's executor containment needs its own subtree.
      - name: Product tests
        run: |
          args=(-j 3 -serving-cpu-fixture
            -script-runtime-wheel="$RUNTIME_WHEEL" -child-runtime-wheel="$RUNTIME_WHEEL")
          [ "$FULL" = true ] || args+=(-test.short)
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CGO_ENABLED=0 --setenv=UV_TORCH_BACKEND=cpu \
            scripts/product-tests.sh "${args[@]}"
      - name: Release artifacts install and upgrade
        if: env.FULL == 'true'
        run: |
          scripts/release.sh --tag "ci-$GITHUB_SHA"
          scripts/release.sh --tag "ci-$GITHUB_SHA-next"
          scripts/accept.sh --dist "dist/ci-$GITHUB_SHA" --asset "cozy-ci-$GITHUB_SHA-linux-amd64.tar.gz" \
            --upgrade "dist/ci-$GITHUB_SHA-next/cozy-ci-$GITHUB_SHA-next-linux-amd64.tar.gz" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
      - if: github.ref == 'refs/heads/master'
        run: uv cache prune --ci
      - if: github.ref == 'refs/heads/master'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            ~/.cache/uv
          key: ci-${{ hashFiles('go.sum') }}-${{ github.sha }}
