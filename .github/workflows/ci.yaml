name: ci
# Build + static analysis + fences only (tracker README #160: no test steps anywhere in
# v2; static analysis IS required, owner directive 2026-08-25). The live verification
# scripts — vectors, red arms, benchmarks — are run by builders against real stores.
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED on purpose: `-D warnings` against a floating stable makes a Rust
      # release a CI failure with no code change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --workspace
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 scripts/fence.py

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project --python 3.12 python scripts/version_contract.py source
      - name: Refuse other CPython lines
        run: |
          for version in 3.11 3.13; do
            if uv run --no-project --python "$version" python scripts/version_contract.py source >"python-${version}.log" 2>&1; then
              cat "python-${version}.log"
              exit 1
            fi
            grep -F "TensorFS tooling requires CPython 3.12" "python-${version}.log"
          done
      # --strict over the py.typed surface AND the drivers that consume it. No per-module
      # suppressions: a facade that needs one is a facade whose types are wrong.
      - run: >-
          uvx --python 3.12 --from 'mypy==1.*' mypy --strict
          python/tensorfs scripts/version_contract.py
          scripts/facade-conform.py scripts/facade-runs.py

  # The wheel matrix exists so it cannot rot: every platform we publish for is BUILT here,
  # and the native one is installed and made to read a real named tensor out of the
  # committed store (scripts/wheel-smoke.sh) on the one supported CPython line.
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, native: true }
          - { os: ubuntu-latest, target: aarch64, native: false }
          - { os: macos-latest, target: aarch64, native: true }
          - { os: macos-latest, target: x86_64, native: false }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - run: |
          for wheel in dist/*.whl; do
            python3 scripts/version_contract.py wheel "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist
      # A real read on normal CPython 3.12. Cross-built wheels are
      # built and archived; they cannot be executed on this runner and say so.
      - if: matrix.native
        run: |
          bash scripts/wheel-smoke.sh "${RUNNER_TEMP}/smoke-3.12" python3.12 \
            --skip-build --wheels "$PWD/dist"
      - if: ${{ !matrix.native }}
        run: echo "cross-built for ${{ matrix.target }} — archived, not executed here"
