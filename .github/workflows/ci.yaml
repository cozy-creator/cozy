name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  actions: read
  contents: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Build the Runtime that consumes this ordinary TensorFS API. Source pins distinguish
      # compatible development wheels even when their package versions are the same.
      runtime_ref: d9a1495cc3f374344f5a1adc631a5c3da3a8537e
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below.
      test: |
        cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer
        uv pip install --python "$TENSORFS_TEST_PYTHON" "$COZY_TEST_RUNTIME_WHEEL" pytest torch
        "$TENSORFS_TEST_PYTHON" -m pytest -q .runtime/tests/test_weight_source_loading.py .runtime/tests/test_retention_quiescence.py

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # Freeze the ordinary Hub fixture and matching Runtime source independently of
      # the release cohort until this interface is released.
      tensorhub_ref: a67f65eb0aee2e1d022dbaa8eba6ae4bd17d8662
      runtime_ref: d9a1495cc3f374344f5a1adc631a5c3da3a8537e
