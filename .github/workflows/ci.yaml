name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml), TensorD's and TensorFS's on Windows; on master pushes also the owner's day
# against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  # Reusable dev builds may download artifacts from another run.
  actions: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Runtime 0.30 on the hard cut (cozy-runtime #1646) with its Windows seams
      # (xs061/w2-runtime-seams). Source pins distinguish development wheels of one version.
      runtime_ref: &runtime c5b6ef59e844f32821b0f63018f241c25ea48850
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below. varena's
      # placement under a declared plan runs first, on the wheel with CPU torch.
      test: >-
        uv pip install --python "$TENSORFS_TEST_PYTHON" torch &&
        "$TENSORFS_TEST_PYTHON" crates/tensorfs-py/scripts/varena-plan.py &&
        python3 scripts/cargo-test-binaries.py --self-test &&
        python3 scripts/cargo-test-binaries.py

  # The library suites do not install or launch a Runtime, so they need no release wheel.
  # Run them beside the process-heavy daemon suite, preserving every previous target.
  libraries:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: none
      test: cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer --exclude tensord

  # platform's, TensorD's and TensorFS's suites on Windows (xs-061), with the Runtime above and this ref's TensorFS.
  windows:
    runs-on: windows-2025
    # Hang bound, not a work budget.
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-runtime
          ref: *runtime
          ssh-key: ${{ secrets.COZY_RUNTIME_READ_KEY }}
          path: .runtime
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - name: The Runtime and TensorFS wheels machines install
        run: |
          uv run --no-project python .runtime/scripts/stamp-build-provenance.py "$(git -C .runtime rev-parse HEAD)"
          uv build --wheel --out-dir "$RUNNER_TEMP/runtime" .runtime
          cargo build --release --locked -p tensorfs --bin tfs
          mkdir -p crates/tensorfs-py/wheel-data/scripts && cp target/release/tfs.exe crates/tensorfs-py/wheel-data/scripts/
          (cd crates/tensorfs-py && uvx maturin@1.15.0 build --release --out "$RUNNER_TEMP/tensorfs")
          echo "COZY_TEST_RUNTIME_WHEEL=$(ls "$RUNNER_TEMP"/runtime/cozy_runtime-*.whl)" >> "$GITHUB_ENV"
          echo "COZY_TEST_TENSORFS_WHEEL=$(ls "$RUNNER_TEMP"/tensorfs/tensorfs-*.whl)" >> "$GITHUB_ENV"
      - run: cargo test -p platform -p tensord -p tensorfs --locked --no-fail-fast

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # Hub v0.33.0 (tags and the class record) and the Runtime above, until they are released.
      tensorhub_ref: d061bd66c5a87a1c704a8be3094a14c2cf6101c2
      runtime_ref: *runtime
