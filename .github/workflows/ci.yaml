name: ci
# Everything in this file RUNS. It used to be build + ten grep-based fences and zero
# tests, with the real verification — the Rust suite, the frozen vector corpus, the CBOR
# format gate, the wheel smoke — left to whoever remembered to type it.
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED on purpose: `-D warnings` against a floating stable makes a Rust
      # release a CI failure with no code change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --workspace
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/fence.py
      - run: python3 scripts/version_contract.py source
      - run: cargo build --release --bin tfs
      # The frozen vectors and their .verdict files: every canonical document kind,
      # its exact object id, its typed refusal code, and one-byte mutants of each. The
      # grading plane's documents are IN here (conversion_registration, grade_decision,
      # all four grades and a fifth-grade red arm), so the closed four-level ladder and
      # the registration's canonical form are frozen like everything else.
      #
      # A compat_report's frozen verdict carries the GRADE it earns, not only its bytes, so
      # tfs-037's red arm runs here: one contract and one checkpoint produce two reports,
      # PRODUCIBLE when the walk stops at the first fact and INCOMPATIBLE when it walks the
      # whole set. A ranking path that regressed to reading the first fact would still emit
      # byte-identical documents and only these verdicts would notice.
      - run: ./target/release/tfs vectors verify
      # proto-020: the SHIPPED BINARY's `--json` path, not only the library emitter the
      # corpus calls. `tfs vectors verify` proves the emitter still produces the frozen
      # machine documents; this proves the CLI still routes to that emitter, over the same
      # frozen inputs. These three documents are a producer/consumer contract with
      # tensorhub, which vendors them and asserts its decoder against them; adding a key to
      # any of them fails HERE, before it can break the consumer at runtime.
      - run: |
          set -e
          m=vectors/cases/machine
          diff <(cat "$m/check-satisfied.json"; echo) <(./target/release/tfs compat check \
            vectors/cases/layout/tensor-requirements.json vectors/cases/header/plain-fp8.cbor \
            --depth full --json)
          diff <(cat "$m/grade-compatible.json"; echo) <(./target/release/tfs grade \
            vectors/cases/layout/report-satisfied.json --json)
          diff <(cat "$m/grade-producible.json"; echo) <(./target/release/tfs grade \
            vectors/cases/layout/report-worst-first-fact.json --json)
          diff <(cat "$m/grade-incompatible.json"; echo) <(./target/release/tfs grade \
            vectors/cases/layout/report-worst-full.json --json)
          diff <(cat "$m/grade-convertible.json"; echo) <(./target/release/tfs grade \
            vectors/cases/layout/report-widen.json \
            --registry vectors/cases/layout/conversion-registration.json --json)
          diff <(cat "$m/capability-admitted.json"; echo) <(./target/release/tfs capability \
            --alias plain/1 x cpu --json)
          diff <(cat "$m/capability-unqualified.json"; echo) <(./target/release/tfs capability \
            --alias plain/1 x cuda.sm89 --json)
      # tfs-042: the ONE fit function, in the shipped binary, over the frozen pair. The ok arm
      # exits 0 and prints the frozen machine document; the planted shape edit is the frozen
      # `fit-shape-mismatch` document and MUST exit with the shape_mismatch code (12).
      - run: |
          set -e
          m=vectors/cases/machine
          diff <(cat "$m/fit-ok.json"; echo) <(./target/release/tfs fit \
            vectors/cases/layout/tensor-requirements.json . vectors/cases/header/plain-fp8.cbor \
            --device cpu --json)
          python3 - <<'PY'
          import json
          d = json.load(open("vectors/cases/layout/tensor-requirements.json"))
          keys = d["components"]["transformer"]
          keys[sorted(keys)[-1]]["shape"] = [7]
          open("planted.json", "w").write(json.dumps(d, sort_keys=True, separators=(",", ":")))
          PY
          set +e
          ./target/release/tfs fit planted.json . vectors/cases/header/plain-fp8.cbor --json > planted.out
          code=$?
          set -e
          diff <(cat "$m/fit-shape-mismatch.json"; echo) planted.out
          test "$code" -eq 12
      # The BATCH grading surface (tfs-039). Grading is microseconds; `tfs grade <file>` is
      # one report per process, so the wall was the ~2.5 ms of spawn around it — irrelevant
      # for a preflight check and the entire cost of a catalog search. Every frozen report
      # goes through in ONE process here, and the first line is required to be BYTE
      # IDENTICAL to what the single-pair `--json` prints for the same document: one machine
      # surface with two ways in, not two surfaces that happen to agree today.
      - run: |
          : > "${RUNNER_TEMP}/reports.jsonl"
          for r in $(ls vectors/cases/layout/report-*.json | sort); do
            cat "$r" >> "${RUNNER_TEMP}/reports.jsonl"
            echo >> "${RUNNER_TEMP}/reports.jsonl"
          done
          ./target/release/tfs grade batch "${RUNNER_TEMP}/reports.jsonl" \
            > "${RUNNER_TEMP}/graded.jsonl"
          first=$(ls vectors/cases/layout/report-*.json | sort | head -1)
          ./target/release/tfs grade "$first" --json > "${RUNNER_TEMP}/single.json"
          head -1 "${RUNNER_TEMP}/graded.jsonl" > "${RUNNER_TEMP}/batched.json"
          diff "${RUNNER_TEMP}/single.json" "${RUNNER_TEMP}/batched.json"
          # A partial answer is not an answer: an undecodable line stops the batch and
          # names it, rather than emitting a fifth verdict in the grade's shape.
          printf '{"contract":"nonsense"}\n' > "${RUNNER_TEMP}/bad.jsonl"
          if ./target/release/tfs grade batch "${RUNNER_TEMP}/bad.jsonl"; then
            echo "a batch graded an undecodable document" >&2
            exit 1
          fi
      # The registration ACT, in the shipped binary. This RUNS bf16 -> f32 -> bf16 over
      # the COMPLETE 16-bit domain — all 65,536 representable inputs — and the
      # registration exists only because that came back byte-identical. A proof, not a
      # sample, and CI is where it should run rather than where someone remembers to.
      - run: ./target/release/tfs grade register bf16-to-f32 widen bf16:f32
      # The counterpart, and the arm that matters most: a re-quantization structurally
      # CANNOT register. f32 -> bf16 discards mantissa bits, so the round trip is not
      # byte-identical and the registration is refused ROUND_TRIP_LOSSY. Required to fail,
      # and required to fail for THAT reason — a refusal for some other cause would hide a
      # gone fence behind a passing step.
      - run: |
          python3 -c "import struct,sys; sys.stdout.buffer.write(b''.join(
            struct.pack('<f', 1.0 + i * 1e-6) for i in range(4096)))" > "${RUNNER_TEMP}/f32.bin"
          if ./target/release/tfs grade register f32-to-bf16 widen f32:bf16 \
              --corpus "${RUNNER_TEMP}/f32.bin" 2> "${RUNNER_TEMP}/lossy.err"; then
            echo "a lossy cast registered: the round-trip fence is gone" >&2
            exit 1
          fi
          grep -q ROUND_TRIP_LOSSY "${RUNNER_TEMP}/lossy.err" || {
            echo "refused, but not as a lossy round trip:" >&2
            cat "${RUNNER_TEMP}/lossy.err" >&2
            exit 1
          }
      # Qualification: an unrecognised (encoding, device) pair is the ABSENCE of evidence,
      # never permission. The admitted arm and the refused arm both run.
      - run: ./target/release/tfs capability --alias plain/1 x cpu
      - run: |
          if ./target/release/tfs capability --alias plain/1 x cuda; then
            echo "an unqualified device was admitted" >&2
            exit 1
          fi
      # Every reference decoder in the harness, qualified bit-for-bit against the
      # producer-mined vectors, and every deliberately-wrong arm required to FAIL.
      - run: ./target/release/tfs conform
      # The format gate: the production Rust codec and an independent Python codec over
      # the same green/red corpus, both required to agree byte for byte.
      - run: >-
          uv run --python 3.12 --project conformance/cbor/python
          python scripts/cbor-conformance.py --tfs target/release/tfs conform
      - run: >-
          uv run --python 3.12 --project conformance/cbor/python
          python scripts/migration-smoke.py target/release/tfs

  # THE end-to-end test: build the abi3 wheel, install it into a fresh venv, and drive a
  # real store — lease, plan in the caller's traversal order, slot ring, digest, blob and
  # manifest transfer, repository CAS, local alias replace/remove, and the typed refusal
  # arms — then run the whole frozen corpus back through the Python facade.
  #
  # ONE target. cozy-runtime vendors exactly one wheel (manylinux x86_64) and no other
  # tensorfs wheel exists in either consumer at any version. The old matrix built four,
  # declared two of them un-runnable in its own comments, and archived them. Re-add a
  # target the day a consumer names one.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --out dist
          manylinux: auto
      - run: |
          for wheel in dist/*.whl; do
            python3 scripts/version_contract.py wheel "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: |
          bash scripts/wheel-smoke.sh "${RUNNER_TEMP}/smoke" python3.12 \
            --skip-build --wheels "$PWD/dist"
