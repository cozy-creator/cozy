name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: ['^Test[A-H]', '^Test[I-O]', '^Test[P-Q]', '^Test[R-Z]']
    env:
      UV_TORCH_BACKEND: cpu
      COZY_RUNTIME_SOURCE: 13442660bc500f62c0ba75116c3cb3da596773f2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.12.11'
      - run: uv python install 3.12 3.13 3.14
      - run: uv run --isolated --no-project --python 3.12 python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      - name: Check out the exact Runtime execution peer
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/cozy-runtime
          ref: ${{ env.COZY_RUNTIME_SOURCE }}
          path: runtime-peer
          ssh-key: ${{ secrets.COZY_RUNTIME_READ_KEY }}
          persist-credentials: false
      - name: Build and install the source-addressed CPU worker
        run: |
          wheel="$(python3 scripts/build-runtime-peer.py runtime-peer "$COZY_RUNTIME_SOURCE" "$RUNNER_TEMP/runtime-peer")"
          uv tool install --force --python 3.12 "$wheel[model-execution]"
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "COZY_TEST_RUNTIME_WHEEL=$wheel" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/runtime-peer/manifest.json"
      - name: Retain Runtime test provenance
        uses: actions/upload-artifact@v4
        with:
          name: runtime-test-provenance-${{ strategy.job-index }}
          path: ${{ runner.temp }}/runtime-peer/manifest.json
      # CGO_ENABLED=0 is the LAW, not a default: `internal/records` drives SQLite through
      # modernc.org/sqlite and nothing in this binary is C. Building with it off here is
      # what keeps a C dependency from arriving unnoticed and silently ending the
      # cross-compiles cl-013's `release` job depends on.
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      # THE SUITE (decisions.md #661, reapplying #634 for this repo). `tests/product` starts
      # the real system — the real orchestrator, an auto-started Cozy daemon process, and
      # `tests/support/fakeworker`, a second independent implementation of the worker protocol —
      # and observes what it does. Nothing in it is a mock. The tests that need a peer this
      # runner does not have (a cozy-runtime checkout) SKIP by name rather than passing
      # vacuously.
      #
      # worker-protocol's frozen corpus is no longer one of them. It is vendored at
      # tests/product/testdata/worker-protocol under its own digest manifest, so the
      # cross-language identity fence and both vendored-tree guards run HERE, with no token
      # and no sibling checkout. `vendored-protocol` below adds upstream provenance on top;
      # it is a ceiling, not the floor.
      - name: Test with a delegated executor cgroup
        run: |
          # Hosted runner services do not delegate their cgroup to the runner.
          # Give the unprivileged suite its own subtree; Runtime still enforces
          # the normal executor containment contract.
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-product-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CGO_ENABLED=0 \
            --setenv="COZY_TEST_RUNTIME_WHEEL=$COZY_TEST_RUNTIME_WHEEL" \
            --setenv=UV_TORCH_BACKEND=cpu \
            /bin/bash -euc 'id; cat /proc/self/cgroup; exec nice -n 19 go test ./... -run "${{ matrix.tests }}" -timeout 30m -args -serving-cpu-fixture -script-runtime-wheel="$COZY_TEST_RUNTIME_WHEEL" -child-runtime-wheel="$COZY_TEST_RUNTIME_WHEEL"'
      - run: python3 scripts/fence.py

  # Framework artifact classification uses the Runtime-owned generated roster.
  # Public and private package closures both retain every selected distribution.
  runtime-roster:
    runs-on: ubuntu-latest
    env:
      COZY_RUNTIME_TOKEN: ${{ secrets.COZY_RUNTIME_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cozy
      - name: Check out the runtime peer
        if: env.COZY_RUNTIME_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/cozy-runtime-v2
          path: cozy-runtime
          token: ${{ env.COZY_RUNTIME_TOKEN }}
      - uses: actions/setup-go@v5
        if: env.COZY_RUNTIME_TOKEN != ''
        with:
          go-version: stable
      - name: Compare the vendored roster and authored defaults against cozy-runtime
        if: env.COZY_RUNTIME_TOKEN != ''
        working-directory: cozy
        run: |
          nice -n 19 go test ./tests/product/ -run 'TestVendoredBaseDistributions|TestAuthoredDefaultsMatchRuntimeCorpus' -v -timeout 5m \
            -cozy-runtime-repo="$GITHUB_WORKSPACE/cozy-runtime" \
            -require-cozy-runtime-peer
      - name: Report unarmed roster comparison
        if: env.COZY_RUNTIME_TOKEN == ''
        run: |
          echo '::warning::COZY_RUNTIME_TOKEN is absent, so the vendored base-distributions.json was not byte-compared against cozy-runtime. This is a missing ceiling, not a missing floor: the always-armed half ran in `checks` and proves framework classification is derived from the vendored roster.'

  # THE VENDORED-BINDING CHECK. `protocol/` is copied, never imported as a module, so
  # worker-protocol regenerates from its own .proto with its pinned toolchain and
  # byte-compares against what is vendored here. Exact source custody belongs at build
  # time; live peers use the protobuf package major and additive wire minor.
  #
  # It tracks worker-protocol's master deliberately. A pinned ref would only ever prove
  # that nobody edited this directory by hand; comparing master also surfaces generated
  # contract updates for review in this consumer. It is a source-custody check, not a live
  # compatibility gate.
  vendored-protocol:
    runs-on: ubuntu-latest
    env:
      WORKER_PROTOCOL_TOKEN: ${{ secrets.WORKER_PROTOCOL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cozy
      # GITHUB_TOKEN is repository-scoped and cannot read a private sibling. When an explicit
      # read token exists, additionally compare against worker-protocol master so drift arrives
      # at build time. Its absence is reported, never disguised as a failed code check.
      - name: Check out current worker protocol
        if: env.WORKER_PROTOCOL_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/worker-protocol-v2
          path: worker-protocol
          token: ${{ env.WORKER_PROTOCOL_TOKEN }}
      - uses: actions/setup-go@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
      - name: Compare against current peer
        if: env.WORKER_PROTOCOL_TOKEN != ''
        run: worker-protocol/scripts/vendored-diff.sh cozy/protocol/cozy/worker/v1
      # The peer half of the vendored guard, for BOTH vendored trees: the generated bindings
      # and the frozen canonical corpus. vendored-diff.sh above proves the bindings match a
      # REGENERATION; this proves both trees are the bytes of the commit their SOURCE names,
      # and says so loudly when upstream has frozen a newer one. -require-worker-protocol-peer
      # turns an unwired checkout into a failure rather than a pass — a skip is how a whole
      # wire minor of skew went unnoticed.
      #
      # The cross-language identity fence itself is NOT here any more. The corpus is vendored
      # at cozy/tests/product/testdata/worker-protocol, so TestCanonicalDocuments runs in the
      # ordinary `checks` job with no token at all. This job adds provenance on top of it.
      - name: Vendored provenance and drift
        if: env.WORKER_PROTOCOL_TOKEN != ''
        working-directory: cozy
        run: |
          nice -n 19 go test ./tests/product/ -run 'TestVendor|TestWireMinor|TestCorpus' -v -timeout 5m \
            -worker-protocol-repo="$GITHUB_WORKSPACE/worker-protocol" \
            -require-worker-protocol-peer
      - name: Report unarmed peer drift check
        if: env.WORKER_PROTOCOL_TOKEN == ''
        run: |
          echo '::warning::WORKER_PROTOCOL_TOKEN is absent; private-upstream provenance and drift were not queried. This is a missing ceiling, not a missing floor: the always-armed half ran in `checks` with no token — SOURCE digests and exact file lists over both vendored trees, compiled WireMinor against the recorded wire_minor and the frozen corpus, and the full TestCanonicalDocuments cross-language identity fence against the vendored corpus.'

  # cl-013's SHIPPED GUARD. A green `checks` is a fact about the source tree; this job is a
  # fact about the artifact a user would install. They are separate evidence axes and a
  # master-only green may not stand in for this one.
  #
  # Package execution is covered by tests/product/TestProductPath when a cozy-runtime peer
  # exists. This job stays about the shipped CLI asset: build, verify, install, run, upgrade.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/release.sh --tag ci-$GITHUB_SHA
      - run: scripts/release.sh --tag ci-$GITHUB_SHA-next
      - run: |
          scripts/accept.sh \
            --dist "dist/ci-$GITHUB_SHA" \
            --asset "cozy-ci-$GITHUB_SHA-linux-amd64.tar.gz" \
            --upgrade "dist/ci-$GITHUB_SHA-next/cozy-ci-$GITHUB_SHA-next-linux-amd64.tar.gz" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
