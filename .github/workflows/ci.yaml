name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv run --isolated --no-project --python 3.12 python -c "import sys; assert sys.version_info[:2] == (3, 12)"
      # CGO_ENABLED=0 is the LAW, not a default: `internal/records` drives SQLite through
      # modernc.org/sqlite and nothing in this binary is C. Building with it off here is
      # what keeps a C dependency from arriving unnoticed and silently ending the
      # cross-compiles cl-013's `release` job depends on.
      - run: CGO_ENABLED=0 go build ./...
      - run: go vet ./...
      # THE SUITE (decisions.md #661, reapplying #634 for this repo). `tests/product` starts
      # the real system — the real orchestrator, an auto-started Cozy daemon process, and
      # `tests/support/fakeworker`, a second independent implementation of the worker protocol —
      # and observes what it does. Nothing in it is a mock. The tests that need a peer this
      # runner does not have (worker-protocol's frozen corpus or a cozy-runtime checkout)
      # SKIP by name rather than passing vacuously.
      #
      # A skip is still a green, so the frozen-corpus skip is not left to this job to notice:
      # `vendored-protocol` below provisions the corpus and runs TestCanonicalDocuments with
      # -require-worker-protocol-fixtures, where a skip is a hard failure instead.
      - run: nice -n 19 go test ./... -timeout 20m
      - run: python3 scripts/fence.py

  # THE VENDORED-BINDING CHECK. `protocol/` is copied, never imported as a module, so
  # worker-protocol regenerates from its own .proto with its pinned toolchain and
  # byte-compares against what is vendored here. Exact source custody belongs at build
  # time; live peers use the protobuf package major and additive wire minor.
  #
  # It tracks worker-protocol's master deliberately. A pinned ref would only ever prove
  # that nobody edited this directory by hand; comparing master also surfaces generated
  # contract updates for review in this consumer. It is a source-custody check, not a live
  # compatibility gate.
  vendored-protocol:
    runs-on: ubuntu-latest
    env:
      WORKER_PROTOCOL_TOKEN: ${{ secrets.WORKER_PROTOCOL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: cozy
      # GITHUB_TOKEN is repository-scoped and cannot read a private sibling. When an explicit
      # read token exists, additionally compare against worker-protocol master so drift arrives
      # at build time. Its absence is reported, never disguised as a failed code check.
      - name: Check out current worker protocol
        if: env.WORKER_PROTOCOL_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: cozy-creator/worker-protocol-v2
          path: worker-protocol
          token: ${{ env.WORKER_PROTOCOL_TOKEN }}
      - uses: actions/setup-go@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
        with:
          go-version: stable
      - uses: astral-sh/setup-uv@v5
        if: env.WORKER_PROTOCOL_TOKEN != ''
      - name: Compare against current peer
        if: env.WORKER_PROTOCOL_TOKEN != ''
        run: worker-protocol/scripts/vendored-diff.sh cozy/protocol/cozy/worker/v1
      # THE CROSS-LANGUAGE IDENTITY FENCE. TestCanonicalDocuments reproduces worker-protocol's
      # frozen documents against this repo's production Go writer and checks the vendored wire
      # minor against the one the corpus was frozen at. The corpus lives in the private schema
      # repo, so this job — the one that already has it checked out — is where the test can
      # actually run. -require-worker-protocol-fixtures turns a missing corpus from a silent
      # skip into a failure: the skip is how a whole wire minor of skew went unnoticed.
      - name: Cross-language canonical identity fence
        if: env.WORKER_PROTOCOL_TOKEN != ''
        working-directory: cozy
        run: |
          nice -n 19 go test ./tests/product/ -run 'TestCanonical' -v -timeout 10m \
            -worker-protocol-fixtures="$GITHUB_WORKSPACE/worker-protocol/fixtures" \
            -require-worker-protocol-fixtures
      # The peer half of the vendored guard. vendored-diff.sh above proves the bytes match a
      # REGENERATION; this proves they are the bytes of the commit SOURCE names, and says so
      # loudly when upstream has moved past that pin. -require-worker-protocol-peer turns an
      # unwired checkout into a failure rather than a pass, for the same reason as above.
      - name: Vendored provenance and drift
        if: env.WORKER_PROTOCOL_TOKEN != ''
        working-directory: cozy
        run: |
          nice -n 19 go test ./tests/product/ -run 'TestVendor|TestWireMinor' -v -timeout 5m \
            -worker-protocol-repo="$GITHUB_WORKSPACE/worker-protocol" \
            -require-worker-protocol-peer
      - name: Report unarmed peer drift check
        if: env.WORKER_PROTOCOL_TOKEN == ''
        run: |
          echo '::warning::WORKER_PROTOCOL_TOKEN is absent; Git tracks local vendored-byte changes, but private-upstream provenance and drift were not queried'
          echo '::warning::WORKER_PROTOCOL_TOKEN is absent; the frozen corpus could not be checked out, so TestCanonicalDocuments SKIPPED and no cross-language canonical identity was verified'
          echo '::warning::WORKER_PROTOCOL_TOKEN is absent; the vendored peer comparison did not run. The always-armed half of tests/product/vendored_test.go still ran in `checks`: SOURCE digests, its exact file list, and compiled WireMinor vs recorded wire_minor.'

  # cl-013's SHIPPED GUARD. A green `checks` is a fact about the source tree; this job is a
  # fact about the artifact a user would install. They are separate evidence axes and a
  # master-only green may not stand in for this one.
  #
  # Package execution is covered by tests/product/TestProductPath when a cozy-runtime peer
  # exists. This job stays about the shipped CLI asset: build, verify, install, run, upgrade.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/release.sh --tag ci-$GITHUB_SHA
      - run: scripts/release.sh --tag ci-$GITHUB_SHA-next
      - run: |
          scripts/accept.sh \
            --dist "dist/ci-$GITHUB_SHA" \
            --asset "cozy-ci-$GITHUB_SHA-linux-amd64.tar.gz" \
            --upgrade "dist/ci-$GITHUB_SHA-next/cozy-ci-$GITHUB_SHA-next-linux-amd64.tar.gz" \
            --prefix "$RUNNER_TEMP/prefix" --home "$RUNNER_TEMP/cozy-home"
