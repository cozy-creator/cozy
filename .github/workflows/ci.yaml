name: ci
# Every PR and every push to master, on hosted runners: the workspace's tests on Linux with TensorD's
# harness (dev-build.yaml); on master pushes also the owner's day against a CI Hub (owner-day.yml).
# platforms.yaml runs on the same events (build and lint on every release runner).
on:
  pull_request:
  push:
    branches: [master]

permissions:
  actions: read
  contents: read

# A PR's newer push replaces its running check; every other run stands alone.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/dev-build.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      build: tensorfs
      # Build the focused Runtime that consumes this public TensorFS API; the published
      # Runtime and the current 0.12 release candidate use the earlier native interface.
      runtime_ref: 4ddf6170c363ff541405ef93ed71e4a7effe2cb3
      # cozy's and Calcifer's suites need a Hub and a built TensorD: owner-day below.
      test: cargo test --workspace --locked --no-fail-fast --exclude cozy --exclude calcifer

  owner-day:
    if: github.event_name == 'push'
    uses: ./.github/workflows/owner-day.yml
    secrets: inherit
    with:
      # Ordinary D10 distribution and the focused Runtime are separate from the current
      # 0.12 cohort. Freeze both source inputs until this interface is released.
      tensorhub_ref: da8effea817f2ec90fac19a4f553616a5ef73a15
      runtime_ref: 4ddf6170c363ff541405ef93ed71e4a7effe2cb3
