name: ci
# Everything in this file RUNS. It used to be build + ten grep-based fences and zero
# tests, with the real verification — the Rust suite, the frozen vector corpus, the CBOR
# format gate, the wheel smoke — left to whoever remembered to type it.
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # PINNED on purpose: `-D warnings` against a floating stable makes a Rust
      # release a CI failure with no code change.
      - uses: dtolnay/rust-toolchain@1.91.1
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: cargo build --workspace
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: python3 scripts/fence.py
      - run: python3 scripts/version_contract.py source
      - run: cargo build --release --bin tfs
      # A wheel is built once and runs on whatever the pod rents (tfs-068), so the SHA-256
      # instructions must be reachable ONLY through the runtime-detected dispatch: an
      # instruction emitted into an ordinary function is SIGILL on a host without them,
      # which is a crash in `put` rather than a slow `put`. The check would fire the day
      # someone adds `-C target-feature=+sha` to a build. `ring` carries its own detected
      # implementation for TLS and is named because it is not ours.
      - run: |
          set -e
          out=$(objdump -d --no-show-raw-insn target/release/tfs \
            | awk '/^[0-9a-f]+ <.*>:$/ { s=$2 }
                   /sha256rnds2|sha256msg1|sha256msg2/ { print s }' | sort -u)
          [ -n "$out" ] || { echo "no sha extension instructions: the routine was dropped"; exit 1; }
          bad=$(echo "$out" | grep -v 'sha2563x868compress' | grep -v 'ring_core' || true)
          [ -z "$bad" ] || { echo "sha instructions outside the dispatch:"; echo "$bad"; exit 1; }
          echo "sha extension instructions live only in the runtime-dispatched routine"
      # Which SHA-256 routine the suite above ran through. On a runner without the
      # extensions the differential test compares the scalar routine with itself, and the
      # log should say so rather than leave it to be assumed.
      - run: |
          grep -qo sha_ni /proc/cpuinfo \
            && echo "runner HAS the sha extensions: both routines were exercised" \
            || echo "runner LACKS the sha extensions: only the scalar fallback was exercised"
      - run: ./target/release/tfs vectors verify
      - run: |
          set -e
          m=vectors/cases/machine
          diff <(cat "$m/capability-admitted.json"; echo) <(./target/release/tfs capability \
            --alias plain/1 x cpu --json)
          diff <(cat "$m/capability-unqualified.json"; echo) <(./target/release/tfs capability \
            --alias plain/1 x cuda.sm89 --json)
      # Qualification: an unrecognised (encoding, device) pair is the ABSENCE of evidence,
      # never permission. The admitted arm and the refused arm both run.
      - run: ./target/release/tfs capability --alias plain/1 x cpu
      - run: |
          if ./target/release/tfs capability --alias plain/1 x cuda; then
            echo "an unqualified device was admitted" >&2
            exit 1
          fi
      # Every reference decoder in the harness, qualified bit-for-bit against the
      # producer-mined vectors, and every deliberately-wrong arm required to FAIL.
      - run: ./target/release/tfs conform
      # The format gate: the production Rust codec and an independent Python codec over
      # the same green/red corpus, both required to agree byte for byte.
      - run: >-
          uv run --python 3.12 --project conformance/cbor/python
          python scripts/cbor-conformance.py --tfs target/release/tfs conform
      - run: >-
          uv run --python 3.12 --project conformance/cbor/python
          python scripts/migration-smoke.py target/release/tfs

  # THE end-to-end test: build the abi3 wheel, install it into a fresh venv, and drive a
  # real store — lease, plan in the caller's traversal order, slot ring, digest, blob and
  # manifest transfer, repository CAS, local alias replace/remove, and the typed refusal
  # arms — then run the whole frozen corpus back through the Python facade.
  #
  # ONE target. cozy-runtime vendors exactly one wheel (manylinux x86_64) and no other
  # tensorfs wheel exists in either consumer at any version. The old matrix built four,
  # declared two of them un-runnable in its own comments, and archived them. Re-add a
  # target the day a consumer names one.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The binary rides the wheel (tfs-051). It is built INSIDE the manylinux
      # container so its glibc floor matches the extension module it ships beside.
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: --release --locked --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked -p tensorfs-core --bin tfs
            install -D -m 755 target/release/tfs wheel-data/scripts/tfs
      - run: |
          for wheel in dist/*.whl; do
            python3 scripts/version_contract.py wheel "$wheel"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - run: |
          bash scripts/wheel-smoke.sh "${RUNNER_TEMP}/smoke" python3.12 \
            --skip-build --wheels "$PWD/dist"

  # A RELEASED VERSION NUMBER NAMES ONE TREE, FOREVER (proto-036). `v*` is the whole
  # release procedure — publish.yaml triggers on the tag push and there is no local
  # publish — so the tags ARE the released set, and this refuses a tree that has drifted
  # away from the number it still declares. Its own job, with the full history the
  # comparison needs, so the heavy jobs keep their one-commit checkout.
  released-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/released_version.py
