name: windows-gpu
# The Windows + NVIDIA proof (xs-061): scripts/windows-gpu-proof.ps1 on one Windows GPU runner, its bundle
# uploaded. The runner is a label: a single-use JIT runner on an owner's PC (scripts/windows-gpu-runner.ps1), the
# org's hosted T4 (scripts/windows-gpu-hosted-runner.sh), or windows-2025, where the proof must refuse: no GPU.
# A TensorDock rental runs the same script over SSH, with no runner (tracker scripts/cr-020-rent-windows-gpu-runner.py).
#   gh workflow run windows-gpu.yaml -R cozy-creator/cozy-creator -f runner=<label> -f tag=<nonce> [-f version=<release>] [-f runs='fidika/sdxl/generate steps=30']
# The run's name shows the tag, never the label.
run-name: windows-gpu ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label
        type: string
        default: windows-2025
      tag:
        description: A nonce naming the run, so its dispatcher finds it
        type: string
      version:
        description: A cozy release to install (0.10.1); empty installs tensorhub.com's
        type: string
      mirror:
        description: A candidate release directory (COZY_DOWNLOAD_URL), in place of version
        type: string
      runs:
        description: Functions to run, comma-separated, each with optional key=value inputs
        type: string
        default: fidika/sdxl/generate,fidika/birefnet/remove_background,fidika/qwen-image-2/generate_image,fidika/flux-3-klein/generate

permissions:
  contents: read

jobs:
  proof:
    runs-on: ${{ inputs.runner }}
    # A hang bound only: the proof cancels a run that stops moving for 15 min.
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # The hosted T4 image ships driver 471.11 in TCC; Azure's GRID driver makes it WDDM with CUDA 13, no reboot.
      # A self-hosted owner's PC keeps its driver.
      - name: Proof
        env:
          DRIVER: ${{ runner.environment == 'github-hosted' && 'grid' || '' }}
          RUNS: ${{ inputs.runs }}
          MIRROR: ${{ inputs.mirror || inputs.version && format('https://github.com/cozy-creator/cozy-creator/releases/download/v{0}', inputs.version) || '' }}
        run: |
          & scripts/windows-gpu-proof.ps1 -Out "$env:RUNNER_TEMP\windows-gpu-proof" -InstallDriver $env:DRIVER -DownloadUrl $env:MIRROR -Runs $env:RUNS
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-gpu-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-gpu-proof
