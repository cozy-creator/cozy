name: publish-tensorfs
# TensorFS's Python package (design §2): one abi3 wheel per platform, each built and smoke-installed on a
# runner of its own platform, and the sdist, proven by a source install. Moved losslessly from the
# tensorfs repo's wheels.yaml and publish.yaml. Dispatch only; a release is its tensorfs-vX.Y.Z tag:
#   gh workflow run publish-tensorfs.yaml -R cozy-creator/cozy-creator --ref <branch>                         # build and prove
#   gh workflow run publish-tensorfs.yaml -R cozy-creator/cozy-creator --ref tensorfs-vX.Y.Z -f publish=true  # PyPI
#   gh workflow run publish-tensorfs.yaml -R cozy-creator/cozy-creator --ref <branch> -f dev=true             # <version>+dev.g<sha>
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (runs only on a tensorfs-vX.Y.Z tag)
        type: boolean
        default: false
      dev:
        description: Build <version>+dev.g<sha>, a development wheel PyPI never accepts (artifacts only)
        type: boolean
        default: false

concurrency:
  group: publish-tensorfs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: Swatinem/rust-cache@v2
      - run: uv run --no-project --python 3.12 --with triton==3.8.0 python crates/tensorfs/kernels/build.py
      - run: TENSORFS_REQUIRE_AOT=1 cargo test -p tensorfs-core --test kernel_plan -- --include-ignored --test-threads=2
      - uses: actions/upload-artifact@v4
        with:
          name: tensorfs-kernels-${{ github.sha }}
          path: crates/tensorfs-core/kernels/aot/
          if-no-files-found: error
          retention-days: 7

  # One version everywhere; a publish runs on that version's tag; a store format or claim protocol
  # unlike the newest published wheel's needs a newer minor (format_contract.py).
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 crates/tensorfs/scripts/version_contract.py source
      - if: inputs.publish
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/tensorfs/pyproject.toml", "rb"))["project"]["version"])')
          [ "$GITHUB_REF" = "refs/tags/tensorfs-v$version" ] || { echo "::error::publish runs on tensorfs-v$version, not $GITHUB_REF"; exit 1; }
      - uses: astral-sh/setup-uv@v7
      - run: python3 crates/tensorfs/scripts/format_contract.py wheel

  # Release gate (2026-10-01): weights fetched through `ensure` against a real loopback hub and object
  # store injecting resets, stalls, truncation, 5xx/429, expired URLs and wrong bytes.
  fetch-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tensorfs-core --test fetch_faults -- --test-threads=2

  # Release gate (run 2322): a real-HTTP hub pull whose first MiBs crawl still finishes at body throughput.
  download-tail:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tensorfs-core --lib transport::tests::tail -- --nocapture

  # Release gate (xs-045): the v2 fetch path from real loopback origins; its tail (cold MiBs,
  # stalls, failures) finishes at about the body rate, and a uniformly slow fetch restarts none.
  pull:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tensorfs-core --test pull --test pull_tail -- --test-threads=1 --nocapture

  # Release gate (xs-045): the v2 store and writer under kill -9, racing GC and forking children
  # (strace counts the durability syscalls), and the `tfs` CLI over real stores.
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y strace
      - run: cargo test --locked -p tensorfs-core --features faults --test store_v2 --test writer --test tfs_cli -- --test-threads=2

  # Release gate (xs-045): imports through the table engine, from local files, Hugging Face,
  # GitHub and Civitai.
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p tensorfs-core --test import -- --test-threads=2

  # Release gate (xs-045, design §11): the standalone e2e on the Linux wheel in a fresh venv, with no
  # Cozy and no account: import a tiny HF SDXL, export it for Diffusers (same image as upstream),
  # serve it as a static origin and pull it into a second store, by the CLI and by Python.
  e2e:
    needs: wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: wheel
      - uses: astral-sh/setup-uv@v7
      - run: crates/tensorfs/scripts/e2e.sh wheel/*.whl "$RUNNER_TEMP/e2e"

  wheel:
    needs: kernels
    name: wheel ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-24.04, target: x86_64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, target: aarch64 }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
          - { name: windows-x86_64, os: windows-2025, target: x86_64-pc-windows-msvc }
    env:
      CARGO_BUILD_JOBS: "4"
      TENSORFS_REQUIRE_AOT: ${{ startsWith(matrix.name, 'macos') && '0' || '1' }}
    defaults:
      run:
        shell: bash
        working-directory: crates/tensorfs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: tensorfs-kernels-${{ github.sha }}
          path: crates/tensorfs-core/kernels/aot/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: inputs.dev
        run: scripts/dev-version.sh
      # `tfs` ships in the wheel's data scripts beside the module. On Linux it is built INSIDE the
      # manylinux container, so its glibc floor matches the extension's (tfs-051).
      - if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: crates/tensorfs
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: auto
          docker-options: -e TENSORFS_REQUIRE_AOT=1
          before-script-linux: |
            cargo build --release --locked -p tensorfs-core --bin tfs
            install -D -m 755 ../../target/release/tfs wheel-data/scripts/tfs
      - if: runner.os != 'Linux'
        run: |
          cargo build --release --locked -p tensorfs-core --bin tfs
          cp ../../target/release/tfs$([ "$RUNNER_OS" = Windows ] && echo .exe) wheel-data/scripts/
      - if: runner.os != 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: crates/tensorfs
          target: ${{ matrix.target }}
          args: --release --locked --out dist
      - name: Smoke (the installed module and CLI)
        run: |
          python -m pip install dist/*.whl
          python scripts/kernel_conform.py
          cd "$RUNNER_TEMP"
          python -c 'import tensorfs, tensorfs.varena; print(tensorfs.__version__)'
          tfs version
      # The whole wheel's contract (version, executable, platform tag), where it is defined: Linux.
      - if: runner.os == 'Linux'
        uses: astral-sh/setup-uv@v7
      - if: runner.os == 'Linux'
        run: |
          python3 scripts/version_contract.py wheel dist/*.whl
          uv run --script scripts/wheel-platform.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: crates/tensorfs/dist/*.whl
          if-no-files-found: error
          retention-days: 7

  # Built from source it carries the module, not the `tfs` binary (the wheels do).
  sdist:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - if: inputs.dev
        run: crates/tensorfs/scripts/dev-version.sh
      - uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          working-directory: crates/tensorfs
          command: sdist
          args: --out dist
      - run: |
          python -m pip install crates/tensorfs/dist/*.tar.gz
          cd "$RUNNER_TEMP"
          python -c 'import tensorfs, tensorfs.varena; print(tensorfs.__version__)'
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-sdist
          path: crates/tensorfs/dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # Every platform and the sdist, or nothing.
  publish:
    if: inputs.publish && !inputs.dev
    needs: [gate, fetch-faults, download-tail, pull, store, import, e2e, wheel, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    # Hang bound, not a work budget.
    timeout-minutes: 30
    permissions:
      id-token: write  # PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
