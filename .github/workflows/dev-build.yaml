name: dev-build
# Builds release artifacts for any ref and runs one targeted test command, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/cozy -f ref=<sha> [-f build=none] [-f test='go test ./internal/run/...']
#   Rust: -f build=none -f test='cargo test -p cozy-proto'
#   TensorFS: -f build=tensorfs -f test='cargo test -p tensorfs-core --test store_contract'
# Artifacts: cozy-cli-<sha> (cozy-<os>-<arch>.tar.gz for every release platform, the player and
# SHA256SUMS, stamped dev-<sha>), tensord-<sha> (the manylinux x86_64 tensord Runtime's wheel
# bundles) and tensorfs-wheel-<sha> (the manylinux x86_64 wheel). Tests get
# PostgreSQL (AUTHKIT_TEST_DATABASE_URL), the TensorFS wheel installed in a venv
# (TENSORFS_TEST_PYTHON) when it was built, and a Runtime wheel (COZY_TEST_RUNTIME_WHEEL): the newest
# published one, or runtime_ref's. No whole-suite default: `test` is empty unless given.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "cli: the release archives; tensord: the manylinux tensord; tensorfs: the TensorFS wheel; none: tests only (comma-separate several)"
        type: string
        default: cli
      test:
        description: Targeted test command, run with bash at the ref in a delegated cgroup; empty runs none
        type: string
        default: ''
      runtime_ref:
        description: cozy-runtime branch, tag or SHA whose wheel tests get as COZY_TEST_RUNTIME_WHEEL; empty for the newest published
        type: string
        default: ''
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.runtime_ref }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  dev:
    runs-on: ${{ inputs.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    services:
      # Started only for tests (TensorD's tests/hub_oauth.rs reads AUTHKIT_TEST_DATABASE_URL).
      postgres:
        image: ${{ inputs.test != '' && 'postgres:18-alpine' || '' }}
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Caches modules and the build cache keyed on go.sum.
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          check-latest: false
      - uses: astral-sh/setup-uv@v6
        if: inputs.test != '' || inputs.runtime_ref != ''
      # The Rust workspace: rust-toolchain.toml's toolchain installs on first use. target/manylinux
      # is the TensorFS wheel's container build.
      - uses: Swatinem/rust-cache@v2
        if: inputs.test != '' || contains(inputs.build, 'tensor')
        with:
          key: ${{ contains(inputs.build, 'tensor') }}-${{ inputs.test != '' }}
          cache-on-failure: true
          workspaces: |
            . -> target
            . -> target/manylinux
      # The release recipe (release.yaml): umask 0002, -buildvcs=false, scripts/release.sh.
      - name: Build the release archives
        if: contains(inputs.build, 'cli')
        env:
          GOFLAGS: -buildvcs=false
          GOTOOLCHAIN: local
          SHA: ${{ steps.sha.outputs.sha }}
        run: |
          umask 0002
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          git checkout -- .
          scripts/release.sh "dev-$SHA"
      - if: contains(inputs.build, 'cli')
        uses: actions/upload-artifact@v4
        with:
          name: cozy-cli-${{ steps.sha.outputs.sha }}
          path: dist/dev-${{ steps.sha.outputs.sha }}/
          if-no-files-found: error
          retention-days: 7
      - uses: arduino/setup-task@v2
        if: contains(inputs.build, 'tensord')
        with:
          repo-token: ${{ github.token }}
      # crates/tensord's Taskfile `release`, as Runtime's `task machine` runs it. Its container keeps
      # its toolchain under target/manylinux/rustup, which never goes to the cache.
      - name: Build tensord
        if: contains(inputs.build, 'tensord')
        run: |
          rm -rf target/manylinux/rustup
          CARGO_BUILD_JOBS=$(nproc) task -d crates/tensord release OUT="$PWD/dist/tensord"
          rm -rf target/manylinux/rustup
      - if: contains(inputs.build, 'tensord')
        uses: actions/upload-artifact@v4
        with:
          name: tensord-${{ steps.sha.outputs.sha }}
          path: dist/tensord/tensord-linux-x86_64
          if-no-files-found: error
          retention-days: 7
      # TensorFS's release wheel: the extension and the `tfs` it carries, both built in the
      # manylinux container so their glibc floor is the wheel's tag.
      - name: Build the TensorFS wheel
        if: contains(inputs.build, 'tensorfs')
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: x86_64
          manylinux: auto
          working-directory: crates/tensorfs
          args: --release --locked --target-dir ../../target/manylinux --out dist
          before-script-linux: |
            cargo build --release --locked --target-dir ../../target/manylinux -p tensorfs-core --bin tfs
            install -D -m 755 ../../target/manylinux/release/tfs wheel-data/scripts/tfs
      # The container leaves root-owned files the tests and the cache post-step write.
      - if: always() && contains(inputs.build, 'tensorfs')
        run: sudo chown -R "$(id -u):$(id -g)" target crates/tensorfs
      - if: contains(inputs.build, 'tensorfs')
        uses: actions/upload-artifact@v4
        with:
          name: tensorfs-wheel-${{ steps.sha.outputs.sha }}
          path: crates/tensorfs/dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - if: contains(inputs.build, 'tensorfs') && inputs.test != ''
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/tensorfs"
          uv pip install --python "$RUNNER_TEMP/tensorfs/bin/python" crates/tensorfs/dist/*.whl
          echo "TENSORFS_TEST_PYTHON=$RUNNER_TEMP/tensorfs/bin/python" >> "$GITHUB_ENV"
      - if: inputs.runtime_ref != ''
        uses: actions/checkout@v5
        with:
          repository: cozy-creator/cozy-runtime
          ref: ${{ inputs.runtime_ref }}
          ssh-key: ${{ secrets.COZY_RUNTIME_READ_KEY }}
          path: .runtime
      - if: inputs.runtime_ref != ''
        run: uv build --wheel --out-dir "$RUNNER_TEMP/runtime" .runtime
      # Without runtime_ref, the Runtime machines install today: the newest published wheel.
      - if: inputs.test != '' && inputs.runtime_ref == ''
        run: |
          uvx --from pip pip download --quiet --no-deps --only-binary :all: --python-version 3.12 \
            --platform manylinux_2_28_x86_64 --dest "$RUNNER_TEMP/runtime" cozy-runtime
      - if: inputs.test != '' || inputs.runtime_ref != ''
        run: echo "COZY_TEST_RUNTIME_WHEEL=$(ls "$RUNNER_TEMP"/runtime/cozy_runtime-*.whl)" >> "$GITHUB_ENV"
      # ci.yaml's isolation: the product tests' executor containment needs a delegated cgroup subtree.
      - if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
          AUTHKIT_TEST_DATABASE_URL: postgres://postgres:ci-only@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          locations=()
          for name in AUTHKIT_TEST_DATABASE_URL TENSORFS_TEST_PYTHON COZY_TEST_RUNTIME_WHEEL; do
            [ -z "${!name:-}" ] || locations+=("--setenv=$name=${!name}")
          done
          sudo systemd-run --wait --pipe --collect \
            --unit="cozy-dev-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --uid="$(id -u)" --gid="$(id -g)" --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv="HOME=$HOME" --setenv=CGO_ENABLED=0 --setenv=UV_TORCH_BACKEND=cpu \
            --setenv="GOCACHE=$(go env GOCACHE)" --setenv="GOMODCACHE=$(go env GOMODCACHE)" \
            --setenv=CARGO_TERM_COLOR=never --setenv=GITHUB_ACTIONS=true "${locations[@]}" \
            bash -euo pipefail -c "$TEST"
