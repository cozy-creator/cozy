name: dev-build
# Builds the release wheel for any ref and runs one targeted test command, off the dev box:
#   gh workflow run dev-build.yaml -R cozy-creator/tensorfs -f ref=<sha> [-f build=none] [-f test='cargo test -p tensorfs-core --test ensure']
# The artifact is tensorfs-wheel-<sha>. No whole-suite default: `test` is empty unless given.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build
        type: string
        default: master
      build:
        description: "wheel: the release's manylinux x86_64 wheel; none: tests only"
        type: string
        default: wheel
      test:
        description: Targeted test command, run with bash at the ref; empty runs none
        type: string
        default: ''
      runner:
        description: Runner label
        type: string
        default: ubuntu-latest
      nonce:
        description: Caller's id, shown in the run name so the caller can find its run
        type: string
        default: ''
run-name: dev-build ${{ inputs.ref }} ${{ inputs.build }} ${{ inputs.nonce }}

permissions:
  contents: read

jobs:
  dev:
    runs-on: ${{ inputs.runner }}
    # Hang bound, not a work budget.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@1.91.1
      - uses: astral-sh/setup-uv@v7
      # target/ is the host test build; target/manylinux is the wheel's container build.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ inputs.build }}-${{ inputs.test != '' }}
          workspaces: |
            . -> target
            . -> target/manylinux
      # The release recipe (wheels.yaml), built in the manylinux container so the CLI's glibc
      # floor matches the extension beside it.
      - if: contains(inputs.build, 'wheel')
        uses: PyO3/maturin-action@v1
        with:
          maturin-version: v1.15.0
          target: x86_64
          args: --release --locked --target-dir target/manylinux --out dist
          manylinux: auto
          before-script-linux: |
            cargo build --release --locked --target-dir target/manylinux -p tensorfs-core --bin tfs
            install -D -m 755 target/manylinux/release/tfs wheel-data/scripts/tfs
      - if: contains(inputs.build, 'wheel')
        uses: actions/upload-artifact@v4
        with:
          name: tensorfs-wheel-${{ steps.sha.outputs.sha }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
      - if: inputs.test != ''
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST"
      # The container build leaves root-owned files the cache post-step must read and prune.
      - if: always()
        run: test ! -d target || sudo chown -R "$(id -u):$(id -g)" target
