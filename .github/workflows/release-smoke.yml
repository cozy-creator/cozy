name: release-smoke
# dist global-artifacts job (dist-workspace.toml): a failure here stops the release before it is hosted.
# It also adds each archive's attestation bundles to the release (<archive>.sigstore.jsonl).
# The CPU smoke of design §6.4 on every release runner, against this run's own artifacts served from a local
# mirror (COZY_DOWNLOAD_URL is the release location for the installers and `cozy update` alike): install
# script, --version, PATH, up, status, hub list, package search (tensorhub.com, anonymous), the local machine
# (enabled as a user service and shown, on every OS), update to this release (the machine restarts on the new
# binary), disable, down. A verb answering not_ported is skipped, so the smoke grows as the
# verbs land.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  mirror:
    # build-global-artifacts builds the installers beside this job; this builds the same ones.
    runs-on: ubuntu-24.04
    # bash -eo pipefail: a failing command anywhere in a pipe fails the step.
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.mirror.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      # What build-global-artifacts starts from; its own uploads may already be there too, so name these.
      - uses: actions/download-artifact@v8
        with:
          name: artifacts-plan-dist-manifest
          path: target/distrib/
      - uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      - id: mirror
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          chmod +x ~/.cargo/bin/dist
          tag=; [ -z "$TAG" ] || [ "$TAG" = dry-run ] || tag=--tag=$TAG
          dist build $tag --artifacts=global --output-format=json > global-dist-manifest.json
          mv global-dist-manifest.json target/distrib/
          mkdir mirror
          # The release's dist-manifest.json: every build's manifest merged, as `dist host` merges them.
          jq -s 'reduce .[] as $m ({}; . * $m)' target/distrib/*-dist-manifest.json > mirror/dist-manifest.json
          cp target/distrib/cozy-* target/distrib/sha256.sum mirror/
          echo "version=$(jq -r '.releases[0].app_version' mirror/dist-manifest.json)" >> "$GITHUB_OUTPUT"
          {
            echo '| archive | archive MB | binary MB | newest glibc symbol |'
            echo '|---|---|---|---|'
            for f in mirror/cozy-*.tar.gz mirror/cozy-*.zip; do
              case $f in
                *.zip) unzip -p "$f" cozy.exe > bin ;;
                *) tar -xzOf "$f" "$(tar -tzf "$f" | grep -E '/cozy$')" > bin ;;
              esac
              glibc=-
              case $f in *linux*) glibc=$(readelf -W --version-info bin | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1) ;; esac
              echo "| ${f#mirror/} | $(du -k "$f" | awk '{printf "%.1f", $1/1024}') | $(du -k bin | awk '{printf "%.1f", $1/1024}') | $glibc |"
            done
            rm bin
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Each archive's bundles ride in the release as <archive>.sigstore.jsonl (one Sigstore bundle per
      # line): `cozy update` verifies those, never GitHub's rate-limited attestations API.
      - name: Every archive carries this workflow's attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir attestations
          for f in mirror/cozy-*.tar.gz mirror/cozy-*.zip; do
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
            gh api "repos/$GITHUB_REPOSITORY/attestations/sha256:$(sha256sum "$f" | cut -d' ' -f1)" \
              | jq -c '.attestations[].bundle | select(. != null)' > "attestations/${f#mirror/}.sigstore.jsonl"
          done
          cp attestations/* mirror/
      # host releases every artifacts-* upload.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-attestations
          path: attestations/
      - uses: actions/upload-artifact@v7
        with:
          name: smoke-mirror
          path: mirror/

  smoke:
    needs: mirror
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          # Windows PowerShell 5.1 on x64, PowerShell 7 on arm64 (5.1 there reports x64 and gets that build).
          - { os: windows-2025, target: x86_64-pc-windows-msvc, ps: powershell }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc, ps: pwsh }
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: smoke-mirror
          path: mirror
      - env:
          VERSION: ${{ needs.mirror.outputs.version }}
          TARGET: ${{ matrix.target }}
          PS: ${{ matrix.ps }}
        run: |
          python=python3; [ "$RUNNER_OS" != Windows ] || python=python
          $python -m http.server 8123 --bind 127.0.0.1 --directory mirror > /dev/null 2>&1 &
          export COZY_DOWNLOAD_URL=http://127.0.0.1:8123
          until curl -sf "$COZY_DOWNLOAD_URL/dist-manifest.json" > /dev/null; do sleep 1; done

          if [ "$RUNNER_OS" = Windows ]; then
            installed=$($PS -NoProfile -ExecutionPolicy Bypass -c "irm $COZY_DOWNLOAD_URL/cozy-installer.ps1 | iex" 2>&1)
            cozy=$HOME/.cozy/bin/cozy.exe
            path=$(powershell -NoProfile -c "[Environment]::GetEnvironmentVariable('Path', 'User')")
            case ${path,,} in *'\.cozy\bin'*) ;; *) echo "::error::the user PATH lacks .cozy\bin: $path"; exit 1 ;; esac
          else
            installed=$(curl -sSf "$COZY_DOWNLOAD_URL/cozy-installer.sh" | sh 2>&1)
            cozy=$HOME/.cozy/bin/cozy
            found=$(env -i HOME="$HOME" PATH=/usr/bin:/bin sh -lc 'command -v cozy')
            [ "$found" = "$cozy" ] || { echo "::error::a login shell finds '$found', not $cozy"; exit 1; }
          fi
          echo "$installed"
          case $installed in *"$TARGET"*) ;; *) echo "::error::the installer did not pick $TARGET"; exit 1 ;; esac
          version=$("$cozy" --version)
          echo "$version"
          [ "$version" = "cozy $VERSION" ]

          fail=0
          # `cozy --json <words…>`; skipped while the grammar lacks it or the verb answers not_ported.
          # ran=1 when it succeeded.
          step() {
            ran=0 code=0
            if ! "$cozy" "$@" --help > /dev/null 2>&1; then
              echo "skipped, not in the grammar yet: cozy $*"
              return
            fi
            out=$("$cozy" --json "$@") || code=$?
            if [ "$code" = 2 ] && printf '%s' "$out" | grep -Eq '"code": *"not_ported"'; then
              echo "skipped, not ported: cozy $*"
              return
            fi
            printf '%s\n' "$out"
            if [ "$code" = 0 ]; then ran=1; else echo "::error::cozy $* exited $code"; fail=1; fi
          }
          # `cozy --json <words…>` must succeed: these verbs are in every release, never skipped.
          must() {
            code=0
            out=$("$cozy" --json "$@") || code=$?
            printf '%s\n' "$out"
            [ "$code" = 0 ] || { echo "::error::cozy $* exited $code"; fail=1; }
          }
          # `cozy --json <words…>` must be refused with code $1.
          refuses() {
            want=$1 code=0
            shift
            out=$("$cozy" --json "$@") || code=$?
            printf '%s\n' "$out"
            [ "$code" != 0 ] && printf '%s' "$out" | grep -Eq "\"code\": *\"$want\"" \
              || { echo "::error::cozy $* answered $code, not $want"; fail=1; }
          }
          step up
          # A second command finds Calcifer already up (and must not hang on a pipe it holds).
          step status
          step hub list
          step package search sdxl
          # The local machine, on every OS: `enable` returns once `local` is ready.
          if [ "$RUNNER_OS" = Linux ]; then
            # A user service manager, as a desktop login has: the runner's user lingers, with its bus.
            sudo loginctl enable-linger "$(id -un)"
            export XDG_RUNTIME_DIR=/run/user/$(id -u)
            until [ -S "$XDG_RUNTIME_DIR/bus" ]; do sleep 1; done
            export DBUS_SESSION_BUS_ADDRESS=unix:path=$XDG_RUNTIME_DIR/bus
          fi
          must machine enable
          must machine show local
          before=$(ls -i "$cozy")
          step update "$VERSION"
          if [ "$ran" = 1 ]; then
            [ "$(ls -i "$cozy")" != "$before" ] || { echo "::error::cozy update $VERSION left the binary in place"; fail=1; }
            [ "$("$cozy" --version)" = "cozy $VERSION" ] || { echo "::error::the updated binary is not cozy $VERSION"; fail=1; }
            # The machine takes the new binary (a new file, though the same version) and serves on it.
            if [ "$(printf '%s' "$out" | jq -r .machine.state)" = restarted ]; then
              # Calcifer hears the restarted machine's status when its link reconnects.
              until [ "$("$cozy" --json machine show local | jq -r .status.version)" = "$VERSION" ]; do sleep 2; done
            else
              echo "::error::the machine did not restart on the new binary"; fail=1
            fi
          fi
          must machine disable
          step down
          exit $fail
