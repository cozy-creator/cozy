name: pages

# The browser player, web/player, at https://cozy-creator.github.io/cozy/play/: the public
# HTTPS origin `cozy run play` links open. GitHub-hosted runners only.
on:
  push:
    branches: [master]
    paths: ['web/player/**', '.github/workflows/pages.yaml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}play/
    steps:
      - uses: actions/checkout@v5
      - run: mkdir -p _site/play && cp web/player/index.html web/player/cozy-webrtc.js _site/play/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
