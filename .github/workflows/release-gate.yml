name: release-gate
# dist local-artifacts job (dist-workspace.toml): a release needs a green platforms.yaml run on its own
# commit that covered every release runner. A dry run reports the verdict without refusing.
# The release carries gates.json: its commit, that platforms run, and this release run (its smoke).
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  platforms:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          TAG: ${{ github.event.inputs.tag }}
          RUNNERS: ubuntu-24.04 ubuntu-24.04-arm macos-15 windows-2025 windows-11-arm
        run: |
          runs=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs
          platforms=
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w platforms.yaml --commit "$SHA" --status success -L 50 --json databaseId -q '.[].databaseId'); do
            green=" $(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.conclusion == "success") | .name] | join(" ")') "
            missing=$(for r in $RUNNERS; do case $green in *" $r "*) ;; *) printf '%s ' "$r" ;; esac; done)
            [ -n "$missing" ] || { platforms=$runs/$id; break; }
          done
          mkdir gates
          jq -n --arg commit "$SHA" --arg platforms "$platforms" --arg release "$runs/$GITHUB_RUN_ID" \
            '{commit: $commit, platforms: (if $platforms == "" then null else $platforms end), release: $release}' | tee gates/gates.json
          [ -z "$platforms" ] || exit 0
          msg="no green platforms.yaml run on $SHA covers $RUNNERS; run: gh workflow run platforms.yaml --ref $REF"
          if [ -n "$TAG" ] && [ "$TAG" != dry-run ]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg"
      # host releases every artifacts-* upload.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-gates
          path: gates/
