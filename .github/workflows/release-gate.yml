name: release-gate
# dist local-artifacts job (dist-workspace.toml): a release needs a green platforms.yaml run on its own
# commit that covered every release runner. When the binary links TensorFS (cargo tree, a fact of the
# build), the newest tensorfs wheel on PyPI must also speak its store format and claim protocol
# (design §2, crates/tensorfs/scripts/format_contract.py); a dry run or prerelease may name a
# publish-tensorfs run (`tensorfs_run`) whose unpublished wheel stands in. A dry run reports the verdicts
# without refusing.
# The release carries gates.json: its commit, the must_contain commits release.yml's plan job verified,
# that platforms run, the tensorfs wheel it matches (or why none was checked), tensorhub.com's
# /v1/software at release time, and this release run.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  platforms:
    runs-on: ubuntu-24.04
    # bash -eo pipefail: a failing command anywhere in a pipe fails the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref_name }}
          TAG: ${{ github.event.inputs.tag }}
          MUST: ${{ github.event.inputs.must_contain }}
          TENSORFS_RUN: ${{ github.event.inputs.tensorfs_run }}
          RUNNERS: ubuntu-24.04 ubuntu-24.04-arm macos-15 windows-2025 windows-11-arm
        run: |
          runs=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs
          refusals=() notes=()
          platforms=
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w platforms.yaml --commit "$SHA" --status success -L 50 --json databaseId -q '.[].databaseId'); do
            green=" $(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs -q '[.jobs[] | select(.conclusion == "success") | .name] | join(" ")') "
            missing=$(for r in $RUNNERS; do case $green in *" $r "*) ;; *) printf '%s ' "$r" ;; esac; done)
            [ -n "$missing" ] || { platforms=$runs/$id; break; }
          done
          [ -n "$platforms" ] || refusals+=("no green platforms.yaml run on $SHA covers $RUNNERS; run: gh workflow run platforms.yaml --ref $REF")
          tensorfs=
          links=$(cargo tree --locked -p cozy --target all -e normal --prefix none --format '{p}')
          if grep -q '^tensorfs-core v' <<< "$links" && [ -n "$TENSORFS_RUN" ]; then
            # An unpublished wheel (a publish-tensorfs run's) stands in for PyPI's, never for a final release.
            case $TAG in '' | dry-run | *-*) ;; *) refusals+=("tensorfs_run is for dry runs and prereleases, not $TAG") ;; esac
            gh run download "$TENSORFS_RUN" -R "$GITHUB_REPOSITORY" -n wheel-linux-x86_64 -D candidate
            tensorfs=$(python3 crates/tensorfs/scripts/format_contract.py binary --wheel candidate/*.whl 2> format.err) \
              && tensorfs="$tensorfs (unpublished, run $TENSORFS_RUN)" || refusals+=("$(cat format.err)")
          elif grep -q '^tensorfs-core v' <<< "$links"; then
            tensorfs=$(python3 crates/tensorfs/scripts/format_contract.py binary 2> format.err) || refusals+=("$(cat format.err)")
          else
            notes+=("tensorfs: not checked, the cozy binary does not link tensorfs-core")
          fi
          # What machines installed when this binary was released (information, never a refusal).
          software=$(curl -sf https://tensorhub.com/v1/software | jq -c .) || software=null
          mkdir gates
          jq -n --arg commit "$SHA" --arg must "$MUST" --arg platforms "$platforms" --arg tensorfs "$tensorfs" \
            --argjson software "$software" --arg release "$runs/$GITHUB_RUN_ID" \
            '{commit: $commit, must_contain: ($must | split(",") | map(select(. != ""))),
              platforms: (($platforms | select(. != "")) // null), tensorfs: (($tensorfs | select(. != "")) // null),
              hub_software: $software, notes: $ARGS.positional, release: $release}' --args "${notes[@]}" "${refusals[@]}" \
            | tee gates/gates.json
          [ ${#refusals[@]} -gt 0 ] || exit 0
          level=warning; [ -z "$TAG" ] || [ "$TAG" = dry-run ] || level=error
          for refusal in "${refusals[@]}"; do echo "::$level::$refusal"; done
          [ "$level" = warning ]
      # host releases every artifacts-* upload.
      - uses: actions/upload-artifact@v7
        with:
          name: artifacts-gates
          path: gates/
