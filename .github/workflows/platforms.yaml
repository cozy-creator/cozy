name: platforms
# The Rust workspace builds, lints and passes the cozy-platform seams on every release runner, Linux x86_64
# as the control; the job's verdict is that. TensorD and TensorFS are reported, not judged, where they are
# not ported yet (xs-043 T, X, WM, AP).
# Nightly on master, and per question:
#   gh workflow run platforms.yaml -R cozy-creator/cozy --ref <branch> [-f os='["windows-2025"]'] [-f test='cargo test -p <crate>']
# A release (release.yml) needs a green run on its commit covering every release runner (release-gate.yml).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025", "windows-11-arm"]'
      test:
        description: Optional command run with bash after the build; empty runs none
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    env:
      # TensorD and TensorFS are judged where they build (Linux); elsewhere reported until ported.
      IMPORTED: ${{ !startsWith(matrix.os, 'ubuntu') && '--exclude tensord --exclude tensorfs-core --exclude tensorfs-plane --exclude tensorfs-py' || '' }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025", "windows-11-arm"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Rust build and lint (compiles tests too)
        id: rust
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked $IMPORTED -- -D warnings 2>&1 | tee rust.txt; exit "${PIPESTATUS[0]}"

      - name: TensorD and TensorFS (reported)
        id: imported
        if: env.IMPORTED != ''
        continue-on-error: true
        run: cargo check ${IMPORTED//--exclude/-p} --all-targets --locked --message-format=short 2>&1 | tee imported.txt; exit "${PIPESTATUS[0]}"

      # --include-ignored installs a real user service: hosted runners only.
      - name: Seams
        id: seams
        continue-on-error: true
        run: cargo test -p cozy-platform --test seams --locked -- --include-ignored 2>&1 | tee seams.txt; exit "${PIPESTATUS[0]}"

      # The committed machine API spec is what cozy-proto's types generate (xs-044): drift fails the run.
      - name: Machine API spec
        id: spec
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo test -p cozy-proto --locked --lib machine::api 2>&1 | tee spec.txt; exit "${PIPESTATUS[0]}"

      - name: Test
        if: inputs.test != ''
        id: test
        continue-on-error: true
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST" 2>&1 | tee test.txt; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo "rust=${{ steps.rust.outcome }} seams=${{ steps.seams.outcome }} spec=${{ steps.spec.outcome }} test=${{ steps.test.outcome }} imported=${{ steps.imported.outcome }}"
            echo '```'
            # The tail of each: where errors are. `head` would end the pipe early (SIGPIPE under pipefail).
            for f in rust.txt imported.txt seams.txt spec.txt; do [ ! -f "$f" ] || tail -n 50 "$f"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozy-${{ matrix.os }}
          path: |
            rust.txt
            imported.txt
            seams.txt
            spec.txt
            test.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        run: test "${{ steps.rust.outcome }}/${{ steps.seams.outcome }}" = success/success && test "${{ steps.test.outcome }}" != failure && test "${{ steps.spec.outcome }}" != failure
