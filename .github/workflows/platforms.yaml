name: platforms
# The Rust workspace builds, lints and passes the platform seams on every release runner, Linux x86_64
# as the control; the job's verdict is that. TensorD and TensorFS are reported, not judged, where they are
# not ported yet (xs-043 T, X, WM, AP).
# Nightly on master, and per question:
#   gh workflow run platforms.yaml -R cozy-creator/cozy-creator --ref <branch> [-f os='["windows-2025"]'] [-f test='cargo test -p <crate>']
# A release (release.yml) needs a green run on its commit covering every release runner (release-gate.yml).
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025", "windows-11-arm"]'
      test:
        description: Optional command run with bash after the build; empty runs none
        type: string
        default: ''
      runtime_ref:
        description: cozy-runtime branch, tag or SHA built into a wheel for the test (COZY_TEST_RUNTIME_WHEEL); empty builds none
        type: string
        default: ''
      tensorfs_wheel:
        description: Build this ref's TensorFS wheel on the runner for the test (COZY_TEST_TENSORFS_WHEEL)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    env:
      # TensorD and TensorFS are judged where they build (Linux); elsewhere reported until ported.
      IMPORTED: ${{ !startsWith(matrix.os, 'ubuntu') && '--exclude tensord --exclude tensorfs-core --exclude varena --exclude tensorfs-py' || '' }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os || '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025", "windows-11-arm"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Rust build and lint (compiles tests too)
        id: rust
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked $IMPORTED -- -D warnings 2>&1 | tee rust.txt; exit "${PIPESTATUS[0]}"

      - name: TensorD and TensorFS (reported)
        id: imported
        if: env.IMPORTED != ''
        continue-on-error: true
        run: cargo check ${IMPORTED//--exclude/-p} --all-targets --locked --message-format=short 2>&1 | tee imported.txt; exit "${PIPESTATUS[0]}"

      # --include-ignored installs a real user service: hosted runners only.
      - name: Seams
        id: seams
        continue-on-error: true
        run: cargo test -p platform --test seams --locked -- --include-ignored 2>&1 | tee seams.txt; exit "${PIPESTATUS[0]}"

      # The committed machine API spec is what protocol's types generate (xs-044): drift fails the run.
      - name: Machine API spec
        id: spec
        if: runner.os == 'Linux'
        continue-on-error: true
        run: cargo test -p protocol --locked --lib machine::api 2>&1 | tee spec.txt; exit "${PIPESTATUS[0]}"

      - uses: actions/checkout@v5
        if: inputs.runtime_ref != ''
        with:
          repository: cozy-creator/cozy-runtime
          ref: ${{ inputs.runtime_ref }}
          ssh-key: ${{ secrets.COZY_RUNTIME_READ_KEY }}
          path: .runtime

      - uses: astral-sh/setup-uv@v7
        if: inputs.runtime_ref != '' || inputs.tensorfs_wheel

      - name: Runtime wheel
        if: inputs.runtime_ref != ''
        run: |
          uv run --no-project python .runtime/scripts/stamp-build-provenance.py "$(git -C .runtime rev-parse HEAD)"
          uv build --wheel --out-dir "$RUNNER_TEMP/runtime" .runtime
          echo "COZY_TEST_RUNTIME_WHEEL=$(ls "$RUNNER_TEMP"/runtime/cozy_runtime-*.whl)" >> "$GITHUB_ENV"

      # The wheel carries `tfs`, built first into its scripts directory, as the release does.
      - name: TensorFS wheel
        if: inputs.tensorfs_wheel
        run: |
          exe=; [ "$RUNNER_OS" != Windows ] || exe=.exe
          cargo build --release --locked -p tensorfs-core --bin tfs
          mkdir -p crates/tensorfs/wheel-data/scripts
          cp "target/release/tfs$exe" crates/tensorfs/wheel-data/scripts/
          (cd crates/tensorfs && uvx maturin@1.15.0 build --release --out "$RUNNER_TEMP/tensorfs")
          echo "COZY_TEST_TENSORFS_WHEEL=$(ls "$RUNNER_TEMP"/tensorfs/tensorfs-*.whl)" >> "$GITHUB_ENV"

      - name: Test
        if: inputs.test != ''
        id: test
        continue-on-error: true
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST" 2>&1 | tee test.txt; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo "rust=${{ steps.rust.outcome }} seams=${{ steps.seams.outcome }} spec=${{ steps.spec.outcome }} test=${{ steps.test.outcome }} imported=${{ steps.imported.outcome }}"
            echo '```'
            # The tail of each: where errors are. `head` would end the pipe early (SIGPIPE under pipefail).
            for f in rust.txt imported.txt seams.txt spec.txt; do [ ! -f "$f" ] || tail -n 50 "$f"; done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozy-${{ matrix.os }}
          path: |
            rust.txt
            imported.txt
            seams.txt
            spec.txt
            test.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        run: test "${{ steps.rust.outcome }}/${{ steps.seams.outcome }}" = success/success && test "${{ steps.test.outcome }}" != failure && test "${{ steps.spec.outcome }}" != failure

  # Generated data CI regenerates and compares byte for byte: TensorFS's constructor orders and
  # converter tables, from pinned Diffusers/Transformers on the meta device (CPU, no weights).
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      # No tracked file names a real home directory; tests use only the fake ones allowed here.
      - name: No local paths
        run: |
          git grep -n -I -P '(/hom[e]/|/User[s]/|[A-Za-z]:[\\/]+User[s][\\/]+)(?!(me|a|a b)[\\/])' && exit 1
          [ $? = 1 ]
      - uses: astral-sh/setup-uv@v7
      - name: Constructor orders
        run: uv run --script crates/tensorfs/scripts/orders.py
      - name: Converter tables
        run: uv run --script crates/tensorfs/scripts/converters.py
