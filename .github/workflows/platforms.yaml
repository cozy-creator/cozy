name: platforms
# Native build and vet on every desktop platform, Linux x86_64 as the control. Manual only:
# macOS bills 10x and Windows 2x, so run it per question, never per push.
#   gh workflow run platforms.yaml -R cozy-creator/cozy --ref <branch> [-f os='["windows-2025"]'] [-f test='go test ./internal/flock/...']
# The Rust workspace builds and lints on every runner; `test` may name `cargo test -p <crate>`.
on:
  workflow_dispatch:
    inputs:
      os:
        description: JSON list of runner labels
        type: string
        default: '["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15", "windows-2025"]'
      test:
        description: Optional command run with bash after the build; empty runs none
        type: string
        default: ''

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Hang bound, not a work budget.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        id: build
        continue-on-error: true
        run: go build ./... 2>&1 | tee build.txt; exit "${PIPESTATUS[0]}"

      - name: Vet (compiles tests too)
        id: vet
        continue-on-error: true
        run: go vet ./... 2>&1 | tee vet.txt; exit "${PIPESTATUS[0]}"

      - name: Binary runs
        id: run
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: go build -o cozy-bin . && ./cozy-bin --help 2>&1 | head -40 | tee run.txt

      - uses: Swatinem/rust-cache@v2

      - name: Rust build and lint (compiles tests too)
        id: rust
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee rust.txt; exit "${PIPESTATUS[0]}"

      - name: Test
        if: inputs.test != ''
        id: test
        continue-on-error: true
        env:
          TEST: ${{ inputs.test }}
        run: bash -euo pipefail -c "$TEST" 2>&1 | tee test.txt; exit "${PIPESTATUS[0]}"

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.os }}"
            echo "build=${{ steps.build.outcome }} vet=${{ steps.vet.outcome }} run=${{ steps.run.outcome }} rust=${{ steps.rust.outcome }} test=${{ steps.test.outcome }}"
            echo '```'
            cat build.txt vet.txt rust.txt 2>/dev/null | head -200
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cozy-${{ matrix.os }}
          path: |
            build.txt
            vet.txt
            run.txt
            rust.txt
            test.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Verdict
        if: always()
        run: test "${{ steps.build.outcome }}/${{ steps.run.outcome }}/${{ steps.rust.outcome }}" = success/success/success
