name: release-promote
# A cozy candidate is a GitHub prerelease, which `cozy update`, the tensorhub.com installer and Homebrew don't follow.
# Once its gate passed it becomes what users get: GitHub's latest and Homebrew's formula, the same files, nothing
# rebuilt (tracker design ci-v2, pre-release and promotion). release.yml calls it after its own gate; promote.sh
# dispatches it for a set gated together:
#   gh workflow run release-promote.yml -R cozy-creator/cozy-creator -f tag=v0.11.17 -f gate=<run id | hand>
on:
  workflow_dispatch:
    inputs:
      tag:
        description: The candidate's tag (a prerelease)
        type: string
        required: true
      gate:
        description: "The release-gate run that passed it (its id), or hand: a lead's hand gate, the dispatcher vouches"
        type: string
        required: true
  workflow_call:
    inputs:
      tag: { type: string, required: true }
      gate: { type: string, required: true }

permissions:
  contents: write
  actions: read

concurrency:
  group: release-promote

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      GATE: ${{ inputs.gate }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: creator
      - name: The gate passed exactly this candidate
        run: |
          [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isPrerelease -q .isPrerelease)" = true ] \
            || { echo "::error::$TAG is not a candidate (a prerelease)"; exit 1; }
          if [ "$GATE" = hand ]; then echo "$TAG: gated by hand, the dispatcher vouches"; exit 0; fi
          set_=$(creator/release-gate/verify.sh "$GATE")
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p cozy-x86_64-unknown-linux-gnu.tar.gz -D c
          tar -xzf c/cozy-x86_64-unknown-linux-gnu.tar.gz -C c
          sha=$(sha256sum c/cozy-x86_64-unknown-linux-gnu/cozy | cut -d' ' -f1)
          [ "$(jq -r .cozy_sha256 <<< "$set_")" = "$sha" ] || { echo "::error::gate $GATE ran another cozy than $TAG"; exit 1; }
      - name: Latest, for `cozy update` and the installer
        run: gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --prerelease=false --latest
      # dist's homebrew job, moved here: the formula the release carries, pushed over SSH with the tap's deploy key.
      - uses: actions/checkout@v6
        with:
          repository: cozy-creator/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true
          path: tap
      - name: Homebrew
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p cozy.rb -D tap/Formula --clobber
          cd tap
          git config user.name "Paul Fidika"; git config user.email paul@fidika.com
          git add Formula/cozy.rb
          git diff --cached --quiet || { git commit -m "cozy ${TAG#v}"; git push; }
