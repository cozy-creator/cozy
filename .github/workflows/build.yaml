name: build
# The PR check (tracker/design/ci-v2.md §1): the workspace compiles and clippy's deny lints pass (warnings are not
# gates yet: master has 61 in tensorfs). Required for merges into master and rc/*: it runs on the merge queue's
# group (merge_group), on the final PR + branch state; on a pull request it is skipped, which lets the PR be
# queued. A docs-only group passes without building.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.merge_group.head_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Hang bound, not a work budget.
    timeout-minutes: 60
    steps:
      - id: scope
        name: Docs-only changes skip the build
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          files=$([ -z "$BASE" ] || gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --paginate --jq '.files[].filename') || files=
          if [ -n "$files" ] && ! grep -qvE '\.(md|txt|png|jpe?g|svg)$|^docs/|(^|/)LICENSE$' <<< "$files"; then
            echo "docs only"; echo run=false >> "$GITHUB_OUTPUT"
          else
            echo run=true >> "$GITHUB_OUTPUT"
          fi
      - if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v5
      - if: steps.scope.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - if: steps.scope.outputs.run == 'true'
        run: cargo check --workspace --all-targets --locked
      - if: steps.scope.outputs.run == 'true'
        run: cargo clippy --workspace --all-targets --locked
