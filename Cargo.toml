# One workspace for the `cozy` binary (xs-043). The Go tree stays at the root until the cutover.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/cozy-creator/cozy"
homepage = "https://github.com/cozy-creator/cozy"
publish = false

[workspace.dependencies]
calcifer = { path = "crates/calcifer" }
cozy-cli = { path = "crates/cozy-cli" }
cozy-platform = { path = "crates/cozy-platform" }
cozy-proto = { path = "crates/cozy-proto" }
hub-client = { path = "crates/hub-client" }
migrate = { path = "crates/migrate" }

anstream = "1.0.0"
anstyle = "1.0.14"
aws-lc-rs = "1.18"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing"] }
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
comfy-table = "8.0.1"
ed25519-dalek = "2"
figment = { version = "0.10.19", features = ["env", "toml"] }
flate2 = "1.1"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.3"
hex = "0.4"
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
indicatif = "0.18"
infer = { version = "0.22", default-features = false }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
libc = "0.2"
nvml-wrapper = "0.13"
openapiv3 = "2"
prettyplease = "0.2"
progenitor = { version = "0.15.1", default-features = false }
progenitor-client = "0.15.1"
prost = "0.14"
protoc-bin-vendored = "3"
quote = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "query", "rustls", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
self-replace = "1.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sigstore-verify = { version = "0.15", default-features = false, features = ["aws-lc-rs"] }
supports-hyperlinks = "3.2.0"
syn = "2"
tar = "0.4"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7", features = ["io"] }
# figment's toml 0.8 already builds this one.
toml_edit = "0.22.27"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }
url = { version = "2.5.8", features = ["serde"] }
windows-sys = "0.61"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
# Every verb returns the one typed refusal; it is not on a hot path.
result_large_err = "allow"

# What dist builds releases with.
[profile.dist]
inherits = "release"
