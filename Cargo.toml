# One workspace for the `cozy` binary (xs-043). The Go tree stays at the root until the cutover.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.9.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.dependencies]
calcifer = { path = "crates/calcifer" }
cozy-cli = { path = "crates/cozy-cli" }
cozy-platform = { path = "crates/cozy-platform" }
cozy-proto = { path = "crates/cozy-proto" }

anstream = "1.0.0"
anstyle = "1.0.14"
base64 = "0.22"
clap = { version = "4.6", features = ["derive"] }
clap_complete = { version = "4.6.11", features = ["unstable-dynamic"] }
comfy-table = "8.0.1"
ed25519-dalek = "2"
figment = { version = "0.10.19", features = ["env", "toml"] }
getrandom = "0.3"
hex = "0.4"
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
libc = "0.2"
nvml-wrapper = "0.13"
prost = "0.14"
protoc-bin-vendored = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1"
sha2 = "0.10"
supports-hyperlinks = "3.2.0"
tempfile = "3"
thiserror = "2"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = "0.1.19"
# figment's toml 0.8 already builds this one.
toml_edit = "0.22.27"
tonic = { version = "0.14.6", default-features = false, features = ["codegen"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing = "0.1"
url = { version = "2.5.8", features = ["serde"] }
windows-sys = "0.61"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.clippy]
# Every verb returns the one typed refusal; it is not on a hot path.
result_large_err = "allow"
