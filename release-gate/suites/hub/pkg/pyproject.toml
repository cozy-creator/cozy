[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[project]
name = "ci-hub-pkg"
version = "0.1.0"
description = "The hub suite's throwaway package: published, installed, yanked and un-yanked, then retired"
requires-python = ">=3.12"
dependencies = ["cozy-runtime>=0.30", "msgspec>=0.19"]

[project.entry-points."cozy.application"]
default = "ci_hub_pkg:app"

[tool.uv.build-backend]
module-name = "ci_hub_pkg"
module-root = ""
