[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "tensorfs"
version = "0.3.88"
description = "TensorFS — canonical tensor artifact substrate"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
]

[project.optional-dependencies]
torch = ["torch>=2.11", "torchao==0.18.0", "numpy>=1.26"]

[tool.maturin]
manifest-path = "crates/tensorfs-py/Cargo.toml"
module-name = "tensorfs._ext"
python-source = "python"
features = ["extension-module"]
# One artifact, one version (tfs-051): the wheel carries the `tfs` binary at
# .data/scripts/, so `pip install tensorfs==<v>` yields module AND CLI everywhere.
# maturin cannot build a bin target beside a pyo3 extension, so the binary is staged
# here by scripts/build-wheel.sh before maturin runs; a bare `maturin build` without
# the staged binary FAILS rather than emitting a wheel with no tfs.
data = "wheel-data"
